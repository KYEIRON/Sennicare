  &lt;!-- main.js runs the mobile menu and navbar shadow on every page --&gt;
  &lt;script&gt;
/* ==========================================================================
   Sennicare website - JavaScript
   --------------------------------------------------------------------------
   This file does three small jobs:
     1. Opens and closes the mobile menu (the &quot;hamburger&quot; button)
     2. Adds a soft shadow to the navigation bar once you scroll down
     3. Checks the contact form is filled in, then opens the visitor&#x27;s email
        program with their message ready to send to you

   You do not need to understand JavaScript to run the site. The only line you
   may want to edit is SENNICARE_EMAIL just below.
   ========================================================================== */

/* CHANGE THIS to the email address where you want enquiries to arrive. */
var SENNICARE_EMAIL = &#x27;hello@sennicare.co.uk&#x27;;


/* &quot;DOMContentLoaded&quot; means: wait until the page has loaded, then run this. */
document.addEventListener(&#x27;DOMContentLoaded&#x27;, function () {

  /* ======================================================================
     1. MOBILE MENU
     ====================================================================== */
  var navToggle = document.getElementById(&#x27;navToggle&#x27;);
  var navLinks  = document.getElementById(&#x27;navLinks&#x27;);

  if (navToggle &amp;&amp; navLinks) {
    navToggle.addEventListener(&#x27;click&#x27;, function () {
      // &quot;toggle&quot; adds the class if it&#x27;s missing, removes it if it&#x27;s there.
      var isOpen = navLinks.classList.toggle(&#x27;is-open&#x27;);

      // Keep the button&#x27;s label and accessibility state in step.
      navToggle.setAttribute(&#x27;aria-expanded&#x27;, isOpen ? &#x27;true&#x27; : &#x27;false&#x27;);
      navToggle.setAttribute(&#x27;aria-label&#x27;, isOpen ? &#x27;Close menu&#x27; : &#x27;Open menu&#x27;);
    });

    // Close the menu again after someone taps one of the links.
    navLinks.addEventListener(&#x27;click&#x27;, function (event) {
      if (event.target.tagName === &#x27;A&#x27;) {
        navLinks.classList.remove(&#x27;is-open&#x27;);
        navToggle.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
        navToggle.setAttribute(&#x27;aria-label&#x27;, &#x27;Open menu&#x27;);
      }
    });
  }


  /* ======================================================================
     2. SHADOW UNDER THE NAVIGATION BAR WHEN SCROLLED
     ====================================================================== */
  var navbar = document.getElementById(&#x27;navbar&#x27;);

  if (navbar) {
    // This function decides whether the shadow should be on or off.
    var updateNavbar = function () {
      if (window.scrollY &gt; 10) {
        navbar.classList.add(&#x27;is-scrolled&#x27;);
      } else {
        navbar.classList.remove(&#x27;is-scrolled&#x27;);
      }
    };

    updateNavbar();                                   // check once on load
    window.addEventListener(&#x27;scroll&#x27;, updateNavbar);  // then on every scroll
  }


  /* ======================================================================
     3. CONTACT FORM
     A plain website (with no server behind it) cannot send an email on its
     own. So we do the next simplest thing: check the fields are filled in,
     then open the visitor&#x27;s own email app with everything pre-written.

     If you would rather the form emailed you directly without opening the
     visitor&#x27;s email app, see README.md - it is a free, one-line change.
     ====================================================================== */
  var form        = document.getElementById(&#x27;contactForm&#x27;);
  var formMessage = document.getElementById(&#x27;formMessage&#x27;);

  if (form &amp;&amp; formMessage) {

    // Small helper so we can show a message in one line of code.
    var showMessage = function (text, type) {
      formMessage.textContent = text;
      formMessage.className = &#x27;form__message is-visible is-&#x27; + type; // type = &#x27;success&#x27; or &#x27;error&#x27;
    };

    form.addEventListener(&#x27;submit&#x27;, function (event) {
      event.preventDefault();   // stop the browser reloading the page

      // Read what the visitor typed, trimming off any stray spaces.
      var name     = form.name.value.trim();
      var email    = form.email.value.trim();
      var carehome = form.carehome.value.trim();
      var message  = form.message.value.trim();

      // --- Check nothing important is missing ---
      if (!name || !email || !carehome || !message) {
        showMessage(&#x27;Please fill in all four fields so we can help you properly.&#x27;, &#x27;error&#x27;);
        return;   // stop here
      }

      // --- Check the email address looks like an email address ---
      // This pattern means: some characters, an @, some characters, a dot, some characters.
      var looksLikeEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      if (!looksLikeEmail) {
        showMessage(&#x27;That email address does not look quite right. Please check it.&#x27;, &#x27;error&#x27;);
        return;
      }

      // --- Build the email ---
      var subject = &#x27;Free operational review request - &#x27; + carehome;

      // &quot;\n&quot; means &quot;start a new line&quot;. encodeURIComponent makes the text safe
      // to put inside a web link (spaces, ampersands and so on).
      var body =
        &#x27;Name: &#x27; + name + &#x27;\n&#x27; +
        &#x27;Email: &#x27; + email + &#x27;\n&#x27; +
        &#x27;Care home: &#x27; + carehome + &#x27;\n\n&#x27; +
        &#x27;Message:\n&#x27; + message + &#x27;\n&#x27;;

      var mailtoLink = &#x27;mailto:&#x27; + SENNICARE_EMAIL +
                       &#x27;?subject=&#x27; + encodeURIComponent(subject) +
                       &#x27;&amp;body=&#x27;    + encodeURIComponent(body);

      // Open the visitor&#x27;s email program with the message ready to send.
      window.location.href = mailtoLink;

      showMessage(&#x27;Thank you, &#x27; + name + &#x27;. Your email program should now open with &#x27; +
                  &#x27;your enquiry ready to send. If it does not, please email us at &#x27; +
                  SENNICARE_EMAIL + &#x27;.&#x27;, &#x27;success&#x27;);
    });
  }

});

&lt;/script&gt;
  &lt;!-- calculator.js runs the sums on this page only --&gt;
  &lt;script&gt;
/* ==========================================================================
   Sennicare Savings Calculator
   --------------------------------------------------------------------------
   This file does the sums on savings-calculator.html.

   How it works, in plain English:
     1. When the page loads, we find each input box and slider.
     2. Every time the visitor types or drags, we run calculate() again.
     3. calculate() works out the savings and writes them onto the page.

   THE FIGURES YOU MIGHT WANT TO CHANGE are all in the SETTINGS block below.
   For example, change CONSOLIDATION_SAVING from 0.15 to 0.18 and the whole
   calculator switches from assuming a 15% saving to an 18% saving.
   ========================================================================== */


/* ==========================================================================
   SETTINGS - the assumptions behind the calculator
   (0.15 means 15%, 0.30 means 30%, and so on)
   ========================================================================== */
var SETTINGS = {
  CONSOLIDATION_SAVING: 0.15,   // 15% off consumables spend by consolidating suppliers
  ADMIN_TIME_SAVING:    0.30,   // 30% less time spent on ordering and admin
  WASTE_CUT:            0.50,   // we assume we can remove half of current waste
  HOURLY_RATE:          15,     // £15 per hour, used to value the time saved

  /* Used for the &quot;reduce from X suppliers to about Y&quot; recommendation.
     We suggest keeping roughly 40% of the current suppliers, but never
     fewer than 3 (a home always needs a few) - see MIN_CORE_SUPPLIERS. */
  CORE_SUPPLIER_SHARE:  0.40,
  MIN_CORE_SUPPLIERS:   3,

  /* The example figures used when the page first loads, and when someone
     clicks &quot;Reset to example figures&quot;. */
  DEFAULTS: { suppliers: 12, spend: 8000, hours: 10, waste: 8 },

  /* Where enquiries from this page should go. */
  EMAIL: &#x27;hello@sennicare.co.uk&#x27;
};


/* ==========================================================================
   NUMBER FORMATTING HELPERS
   ========================================================================== */

/* Turns 12345.67 into &quot;£12,346&quot; (pounds, with commas, no pence).
   We round to whole pounds because these are estimates, not invoices. */
function formatPounds(amount) {
  return &#x27;£&#x27; + Math.round(amount).toLocaleString(&#x27;en-GB&#x27;);
}

/* Turns 156 into &quot;156 hours&quot; (and 1 into &quot;1 hour&quot;). */
function formatHours(hours) {
  var rounded = Math.round(hours);
  return rounded.toLocaleString(&#x27;en-GB&#x27;) + (rounded === 1 ? &#x27; hour&#x27; : &#x27; hours&#x27;);
}

/* Safely reads a number from an input box.
   If the box is empty or contains something odd, we treat it as 0 so the
   calculator never shows &quot;NaN&quot; (which means &quot;not a number&quot;). */
function readNumber(element) {
  var value = parseFloat(element.value);
  if (isNaN(value) || value &lt; 0) { return 0; }
  return value;
}


/* ==========================================================================
   MAIN CODE - runs once the page has loaded
   ========================================================================== */
document.addEventListener(&#x27;DOMContentLoaded&#x27;, function () {

  /* ---- Find the four inputs. If they&#x27;re not on this page, stop here. ---- */
  var inputs = {
    suppliers: document.getElementById(&#x27;suppliers&#x27;),
    spend:     document.getElementById(&#x27;spend&#x27;),
    hours:     document.getElementById(&#x27;hours&#x27;),
    waste:     document.getElementById(&#x27;waste&#x27;)
  };
  if (!inputs.suppliers || !inputs.spend || !inputs.hours || !inputs.waste) {
    return;   // not the calculator page - nothing to do
  }

  /* ---- Find the places on the page where we write the answers ---- */
  var out = {
    suppliersValue:  document.getElementById(&#x27;suppliersValue&#x27;),
    wasteValue:      document.getElementById(&#x27;wasteValue&#x27;),
    wasteHint:       document.getElementById(&#x27;wasteHint&#x27;),
    recommendBox:    document.getElementById(&#x27;recommendBox&#x27;),
    consolidation:   document.getElementById(&#x27;resultConsolidation&#x27;),
    waste:           document.getElementById(&#x27;resultWaste&#x27;),
    wasteNote:       document.getElementById(&#x27;resultWasteNote&#x27;),
    hours:           document.getElementById(&#x27;resultHours&#x27;),
    hoursNote:       document.getElementById(&#x27;resultHoursNote&#x27;),
    total:           document.getElementById(&#x27;resultTotal&#x27;),
    totalNote:       document.getElementById(&#x27;resultTotalNote&#x27;),
    ctaBookReview:   document.getElementById(&#x27;ctaBookReview&#x27;),
    ctaEmailResults: document.getElementById(&#x27;ctaEmailResults&#x27;)
  };


  /* ======================================================================
     THE SUMS
     Takes the four answers, returns all the figures we want to show.
     ====================================================================== */
  function work_out_savings(suppliers, monthlySpend, weeklyHours, wastePercent) {

    // Turn the monthly spend into a yearly figure, and the % into a decimal.
    var annualSpend  = monthlySpend * 12;
    var wasteShare   = wastePercent / 100;        // e.g. 8% becomes 0.08

    // 1. Saving from using fewer, bigger suppliers
    var consolidationSaving = annualSpend * SETTINGS.CONSOLIDATION_SAVING;

    // 2. Saving from cutting waste in half
    var currentWasteCost = annualSpend * wasteShare;
    var wasteSaving      = currentWasteCost * SETTINGS.WASTE_CUT;

    // 3. Staff hours given back each year, and what those hours are worth
    var annualAdminHours = weeklyHours * 52;
    var hoursSaved       = annualAdminHours * SETTINGS.ADMIN_TIME_SAVING;
    var timeValue        = hoursSaved * SETTINGS.HOURLY_RATE;

    // 4. Everything added together
    var totalBenefit = consolidationSaving + wasteSaving + timeValue;

    // 5. How many core suppliers we&#x27;d suggest keeping.
    //    Math.ceil rounds up; Math.max keeps it at 3 or more; Math.min makes
    //    sure we never suggest MORE suppliers than they already have.
    var coreSuppliers = Math.ceil(suppliers * SETTINGS.CORE_SUPPLIER_SHARE);
    coreSuppliers = Math.max(coreSuppliers, SETTINGS.MIN_CORE_SUPPLIERS);
    coreSuppliers = Math.min(coreSuppliers, suppliers);

    return {
      annualSpend:         annualSpend,
      consolidationSaving: consolidationSaving,
      currentWasteCost:    currentWasteCost,
      wasteSaving:         wasteSaving,
      hoursSaved:          hoursSaved,
      timeValue:           timeValue,
      totalBenefit:        totalBenefit,
      coreSuppliers:       coreSuppliers
    };
  }


  /* ======================================================================
     WRITING THE ANSWERS ONTO THE PAGE
     ====================================================================== */
  function calculate() {

    // --- Read what the visitor has entered ---
    var suppliers    = readNumber(inputs.suppliers);
    var monthlySpend = readNumber(inputs.spend);
    var weeklyHours  = readNumber(inputs.hours);
    var wastePercent = readNumber(inputs.waste);

    // --- Do the maths ---
    var r = work_out_savings(suppliers, monthlySpend, weeklyHours, wastePercent);

    // --- Update the live labels next to the two sliders ---
    out.suppliersValue.textContent = suppliers + (suppliers === 1 ? &#x27; supplier&#x27; : &#x27; suppliers&#x27;);
    out.wasteValue.textContent     = wastePercent + &#x27;%&#x27;;

    // Show the £ value of their waste, so the percentage means something real
    out.wasteHint.textContent = wastePercent === 0
      ? &#x27;Stock thrown away, expired or over-ordered, as a share of your spend.&#x27;
      : &#x27;That is about &#x27; + formatPounds(r.currentWasteCost) + &#x27; of stock wasted a year.&#x27;;

    // --- The plain-English recommendation ---
    if (suppliers &lt;= SETTINGS.MIN_CORE_SUPPLIERS) {
      out.recommendBox.innerHTML =
        &#x27;With just &lt;strong&gt;&#x27; + suppliers + &#x27;&lt;/strong&gt; supplier&#x27; + (suppliers === 1 ? &#x27;&#x27; : &#x27;s&#x27;) +
        &#x27;, your supply chain is already tight. The bigger wins for you are likely to be &#x27; +
        &#x27;in pricing, stock control and admin time &amp;mdash; all of which we review too.&#x27;;
    } else {
      out.recommendBox.innerHTML =
        &#x27;We would typically consolidate &lt;strong&gt;&#x27; + suppliers + &#x27; suppliers&lt;/strong&gt; down to &#x27; +
        &#x27;around &lt;strong&gt;&#x27; + r.coreSuppliers + &#x27; core partners&lt;/strong&gt;, on an annual consumables &#x27; +
        &#x27;spend of &lt;strong&gt;&#x27; + formatPounds(r.annualSpend) + &#x27;&lt;/strong&gt;.&#x27;;
    }

    // --- The three results and the total ---
    out.consolidation.textContent = formatPounds(r.consolidationSaving);

    out.waste.textContent = formatPounds(r.wasteSaving);
    out.wasteNote.textContent = wastePercent === 0
      ? &#x27;Set your waste estimate above to include this&#x27;
      : &#x27;Based on halving &#x27; + formatPounds(r.currentWasteCost) + &#x27; of current waste&#x27;;

    out.hours.textContent = formatHours(r.hoursSaved);
    out.hoursNote.textContent =
      &#x27;A &#x27; + (SETTINGS.ADMIN_TIME_SAVING * 100) + &#x27;% cut in admin time, worth &#x27; +
      formatPounds(r.timeValue) + &#x27; at &#x27; + formatPounds(SETTINGS.HOURLY_RATE) + &#x27; per hour&#x27;;

    out.total.textContent = formatPounds(r.totalBenefit);
    out.totalNote.textContent = &#x27;including &#x27; + formatHours(r.hoursSaved) + &#x27; of staff time given back&#x27;;

    // --- Keep the two email links up to date with these figures ---
    updateEmailLinks(suppliers, monthlySpend, weeklyHours, wastePercent, r);
  }


  /* ======================================================================
     THE EMAIL LINKS
     A &quot;mailto:&quot; link opens the visitor&#x27;s own email program with the subject
     and message already written. encodeURIComponent makes the text safe to
     put inside a link. &quot;%0D%0A&quot; is how you write a new line in a mailto link.
     ====================================================================== */
  function updateEmailLinks(suppliers, monthlySpend, weeklyHours, wastePercent, r) {

    // The summary of their figures, used in both emails.
    var summary = [
      &#x27;My figures:&#x27;,
      &#x27;- Suppliers used: &#x27; + suppliers,
      &#x27;- Monthly consumables spend: &#x27; + formatPounds(monthlySpend),
      &#x27;- Weekly ordering/admin hours: &#x27; + weeklyHours,
      &#x27;- Estimated stock waste: &#x27; + wastePercent + &#x27;%&#x27;,
      &#x27;&#x27;,
      &#x27;Sennicare calculator estimate:&#x27;,
      &#x27;- Supply consolidation saving: &#x27; + formatPounds(r.consolidationSaving) + &#x27; a year&#x27;,
      &#x27;- Waste reduction saving: &#x27; + formatPounds(r.wasteSaving) + &#x27; a year&#x27;,
      &#x27;- Staff time given back: &#x27; + formatHours(r.hoursSaved) + &#x27; a year (&#x27; + formatPounds(r.timeValue) + &#x27;)&#x27;,
      &#x27;- Total estimated annual benefit: &#x27; + formatPounds(r.totalBenefit),
      &#x27;&#x27;,
      &#x27;Suggested consolidation: &#x27; + suppliers + &#x27; suppliers down to about &#x27; + r.coreSuppliers + &#x27; core partners.&#x27;
    ].join(&#x27;\r\n&#x27;);

    // Link 1: the big magenta button - an enquiry addressed to Sennicare
    var bookSubject = &#x27;Free operational review request - estimated &#x27; +
                      formatPounds(r.totalBenefit) + &#x27; annual benefit&#x27;;
    var bookBody =
      &#x27;Hello Sennicare,\r\n\r\n&#x27; +
      &#x27;I have used your savings calculator and would like a detailed breakdown, &#x27; +
      &#x27;plus a free operational review of my home.\r\n\r\n&#x27; +
      summary + &#x27;\r\n\r\n&#x27; +
      &#x27;My care home: \r\n&#x27; +
      &#x27;My name: \r\n&#x27; +
      &#x27;Best contact number: \r\n&#x27;;

    out.ctaBookReview.setAttribute(&#x27;href&#x27;,
      &#x27;mailto:&#x27; + SETTINGS.EMAIL +
      &#x27;?subject=&#x27; + encodeURIComponent(bookSubject) +
      &#x27;&amp;body=&#x27;    + encodeURIComponent(bookBody));

    // Link 2: the small link - the results emailed to whoever they choose,
    // with no address filled in, so it goes to themselves or a colleague.
    var resultsSubject = &#x27;Sennicare savings estimate - &#x27; + formatPounds(r.totalBenefit) + &#x27; a year&#x27;;
    var resultsBody =
      &#x27;Sennicare savings estimate\r\n&#x27; +
      &#x27;(from sennicare.co.uk/savings-calculator.html)\r\n\r\n&#x27; +
      summary + &#x27;\r\n\r\n&#x27; +
      &#x27;These are estimates based on typical results across UK care homes, not a &#x27; +
      &#x27;guarantee. A free operational review gives exact figures from real invoices.\r\n\r\n&#x27; +
      &#x27;Sennicare - Empowering Caregivers\r\n&#x27; +
      SETTINGS.EMAIL + &#x27;\r\n&#x27;;

    out.ctaEmailResults.setAttribute(&#x27;href&#x27;,
      &#x27;mailto:?subject=&#x27; + encodeURIComponent(resultsSubject) +
      &#x27;&amp;body=&#x27;           + encodeURIComponent(resultsBody));
  }


  /* ======================================================================
     LISTEN FOR CHANGES
     &quot;input&quot; fires the moment someone types a character or moves a slider,
     so the results update live - no Calculate button needed.
     ====================================================================== */
  Object.keys(inputs).forEach(function (key) {
    inputs[key].addEventListener(&#x27;input&#x27;, calculate);
  });

  /* ---- The &quot;Reset to example figures&quot; button ---- */
  var resetButton = document.getElementById(&#x27;calcReset&#x27;);
  if (resetButton) {
    resetButton.addEventListener(&#x27;click&#x27;, function () {
      inputs.suppliers.value = SETTINGS.DEFAULTS.suppliers;
      inputs.spend.value     = SETTINGS.DEFAULTS.spend;
      inputs.hours.value     = SETTINGS.DEFAULTS.hours;
      inputs.waste.value     = SETTINGS.DEFAULTS.waste;
      calculate();   // redraw the results with the example figures
    });
  }

  /* ---- Work out the figures once, straight away, so the page never shows
          empty results when it first loads. ---- */
  calculate();

});

&lt;/script&gt;

&lt;script&gt;
document.addEventListener(&#x27;click&#x27;, function (e) {
  var a = e.target.closest &amp;&amp; e.target.closest(&#x27;a[href]&#x27;);
  if (!a) return;
  var href = a.getAttribute(&#x27;href&#x27;) || &#x27;&#x27;;
  if (href.charAt(0) === &#x27;#&#x27; || /^(mailto:|tel:|https?:)/.test(href)) return;
  var m = href.match(/([A-Za-z0-9._-]+\.html)(#.*)?$/);
  if (!m) return;
  e.preventDefault();
  parent.postMessage({ sennicareGoTo: m[1] }, &#x27;*&#x27;);
});
&lt;/script&gt;

/* ==========================================================================
   Sennicare website styles
   --------------------------------------------------------------------------
   HOW THIS FILE IS ORGANISED (top to bottom):
     1. Brand colours and other settings (CSS &quot;variables&quot;)
     2. Basic resets and page-wide defaults
     3. Reusable pieces (buttons, section headings, cards)
     4. Each section of the page, in the order it appears
     5. Mobile / tablet adjustments at the very bottom

   TIP: To change a brand colour everywhere on the site, you only need to edit
   the values in section 1 below. Nothing else needs touching.
   ========================================================================== */


/* ==========================================================================
   1. BRAND SETTINGS (CSS variables)
   A &quot;variable&quot; is just a saved value with a name. We write --navy: #0A1172
   once, then use var(--navy) everywhere we want that colour.
   ========================================================================== */
:root {
  /* Brand colours */
  --navy:        #0A1172;  /* Deep navy blue - main brand colour, headings, structure */
  --magenta:     #E30B5C;  /* Bright magenta pink - call-to-action buttons, accents */
  --cyan:        #00B2D9;  /* Vibrant cyan blue - secondary accents, highlights */
  --white:       #FFFFFF;  /* White - page backgrounds */
  --grey-light:  #F5F7FA;  /* Light grey - card and section backgrounds */

  /* Supporting colours, derived from the brand palette */
  --navy-dark:   #070C52;  /* Slightly darker navy, used for button hover states */
  --magenta-dark:#C10A4E;  /* Slightly darker magenta, used for button hover states */
  --text-body:   #454B66;  /* Soft navy-grey for body text (easier to read than pure black) */
  --border:      #E3E8F0;  /* Very light grey for borders and dividers */

  /* Typography: a clean modern sans-serif. We list several fonts so the
     browser uses the first one available on the visitor&#x27;s computer. */
  --font: &quot;Inter&quot;, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;

  /* Layout settings */
  --max-width: 1180px;  /* How wide the content can grow on large screens */
  --radius:    16px;    /* Standard rounded-corner size */
  --nav-height: 84px;   /* Height of the fixed navigation bar */

  /* Shadows, for a soft &quot;lifted card&quot; look */
  --shadow-soft:  0 4px 16px rgba(10, 17, 114, 0.07);
  --shadow-lift:  0 14px 32px rgba(10, 17, 114, 0.14);
}


/* ==========================================================================
   2. RESETS AND PAGE DEFAULTS
   ========================================================================== */

/* box-sizing: border-box makes width calculations behave predictably
   (padding and borders are counted inside an element&#x27;s width). */
*, *::before, *::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.65;
  color: var(--text-body);
  background: var(--white);
  -webkit-font-smoothing: antialiased;  /* Slightly crisper text on Macs */
}

/* Smooth scrolling when a visitor clicks a menu link.
   scroll-padding-top stops the fixed navbar covering the section heading. */
html {
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--nav-height) + 16px);
}

/* Headings use navy and a tighter line height than body text */
h1, h2, h3, h4 {
  color: var(--navy);
  line-height: 1.15;
  margin: 0 0 0.5em;
  font-weight: 800;
  letter-spacing: -0.02em;
}

p { margin: 0 0 1em; }

a { color: var(--navy); text-decoration: none; }
a:hover { text-decoration: underline; }

img, svg { max-width: 100%; display: block; }

/* A &quot;container&quot; centres content and stops it stretching too wide */
.container {
  width: 100%;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 24px;
}

/* Standard vertical spacing for a page section */
.section {
  padding: 88px 0;
}
.section--grey { background: var(--grey-light); }

/* Visible focus outline for keyboard users (accessibility) */
a:focus-visible,
button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 3px solid var(--cyan);
  outline-offset: 2px;
}


/* ==========================================================================
   3. REUSABLE PIECES
   ========================================================================== */

/* ---- Buttons ---- */
.btn {
  display: inline-block;
  padding: 15px 30px;
  border: none;
  border-radius: 8px;
  font-family: var(--font);
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  /* &quot;transition&quot; makes hover changes fade in smoothly instead of snapping */
  transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
}
.btn:hover { text-decoration: none; }

/* Main magenta call-to-action button */
.btn--primary {
  background: var(--magenta);
  color: var(--white);
}
.btn--primary:hover {
  background: var(--magenta-dark);
  transform: translateY(-2px);              /* lifts by 2 pixels on hover */
  box-shadow: 0 10px 22px rgba(227, 11, 92, 0.32);
}

/* Smaller version, used in the navigation bar */
.btn--nav { padding: 12px 24px; font-size: 16px; }

/* Larger version, used in the big call-to-action section */
.btn--large { padding: 19px 44px; font-size: 19px; }

/* ---- Section headings ---- */
.section__head {
  max-width: 660px;
  margin-bottom: 48px;
}
.section__title {
  font-size: 40px;
  margin-bottom: 12px;
}
.section__subtitle {
  font-size: 19px;
  margin: 0;
}

/* A short coloured line used above some headings as a small accent */
.eyebrow {
  display: inline-block;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--cyan);
  margin-bottom: 12px;
}

/* ---- Icon badge (the small rounded square behind each icon) ---- */
.icon-badge {
  width: 52px;
  height: 52px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
  background: rgba(0, 178, 217, 0.12);   /* pale cyan by default */
  color: var(--cyan);                    /* the icon inherits this colour */
  flex-shrink: 0;
}
.icon-badge--magenta {
  background: rgba(227, 11, 92, 0.10);
  color: var(--magenta);
}
.icon-badge--navy {
  background: rgba(10, 17, 114, 0.08);
  color: var(--navy);
}
/* Our icons are SVG line drawings; this makes them follow the colour above */
.icon-badge svg { width: 26px; height: 26px; stroke: currentColor; fill: none; }


/* ==========================================================================
   4a. NAVIGATION BAR (fixed to the top of the screen)
   ========================================================================== */
.navbar {
  position: fixed;         /* stays put while the page scrolls */
  top: 0; left: 0; right: 0;
  z-index: 100;            /* sits above everything else */
  height: var(--nav-height);
  background: var(--white);
  display: flex;
  align-items: center;
  transition: box-shadow 0.2s ease;
}
/* JavaScript adds this class once the visitor scrolls, adding a subtle shadow */
.navbar.is-scrolled { box-shadow: 0 2px 14px rgba(10, 17, 114, 0.09); }

.navbar__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  width: 100%;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 24px;
}

/* Logo + company name */
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 26px;
  font-weight: 800;
  color: var(--navy);
  letter-spacing: -0.02em;
}
.brand:hover { text-decoration: none; }
.brand__mark { width: 38px; height: 38px; }

/* Menu links */
.navbar__links {
  display: flex;
  align-items: center;
  gap: 34px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.navbar__links a {
  font-size: 17px;
  font-weight: 500;
  color: var(--navy);
  padding: 6px 0;
  border-bottom: 2px solid transparent;   /* invisible until hover */
  transition: border-color 0.2s ease, color 0.2s ease;
}
.navbar__links a:hover {
  text-decoration: none;
  color: var(--magenta);
  border-bottom-color: var(--magenta);
}
/* The magenta button inside the links list is for the mobile menu only,
   so it stays hidden on tablets and desktops (where .navbar__cta shows instead). */
.navbar__links-cta { display: none; }

/* Hamburger menu button - hidden on desktop, shown on mobile */
.navbar__toggle {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px;
  color: var(--navy);
}
.navbar__toggle svg { width: 28px; height: 28px; stroke: currentColor; fill: none; }


/* ==========================================================================
   4b. HERO SECTION
   ========================================================================== */
.hero {
  padding: calc(var(--nav-height) + 28px) 0 32px;
}
.hero__card {
  position: relative;              /* lets us layer text on top of the image */
  border-radius: 22px;
  overflow: hidden;                /* keeps the image inside the rounded corners */
  min-height: 430px;
  display: flex;
  align-items: center;
  box-shadow: var(--shadow-soft);
  background: var(--navy);         /* shows while the photo loads */
}
.hero__image {
  position: absolute;
  inset: 0;                        /* fills the whole card */
  width: 100%;
  height: 100%;
  object-fit: cover;               /* crops rather than squashes the photo */
}
/* A dark gradient over the photo so white text stays readable */
.hero__overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(100deg,
              rgba(10, 17, 114, 0.78) 0%,
              rgba(10, 17, 114, 0.45) 45%,
              rgba(10, 17, 114, 0.05) 78%);
}
.hero__content {
  position: relative;              /* sits above the image and overlay */
  padding: 56px 48px;
  max-width: 620px;
}
.hero__title {
  color: var(--white);
  font-size: clamp(42px, 6vw, 74px);   /* grows with the screen, within limits */
  margin-bottom: 18px;
  text-shadow: 0 2px 18px rgba(0, 0, 0, 0.25);
}
.hero__subtitle {
  color: rgba(255, 255, 255, 0.94);
  font-size: 21px;
  margin-bottom: 32px;
  max-width: 480px;
}

/* Three small trust statements underneath the hero */
.hero__stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 28px;
}
.hero__stat {
  background: var(--grey-light);
  border-radius: var(--radius);
  padding: 20px 24px;
}
.hero__stat strong {
  display: block;
  font-size: 26px;
  color: var(--navy);
  line-height: 1.2;
}
.hero__stat span { font-size: 15px; }


/* ==========================================================================
   4c. OUR INTEGRATED SERVICES
   ========================================================================== */
.services__grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);   /* three equal-width columns */
  gap: 26px;
}
.service-card {
  background: var(--grey-light);
  border-radius: var(--radius);
  padding: 30px 28px 34px;
  /* The thin coloured line along the bottom of each card */
  border-bottom: 4px solid var(--cyan);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
/* Card 3 uses magenta instead of cyan */
.service-card--magenta { border-bottom-color: var(--magenta); }

.service-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow-lift);
}
.service-card h3 { font-size: 22px; margin-bottom: 8px; }
.service-card p  { margin: 0; }


/* ==========================================================================
   4d. HOW SENNICARE WORKS (3 steps)
   ========================================================================== */
.steps {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
  counter-reset: step;      /* starts the automatic 1, 2, 3 numbering */
}
.step {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 34px 28px;
  position: relative;
}
/* The big numbered circle-free badge, generated automatically */
.step::before {
  counter-increment: step;
  content: counter(step);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 46px;
  border-radius: 12px;
  background: var(--navy);
  color: var(--white);
  font-size: 21px;
  font-weight: 800;
  margin-bottom: 18px;
}
.step h3 { font-size: 21px; margin-bottom: 8px; }
.step p  { margin: 0; }


/* ==========================================================================
   4e. WHY CARE HOMES CHOOSE SENNICARE (4 benefits)
   ========================================================================== */
.benefits {
  display: grid;
  grid-template-columns: repeat(2, 1fr);   /* two per row on desktop */
  gap: 30px 40px;
}
.benefit {
  display: flex;
  gap: 18px;
  align-items: flex-start;
}
.benefit h3 { font-size: 20px; margin-bottom: 6px; }
.benefit p  { margin: 0; }


/* ==========================================================================
   4f. SAVINGS CALCULATOR (Phase 2 - the section that holds the tool)
   ========================================================================== */
.calc-embed {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-soft);
  overflow: hidden;
}


/* ==========================================================================
   4g. BIG CALL-TO-ACTION BAND (full-width navy)
   ========================================================================== */
.cta-band {
  background: var(--navy);
  padding: 84px 0;
  text-align: center;
}
.cta-band h2 {
  color: var(--white);
  font-size: 40px;
  margin-bottom: 14px;
}
.cta-band p {
  color: rgba(255, 255, 255, 0.88);
  font-size: 20px;
  margin-bottom: 34px;
}


/* ==========================================================================
   4h. CONTACT FORM
   ========================================================================== */
.contact {
  display: grid;
  grid-template-columns: 1fr 1.15fr;   /* text on the left, form on the right */
  gap: 56px;
  align-items: start;
}
.contact__list {
  list-style: none;
  padding: 0;
  margin: 24px 0 0;
}
.contact__list li {
  display: flex;
  gap: 12px;
  margin-bottom: 14px;
}
.contact__list svg {
  width: 22px; height: 22px;
  stroke: var(--cyan); fill: none;
  flex-shrink: 0; margin-top: 4px;
}

.form {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 30px;
  box-shadow: var(--shadow-soft);
}
.form__row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}
.form__field { margin-bottom: 18px; }
.form__field label {
  display: block;
  font-size: 15px;
  font-weight: 600;
  color: var(--navy);
  margin-bottom: 6px;
}
.form__field input,
.form__field textarea {
  width: 100%;
  padding: 13px 14px;
  font-family: var(--font);
  font-size: 16px;
  color: var(--navy);
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  transition: border-color 0.2s ease;
}
.form__field input:focus,
.form__field textarea:focus {
  border-color: var(--cyan);
}
.form__field textarea { resize: vertical; min-height: 120px; }

.form__note { font-size: 14px; margin: 14px 0 0; }

/* The green/red message shown after someone submits the form */
.form__message {
  display: none;                 /* JavaScript reveals this when needed */
  margin-top: 16px;
  padding: 14px 16px;
  border-radius: 8px;
  font-size: 16px;
}
.form__message.is-visible { display: block; }
.form__message.is-success {
  background: rgba(0, 178, 217, 0.10);
  color: var(--navy);
  border: 1px solid var(--cyan);
}
.form__message.is-error {
  background: rgba(227, 11, 92, 0.08);
  color: var(--magenta-dark);
  border: 1px solid var(--magenta);
}


/* ==========================================================================
   4i. FOOTER
   ========================================================================== */
.footer {
  background: var(--navy);
  color: rgba(255, 255, 255, 0.78);
  padding: 60px 0 28px;
  font-size: 16px;
}
.footer__top {
  display: grid;
  grid-template-columns: 1.6fr 1fr 1fr;
  gap: 40px;
  padding-bottom: 36px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.16);
}
.footer .brand { color: var(--white); }
.footer__tagline { margin: 14px 0 0; max-width: 320px; }
.footer h4 {
  color: var(--white);
  font-size: 16px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 16px;
}
.footer ul { list-style: none; margin: 0; padding: 0; }
.footer li { margin-bottom: 10px; }
.footer a { color: rgba(255, 255, 255, 0.78); }
.footer a:hover { color: var(--white); }

.footer__bottom {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding-top: 22px;
  font-size: 15px;
}


/* ==========================================================================
   4j. SIMPLE LEGAL / TEXT PAGES (privacy.html, terms.html)
   ========================================================================== */
.page-header {
  background: var(--grey-light);
  padding: calc(var(--nav-height) + 56px) 0 56px;
}
.page-header h1 { font-size: 44px; margin-bottom: 8px; }
.prose { max-width: 760px; }
.prose h2 { font-size: 26px; margin-top: 40px; }
.prose ul { padding-left: 22px; }
.prose li { margin-bottom: 8px; }


/* ==========================================================================
   5. RESPONSIVE ADJUSTMENTS
   A &quot;media query&quot; applies styles only when the screen is a certain size.
   max-width: 900px means &quot;on screens 900 pixels wide or narrower&quot;.
   ========================================================================== */

/* --- Tablet --- */
@media (max-width: 980px) {
  .services__grid,
  .steps {
    grid-template-columns: 1fr 1fr;   /* three columns become two */
  }
  .contact { grid-template-columns: 1fr; gap: 34px; }
  .section__title, .cta-band h2 { font-size: 34px; }
  .footer__top { grid-template-columns: 1fr 1fr; }
}

/* --- Small laptops and tablets: slightly tighter menu spacing ---
   This keeps the five menu links on one line for as long as possible. */
@media (max-width: 1150px) {
  .navbar__links { gap: 24px; }
  .navbar__links a { font-size: 16px; }
}

/* --- Tablets and phones: swap the menu for the hamburger button ---
   Below 980 pixels there isn&#x27;t room for five links plus the button, so we
   collapse them into the drop-down menu. */
@media (max-width: 979px) {
  /* Show the hamburger button, hide the desktop menu and desktop button */
  .navbar__toggle { display: block; }
  .navbar__cta { display: none; }

  /* The mobile menu: a white panel that drops down below the navbar.
     It is hidden until JavaScript adds the &quot;is-open&quot; class. */
  .navbar__links {
    display: none;
    position: absolute;
    top: var(--nav-height);
    left: 0; right: 0;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    background: var(--white);
    padding: 8px 24px 20px;
    box-shadow: 0 12px 22px rgba(10, 17, 114, 0.12);
  }
  .navbar__links.is-open { display: flex; }
  .navbar__links li { border-bottom: 1px solid var(--border); }
  .navbar__links a { display: block; padding: 14px 0; border-bottom: none; font-size: 17px; }
  /* Show the magenta CTA at the bottom of the open mobile menu */
  .navbar__links-cta { display: block; border-bottom: none !important; margin-top: 16px; }
  .navbar__links-cta a { color: var(--white); font-weight: 700; padding: 15px 30px; text-align: center; }
  .navbar__links-cta a:hover { color: var(--white); }
}

/* --- Mobile phones --- */
@media (max-width: 700px) {
  body { font-size: 16px; }
  .section { padding: 60px 0; }

  /* Everything stacks into a single column */
  .services__grid,
  .steps,
  .benefits,
  .hero__stats,
  .form__row,
  .footer__top {
    grid-template-columns: 1fr;
  }

  .hero { padding-top: calc(var(--nav-height) + 16px); }
  .hero__card { min-height: 0; }
  .hero__content { padding: 40px 26px; }
  .hero__subtitle { font-size: 18px; }
  /* On small screens a side-to-side gradient looks odd, so fade top-to-bottom */
  .hero__overlay {
    background: linear-gradient(180deg,
                rgba(10, 17, 114, 0.55) 0%,
                rgba(10, 17, 114, 0.82) 100%);
  }

  .cta-band { padding: 60px 0; }
  .btn--large { padding: 17px 32px; font-size: 18px; }
  .page-header h1 { font-size: 34px; }
}

/* Respect visitors who ask their device to reduce animation (accessibility) */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; }
}


/* ==========================================================================
   6. SAVINGS CALCULATOR (used by savings-calculator.html)
   These styles are only used on the calculator page. They reuse the same
   brand colours and fonts defined at the top of this file.
   ========================================================================== */

/* The overall two-column layout: inputs on the left, results on the right.
   &quot;1fr 1fr&quot; means two equal columns. On mobile this becomes one column
   (see the media query at the bottom of this section). */
.calc {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 34px;
  align-items: start;
}

/* ---- Left column: the input panel ---- */
.calc__inputs {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 30px;
  box-shadow: var(--shadow-soft);
}
.calc__inputs h2 { font-size: 24px; margin-bottom: 6px; }
.calc__intro { font-size: 16px; margin-bottom: 26px; }

/* One question (label + input) */
.calc-field { margin-bottom: 26px; }
.calc-field:last-of-type { margin-bottom: 8px; }

/* The label sits on one line, with the current value shown on the right */
.calc-field__top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 10px;
}
.calc-field__label {
  font-size: 16px;
  font-weight: 600;
  color: var(--navy);
}
/* The live value shown beside a slider, e.g. &quot;14 suppliers&quot; or &quot;8%&quot; */
.calc-field__value {
  font-size: 17px;
  font-weight: 800;
  color: var(--cyan);
  white-space: nowrap;
}
.calc-field__hint {
  font-size: 14px;
  color: var(--text-body);
  margin: 8px 0 0;
}

/* A text box for typing a number, with a £ symbol tucked inside on the left */
.calc-money {
  position: relative;
}
.calc-money__symbol {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 17px;
  font-weight: 700;
  color: var(--navy);
  pointer-events: none;   /* clicks pass through to the input behind it */
}
.calc-field input[type=&quot;number&quot;] {
  width: 100%;
  padding: 13px 14px;
  font-family: var(--font);
  font-size: 17px;
  font-weight: 600;
  color: var(--navy);
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  transition: border-color 0.2s ease;
}
.calc-money input[type=&quot;number&quot;] { padding-left: 32px; }   /* room for the £ */
.calc-field input[type=&quot;number&quot;]:focus { border-color: var(--cyan); }

/* ---- Sliders ----
   Sliders need a few browser-specific lines to look the same everywhere.
   &quot;appearance: none&quot; removes the browser&#x27;s default look so ours shows. */
.calc-field input[type=&quot;range&quot;] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 8px;
  margin: 6px 0;
  border-radius: 999px;
  background: var(--border);   /* the track the handle slides along */
  cursor: pointer;
}
/* The round handle - Chrome, Edge and Safari */
.calc-field input[type=&quot;range&quot;]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--cyan);
  border: 4px solid var(--white);
  box-shadow: 0 2px 8px rgba(10, 17, 114, 0.28);
  cursor: pointer;
}
/* The round handle - Firefox */
.calc-field input[type=&quot;range&quot;]::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--cyan);
  border: 4px solid var(--white);
  box-shadow: 0 2px 8px rgba(10, 17, 114, 0.28);
  cursor: pointer;
}
/* Small &quot;1&quot; and &quot;30&quot; labels under a slider, showing its range */
.calc-field__scale {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--text-body);
  margin-top: 2px;
}

/* The little &quot;Reset&quot; link at the bottom of the inputs panel */
.calc__reset {
  background: none;
  border: none;
  padding: 0;
  margin-top: 6px;
  font-family: var(--font);
  font-size: 15px;
  font-weight: 600;
  color: var(--cyan);
  cursor: pointer;
  text-decoration: underline;
}

/* ---- Right column: the results panel ---- */
/* &quot;sticky&quot; keeps the results visible on screen while you scroll the inputs. */
.calc__results {
  position: sticky;
  top: calc(var(--nav-height) + 20px);
}

/* A single result: big number + label */
.result {
  background: var(--grey-light);
  border-radius: var(--radius);
  padding: 22px 24px;
  margin-bottom: 16px;
  border-left: 4px solid var(--cyan);
}
.result__label {
  display: block;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-body);
  margin-bottom: 4px;
}
.result__value {
  display: block;
  font-size: 38px;
  font-weight: 800;
  line-height: 1.1;
  color: var(--navy);
  letter-spacing: -0.02em;
}
.result__note {
  display: block;
  font-size: 14px;
  color: var(--text-body);
  margin-top: 6px;
}

/* The headline total, highlighted in magenta */
.result--total {
  background: rgba(227, 11, 92, 0.06);   /* very pale magenta tint */
  border: 2px solid var(--magenta);
  border-left-width: 6px;
  padding: 28px;
}
.result--total .result__label {
  color: var(--magenta-dark);
  font-size: 16px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.result--total .result__value {
  color: var(--magenta);
  font-size: 54px;
}
/* The &quot;plus X hours given back&quot; line under the total */
.result--total .result__note {
  font-size: 17px;
  font-weight: 600;
  color: var(--navy);
  margin-top: 10px;
}

/* The consolidation recommendation box */
.calc-recommend {
  background: var(--navy);
  color: rgba(255, 255, 255, 0.9);
  border-radius: var(--radius);
  padding: 22px 24px;
  margin-bottom: 16px;
  font-size: 16px;
}
.calc-recommend strong { color: var(--white); }

/* The call-to-action block underneath the results */
.calc-cta {
  margin-top: 22px;
  text-align: center;
}
.calc-cta .btn { width: 100%; }
.calc-cta__secondary {
  display: inline-block;
  margin-top: 14px;
  font-size: 15px;
  font-weight: 600;
  color: var(--cyan);
}

/* Small print explaining where the percentages come from */
.calc-assumptions {
  margin-top: 40px;
  padding: 26px 28px;
  background: var(--grey-light);
  border-radius: var(--radius);
  font-size: 15px;
}
.calc-assumptions h3 { font-size: 18px; margin-bottom: 12px; }
.calc-assumptions ul { margin: 0; padding-left: 20px; }
.calc-assumptions li { margin-bottom: 8px; }

/* ---- Calculator: mobile and tablet ---- */
@media (max-width: 980px) {
  .calc { grid-template-columns: 1fr; }   /* stack into one column */
  /* Sticky results make no sense once stacked, so switch it off */
  .calc__results { position: static; }
}
@media (max-width: 700px) {
  .calc__inputs { padding: 24px 20px; }
  .result__value { font-size: 32px; }
  .result--total { padding: 24px 20px; }
  .result--total .result__value { font-size: 42px; }
}

&lt;/style&gt;

          &lt;p&gt;
            Sennicare (&amp;ldquo;we&amp;rdquo;, &amp;ldquo;us&amp;rdquo;) respects your privacy. This page explains what
            personal information we collect, why we collect it, and what you can ask us
            to do with it. We handle personal data in line with the UK GDPR and the Data
            Protection Act 2018.
          &lt;/p&gt;

          &lt;h2&gt;Who we are&lt;/h2&gt;
          &lt;p&gt;
            Sennicare, [YOUR REGISTERED ADDRESS]. If you have any questions about this
            policy or your data, email
            &lt;a href=&quot;mailto:hello@sennicare.co.uk&quot;&gt;hello@sennicare.co.uk&lt;/a&gt;.
          &lt;/p&gt;

          &lt;h2&gt;What we collect&lt;/h2&gt;
          &lt;ul&gt;
            &lt;li&gt;Your name, email address and care home name, when you send us an enquiry.&lt;/li&gt;
            &lt;li&gt;Any details you choose to include in your message to us.&lt;/li&gt;
            &lt;li&gt;Operational information you share with us during a review (for example supplier and spend data), which we treat as confidential business information.&lt;/li&gt;
          &lt;/ul&gt;

          &lt;h2&gt;Why we use it&lt;/h2&gt;
          &lt;ul&gt;
            &lt;li&gt;To reply to your enquiry and arrange your free operational review.&lt;/li&gt;
            &lt;li&gt;To carry out any work you engage us to do.&lt;/li&gt;
            &lt;li&gt;To meet our legal and accounting obligations.&lt;/li&gt;
          &lt;/ul&gt;
          &lt;p&gt;
            We do not sell your data, and we do not add you to marketing lists without
            your clear consent.
          &lt;/p&gt;

          &lt;h2&gt;How long we keep it&lt;/h2&gt;
          &lt;p&gt;
            Enquiries that do not lead to work are deleted within 12 months. Records
            relating to client work are kept for [6] years, as required for tax and
            accounting purposes.
          &lt;/p&gt;

          &lt;h2&gt;Who we share it with&lt;/h2&gt;
          &lt;p&gt;
            Only with service providers we need in order to operate &amp;mdash; for example our
            email provider and our accountant &amp;mdash; and only where they are bound to keep it
            secure. We will never pass your data to suppliers or product vendors.
          &lt;/p&gt;

          &lt;h2&gt;Cookies&lt;/h2&gt;
          &lt;p&gt;
            This website does not use tracking or advertising cookies. If we later add
            website analytics, we will update this page and ask for your consent first.
          &lt;/p&gt;

          &lt;h2&gt;Your rights&lt;/h2&gt;
          &lt;p&gt;
            You can ask us for a copy of your data, ask us to correct or delete it, or
            object to how we use it. Email us and we will respond within one month. If
            you are unhappy with our response you can complain to the Information
            Commissioner&#x27;s Office (ICO) at
            &lt;a href=&quot;https://ico.org.uk&quot; rel=&quot;noopener&quot;&gt;ico.org.uk&lt;/a&gt;.
          &lt;/p&gt;

        &lt;/div&gt;

  &lt;script&gt;
/* ==========================================================================
   Sennicare website - JavaScript
   --------------------------------------------------------------------------
   This file does three small jobs:
     1. Opens and closes the mobile menu (the &quot;hamburger&quot; button)
     2. Adds a soft shadow to the navigation bar once you scroll down
     3. Checks the contact form is filled in, then opens the visitor&#x27;s email
        program with their message ready to send to you

   You do not need to understand JavaScript to run the site. The only line you
   may want to edit is SENNICARE_EMAIL just below.
   ========================================================================== */

/* CHANGE THIS to the email address where you want enquiries to arrive. */
var SENNICARE_EMAIL = &#x27;hello@sennicare.co.uk&#x27;;


/* &quot;DOMContentLoaded&quot; means: wait until the page has loaded, then run this. */
document.addEventListener(&#x27;DOMContentLoaded&#x27;, function () {

  /* ======================================================================
     1. MOBILE MENU
     ====================================================================== */
  var navToggle = document.getElementById(&#x27;navToggle&#x27;);
  var navLinks  = document.getElementById(&#x27;navLinks&#x27;);

  if (navToggle &amp;&amp; navLinks) {
    navToggle.addEventListener(&#x27;click&#x27;, function () {
      // &quot;toggle&quot; adds the class if it&#x27;s missing, removes it if it&#x27;s there.
      var isOpen = navLinks.classList.toggle(&#x27;is-open&#x27;);

      // Keep the button&#x27;s label and accessibility state in step.
      navToggle.setAttribute(&#x27;aria-expanded&#x27;, isOpen ? &#x27;true&#x27; : &#x27;false&#x27;);
      navToggle.setAttribute(&#x27;aria-label&#x27;, isOpen ? &#x27;Close menu&#x27; : &#x27;Open menu&#x27;);
    });

    // Close the menu again after someone taps one of the links.
    navLinks.addEventListener(&#x27;click&#x27;, function (event) {
      if (event.target.tagName === &#x27;A&#x27;) {
        navLinks.classList.remove(&#x27;is-open&#x27;);
        navToggle.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
        navToggle.setAttribute(&#x27;aria-label&#x27;, &#x27;Open menu&#x27;);
      }
    });
  }


  /* ======================================================================
     2. SHADOW UNDER THE NAVIGATION BAR WHEN SCROLLED
     ====================================================================== */
  var navbar = document.getElementById(&#x27;navbar&#x27;);

  if (navbar) {
    // This function decides whether the shadow should be on or off.
    var updateNavbar = function () {
      if (window.scrollY &gt; 10) {
        navbar.classList.add(&#x27;is-scrolled&#x27;);
      } else {
        navbar.classList.remove(&#x27;is-scrolled&#x27;);
      }
    };

    updateNavbar();                                   // check once on load
    window.addEventListener(&#x27;scroll&#x27;, updateNavbar);  // then on every scroll
  }


  /* ======================================================================
     3. CONTACT FORM
     A plain website (with no server behind it) cannot send an email on its
     own. So we do the next simplest thing: check the fields are filled in,
     then open the visitor&#x27;s own email app with everything pre-written.

     If you would rather the form emailed you directly without opening the
     visitor&#x27;s email app, see README.md - it is a free, one-line change.
     ====================================================================== */
  var form        = document.getElementById(&#x27;contactForm&#x27;);
  var formMessage = document.getElementById(&#x27;formMessage&#x27;);

  if (form &amp;&amp; formMessage) {

    // Small helper so we can show a message in one line of code.
    var showMessage = function (text, type) {
      formMessage.textContent = text;
      formMessage.className = &#x27;form__message is-visible is-&#x27; + type; // type = &#x27;success&#x27; or &#x27;error&#x27;
    };

    form.addEventListener(&#x27;submit&#x27;, function (event) {
      event.preventDefault();   // stop the browser reloading the page

      // Read what the visitor typed, trimming off any stray spaces.
      var name     = form.name.value.trim();
      var email    = form.email.value.trim();
      var carehome = form.carehome.value.trim();
      var message  = form.message.value.trim();

      // --- Check nothing important is missing ---
      if (!name || !email || !carehome || !message) {
        showMessage(&#x27;Please fill in all four fields so we can help you properly.&#x27;, &#x27;error&#x27;);
        return;   // stop here
      }

      // --- Check the email address looks like an email address ---
      // This pattern means: some characters, an @, some characters, a dot, some characters.
      var looksLikeEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      if (!looksLikeEmail) {
        showMessage(&#x27;That email address does not look quite right. Please check it.&#x27;, &#x27;error&#x27;);
        return;
      }

      // --- Build the email ---
      var subject = &#x27;Free operational review request - &#x27; + carehome;

      // &quot;\n&quot; means &quot;start a new line&quot;. encodeURIComponent makes the text safe
      // to put inside a web link (spaces, ampersands and so on).
      var body =
        &#x27;Name: &#x27; + name + &#x27;\n&#x27; +
        &#x27;Email: &#x27; + email + &#x27;\n&#x27; +
        &#x27;Care home: &#x27; + carehome + &#x27;\n\n&#x27; +
        &#x27;Message:\n&#x27; + message + &#x27;\n&#x27;;

      var mailtoLink = &#x27;mailto:&#x27; + SENNICARE_EMAIL +
                       &#x27;?subject=&#x27; + encodeURIComponent(subject) +
                       &#x27;&amp;body=&#x27;    + encodeURIComponent(body);

      // Open the visitor&#x27;s email program with the message ready to send.
      window.location.href = mailtoLink;

      showMessage(&#x27;Thank you, &#x27; + name + &#x27;. Your email program should now open with &#x27; +
                  &#x27;your enquiry ready to send. If it does not, please email us at &#x27; +
                  SENNICARE_EMAIL + &#x27;.&#x27;, &#x27;success&#x27;);
    });
  }

});

&lt;/script&gt;

&lt;script&gt;
document.addEventListener(&#x27;click&#x27;, function (e) {
  var a = e.target.closest &amp;&amp; e.target.closest(&#x27;a[href]&#x27;);
  if (!a) return;
  var href = a.getAttribute(&#x27;href&#x27;) || &#x27;&#x27;;
  if (href.charAt(0) === &#x27;#&#x27; || /^(mailto:|tel:|https?:)/.test(href)) return;
  var m = href.match(/([A-Za-z0-9._-]+\.html)(#.*)?$/);
  if (!m) return;
  e.preventDefault();
  parent.postMessage({ sennicareGoTo: m[1] }, &#x27;*&#x27;);
});
&lt;/script&gt;

/* ==========================================================================
   Sennicare website styles
   --------------------------------------------------------------------------
   HOW THIS FILE IS ORGANISED (top to bottom):
     1. Brand colours and other settings (CSS &quot;variables&quot;)
     2. Basic resets and page-wide defaults
     3. Reusable pieces (buttons, section headings, cards)
     4. Each section of the page, in the order it appears
     5. Mobile / tablet adjustments at the very bottom

   TIP: To change a brand colour everywhere on the site, you only need to edit
   the values in section 1 below. Nothing else needs touching.
   ========================================================================== */


/* ==========================================================================
   1. BRAND SETTINGS (CSS variables)
   A &quot;variable&quot; is just a saved value with a name. We write --navy: #0A1172
   once, then use var(--navy) everywhere we want that colour.
   ========================================================================== */
:root {
  /* Brand colours */
  --navy:        #0A1172;  /* Deep navy blue - main brand colour, headings, structure */
  --magenta:     #E30B5C;  /* Bright magenta pink - call-to-action buttons, accents */
  --cyan:        #00B2D9;  /* Vibrant cyan blue - secondary accents, highlights */
  --white:       #FFFFFF;  /* White - page backgrounds */
  --grey-light:  #F5F7FA;  /* Light grey - card and section backgrounds */

  /* Supporting colours, derived from the brand palette */
  --navy-dark:   #070C52;  /* Slightly darker navy, used for button hover states */
  --magenta-dark:#C10A4E;  /* Slightly darker magenta, used for button hover states */
  --text-body:   #454B66;  /* Soft navy-grey for body text (easier to read than pure black) */
  --border:      #E3E8F0;  /* Very light grey for borders and dividers */

  /* Typography: a clean modern sans-serif. We list several fonts so the
     browser uses the first one available on the visitor&#x27;s computer. */
  --font: &quot;Inter&quot;, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;

  /* Layout settings */
  --max-width: 1180px;  /* How wide the content can grow on large screens */
  --radius:    16px;    /* Standard rounded-corner size */
  --nav-height: 84px;   /* Height of the fixed navigation bar */

  /* Shadows, for a soft &quot;lifted card&quot; look */
  --shadow-soft:  0 4px 16px rgba(10, 17, 114, 0.07);
  --shadow-lift:  0 14px 32px rgba(10, 17, 114, 0.14);
}


/* ==========================================================================
   2. RESETS AND PAGE DEFAULTS
   ========================================================================== */

/* box-sizing: border-box makes width calculations behave predictably
   (padding and borders are counted inside an element&#x27;s width). */
*, *::before, *::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.65;
  color: var(--text-body);
  background: var(--white);
  -webkit-font-smoothing: antialiased;  /* Slightly crisper text on Macs */
}

/* Smooth scrolling when a visitor clicks a menu link.
   scroll-padding-top stops the fixed navbar covering the section heading. */
html {
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--nav-height) + 16px);
}

/* Headings use navy and a tighter line height than body text */
h1, h2, h3, h4 {
  color: var(--navy);
  line-height: 1.15;
  margin: 0 0 0.5em;
  font-weight: 800;
  letter-spacing: -0.02em;
}

p { margin: 0 0 1em; }

a { color: var(--navy); text-decoration: none; }
a:hover { text-decoration: underline; }

img, svg { max-width: 100%; display: block; }

/* A &quot;container&quot; centres content and stops it stretching too wide */
.container {
  width: 100%;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 24px;
}

/* Standard vertical spacing for a page section */
.section {
  padding: 88px 0;
}
.section--grey { background: var(--grey-light); }

/* Visible focus outline for keyboard users (accessibility) */
a:focus-visible,
button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 3px solid var(--cyan);
  outline-offset: 2px;
}


/* ==========================================================================
   3. REUSABLE PIECES
   ========================================================================== */

/* ---- Buttons ---- */
.btn {
  display: inline-block;
  padding: 15px 30px;
  border: none;
  border-radius: 8px;
  font-family: var(--font);
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  /* &quot;transition&quot; makes hover changes fade in smoothly instead of snapping */
  transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
}
.btn:hover { text-decoration: none; }

/* Main magenta call-to-action button */
.btn--primary {
  background: var(--magenta);
  color: var(--white);
}
.btn--primary:hover {
  background: var(--magenta-dark);
  transform: translateY(-2px);              /* lifts by 2 pixels on hover */
  box-shadow: 0 10px 22px rgba(227, 11, 92, 0.32);
}

/* Smaller version, used in the navigation bar */
.btn--nav { padding: 12px 24px; font-size: 16px; }

/* Larger version, used in the big call-to-action section */
.btn--large { padding: 19px 44px; font-size: 19px; }

/* ---- Section headings ---- */
.section__head {
  max-width: 660px;
  margin-bottom: 48px;
}
.section__title {
  font-size: 40px;
  margin-bottom: 12px;
}
.section__subtitle {
  font-size: 19px;
  margin: 0;
}

/* A short coloured line used above some headings as a small accent */
.eyebrow {
  display: inline-block;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--cyan);
  margin-bottom: 12px;
}

/* ---- Icon badge (the small rounded square behind each icon) ---- */
.icon-badge {
  width: 52px;
  height: 52px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
  background: rgba(0, 178, 217, 0.12);   /* pale cyan by default */
  color: var(--cyan);                    /* the icon inherits this colour */
  flex-shrink: 0;
}
.icon-badge--magenta {
  background: rgba(227, 11, 92, 0.10);
  color: var(--magenta);
}
.icon-badge--navy {
  background: rgba(10, 17, 114, 0.08);
  color: var(--navy);
}
/* Our icons are SVG line drawings; this makes them follow the colour above */
.icon-badge svg { width: 26px; height: 26px; stroke: currentColor; fill: none; }


/* ==========================================================================
   4a. NAVIGATION BAR (fixed to the top of the screen)
   ========================================================================== */
.navbar {
  position: fixed;         /* stays put while the page scrolls */
  top: 0; left: 0; right: 0;
  z-index: 100;            /* sits above everything else */
  height: var(--nav-height);
  background: var(--white);
  display: flex;
  align-items: center;
  transition: box-shadow 0.2s ease;
}
/* JavaScript adds this class once the visitor scrolls, adding a subtle shadow */
.navbar.is-scrolled { box-shadow: 0 2px 14px rgba(10, 17, 114, 0.09); }

.navbar__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  width: 100%;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 24px;
}

/* Logo + company name */
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 26px;
  font-weight: 800;
  color: var(--navy);
  letter-spacing: -0.02em;
}
.brand:hover { text-decoration: none; }
.brand__mark { width: 38px; height: 38px; }

/* Menu links */
.navbar__links {
  display: flex;
  align-items: center;
  gap: 34px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.navbar__links a {
  font-size: 17px;
  font-weight: 500;
  color: var(--navy);
  padding: 6px 0;
  border-bottom: 2px solid transparent;   /* invisible until hover */
  transition: border-color 0.2s ease, color 0.2s ease;
}
.navbar__links a:hover {
  text-decoration: none;
  color: var(--magenta);
  border-bottom-color: var(--magenta);
}
/* The magenta button inside the links list is for the mobile menu only,
   so it stays hidden on tablets and desktops (where .navbar__cta shows instead). */
.navbar__links-cta { display: none; }

/* Hamburger menu button - hidden on desktop, shown on mobile */
.navbar__toggle {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px;
  color: var(--navy);
}
.navbar__toggle svg { width: 28px; height: 28px; stroke: currentColor; fill: none; }


/* ==========================================================================
   4b. HERO SECTION
   ========================================================================== */
.hero {
  padding: calc(var(--nav-height) + 28px) 0 32px;
}
.hero__card {
  position: relative;              /* lets us layer text on top of the image */
  border-radius: 22px;
  overflow: hidden;                /* keeps the image inside the rounded corners */
  min-height: 430px;
  display: flex;
  align-items: center;
  box-shadow: var(--shadow-soft);
  background: var(--navy);         /* shows while the photo loads */
}
.hero__image {
  position: absolute;
  inset: 0;                        /* fills the whole card */
  width: 100%;
  height: 100%;
  object-fit: cover;               /* crops rather than squashes the photo */
}
/* A dark gradient over the photo so white text stays readable */
.hero__overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(100deg,
              rgba(10, 17, 114, 0.78) 0%,
              rgba(10, 17, 114, 0.45) 45%,
              rgba(10, 17, 114, 0.05) 78%);
}
.hero__content {
  position: relative;              /* sits above the image and overlay */
  padding: 56px 48px;
  max-width: 620px;
}
.hero__title {
  color: var(--white);
  font-size: clamp(42px, 6vw, 74px);   /* grows with the screen, within limits */
  margin-bottom: 18px;
  text-shadow: 0 2px 18px rgba(0, 0, 0, 0.25);
}
.hero__subtitle {
  color: rgba(255, 255, 255, 0.94);
  font-size: 21px;
  margin-bottom: 32px;
  max-width: 480px;
}

/* Three small trust statements underneath the hero */
.hero__stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 28px;
}
.hero__stat {
  background: var(--grey-light);
  border-radius: var(--radius);
  padding: 20px 24px;
}
.hero__stat strong {
  display: block;
  font-size: 26px;
  color: var(--navy);
  line-height: 1.2;
}
.hero__stat span { font-size: 15px; }


/* ==========================================================================
   4c. OUR INTEGRATED SERVICES
   ========================================================================== */
.services__grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);   /* three equal-width columns */
  gap: 26px;
}
.service-card {
  background: var(--grey-light);
  border-radius: var(--radius);
  padding: 30px 28px 34px;
  /* The thin coloured line along the bottom of each card */
  border-bottom: 4px solid var(--cyan);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
/* Card 3 uses magenta instead of cyan */
.service-card--magenta { border-bottom-color: var(--magenta); }

.service-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow-lift);
}
.service-card h3 { font-size: 22px; margin-bottom: 8px; }
.service-card p  { margin: 0; }


/* ==========================================================================
   4d. HOW SENNICARE WORKS (3 steps)
   ========================================================================== */
.steps {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
  counter-reset: step;      /* starts the automatic 1, 2, 3 numbering */
}
.step {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 34px 28px;
  position: relative;
}
/* The big numbered circle-free badge, generated automatically */
.step::before {
  counter-increment: step;
  content: counter(step);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 46px;
  border-radius: 12px;
  background: var(--navy);
  color: var(--white);
  font-size: 21px;
  font-weight: 800;
  margin-bottom: 18px;
}
.step h3 { font-size: 21px; margin-bottom: 8px; }
.step p  { margin: 0; }


/* ==========================================================================
   4e. WHY CARE HOMES CHOOSE SENNICARE (4 benefits)
   ========================================================================== */
.benefits {
  display: grid;
  grid-template-columns: repeat(2, 1fr);   /* two per row on desktop */
  gap: 30px 40px;
}
.benefit {
  display: flex;
  gap: 18px;
  align-items: flex-start;
}
.benefit h3 { font-size: 20px; margin-bottom: 6px; }
.benefit p  { margin: 0; }


/* ==========================================================================
   4f. SAVINGS CALCULATOR (Phase 2 - the section that holds the tool)
   ========================================================================== */
.calc-embed {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-soft);
  overflow: hidden;
}


/* ==========================================================================
   4g. BIG CALL-TO-ACTION BAND (full-width navy)
   ========================================================================== */
.cta-band {
  background: var(--navy);
  padding: 84px 0;
  text-align: center;
}
.cta-band h2 {
  color: var(--white);
  font-size: 40px;
  margin-bottom: 14px;
}
.cta-band p {
  color: rgba(255, 255, 255, 0.88);
  font-size: 20px;
  margin-bottom: 34px;
}


/* ==========================================================================
   4h. CONTACT FORM
   ========================================================================== */
.contact {
  display: grid;
  grid-template-columns: 1fr 1.15fr;   /* text on the left, form on the right */
  gap: 56px;
  align-items: start;
}
.contact__list {
  list-style: none;
  padding: 0;
  margin: 24px 0 0;
}
.contact__list li {
  display: flex;
  gap: 12px;
  margin-bottom: 14px;
}
.contact__list svg {
  width: 22px; height: 22px;
  stroke: var(--cyan); fill: none;
  flex-shrink: 0; margin-top: 4px;
}

.form {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 30px;
  box-shadow: var(--shadow-soft);
}
.form__row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}
.form__field { margin-bottom: 18px; }
.form__field label {
  display: block;
  font-size: 15px;
  font-weight: 600;
  color: var(--navy);
  margin-bottom: 6px;
}
.form__field input,
.form__field textarea {
  width: 100%;
  padding: 13px 14px;
  font-family: var(--font);
  font-size: 16px;
  color: var(--navy);
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  transition: border-color 0.2s ease;
}
.form__field input:focus,
.form__field textarea:focus {
  border-color: var(--cyan);
}
.form__field textarea { resize: vertical; min-height: 120px; }

.form__note { font-size: 14px; margin: 14px 0 0; }

/* The green/red message shown after someone submits the form */
.form__message {
  display: none;                 /* JavaScript reveals this when needed */
  margin-top: 16px;
  padding: 14px 16px;
  border-radius: 8px;
  font-size: 16px;
}
.form__message.is-visible { display: block; }
.form__message.is-success {
  background: rgba(0, 178, 217, 0.10);
  color: var(--navy);
  border: 1px solid var(--cyan);
}
.form__message.is-error {
  background: rgba(227, 11, 92, 0.08);
  color: var(--magenta-dark);
  border: 1px solid var(--magenta);
}


/* ==========================================================================
   4i. FOOTER
   ========================================================================== */
.footer {
  background: var(--navy);
  color: rgba(255, 255, 255, 0.78);
  padding: 60px 0 28px;
  font-size: 16px;
}
.footer__top {
  display: grid;
  grid-template-columns: 1.6fr 1fr 1fr;
  gap: 40px;
  padding-bottom: 36px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.16);
}
.footer .brand { color: var(--white); }
.footer__tagline { margin: 14px 0 0; max-width: 320px; }
.footer h4 {
  color: var(--white);
  font-size: 16px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 16px;
}
.footer ul { list-style: none; margin: 0; padding: 0; }
.footer li { margin-bottom: 10px; }
.footer a { color: rgba(255, 255, 255, 0.78); }
.footer a:hover { color: var(--white); }

.footer__bottom {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding-top: 22px;
  font-size: 15px;
}


/* ==========================================================================
   4j. SIMPLE LEGAL / TEXT PAGES (privacy.html, terms.html)
   ========================================================================== */
.page-header {
  background: var(--grey-light);
  padding: calc(var(--nav-height) + 56px) 0 56px;
}
.page-header h1 { font-size: 44px; margin-bottom: 8px; }
.prose { max-width: 760px; }
.prose h2 { font-size: 26px; margin-top: 40px; }
.prose ul { padding-left: 22px; }
.prose li { margin-bottom: 8px; }


/* ==========================================================================
   5. RESPONSIVE ADJUSTMENTS
   A &quot;media query&quot; applies styles only when the screen is a certain size.
   max-width: 900px means &quot;on screens 900 pixels wide or narrower&quot;.
   ========================================================================== */

/* --- Tablet --- */
@media (max-width: 980px) {
  .services__grid,
  .steps {
    grid-template-columns: 1fr 1fr;   /* three columns become two */
  }
  .contact { grid-template-columns: 1fr; gap: 34px; }
  .section__title, .cta-band h2 { font-size: 34px; }
  .footer__top { grid-template-columns: 1fr 1fr; }
}

/* --- Small laptops and tablets: slightly tighter menu spacing ---
   This keeps the five menu links on one line for as long as possible. */
@media (max-width: 1150px) {
  .navbar__links { gap: 24px; }
  .navbar__links a { font-size: 16px; }
}

/* --- Tablets and phones: swap the menu for the hamburger button ---
   Below 980 pixels there isn&#x27;t room for five links plus the button, so we
   collapse them into the drop-down menu. */
@media (max-width: 979px) {
  /* Show the hamburger button, hide the desktop menu and desktop button */
  .navbar__toggle { display: block; }
  .navbar__cta { display: none; }

  /* The mobile menu: a white panel that drops down below the navbar.
     It is hidden until JavaScript adds the &quot;is-open&quot; class. */
  .navbar__links {
    display: none;
    position: absolute;
    top: var(--nav-height);
    left: 0; right: 0;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    background: var(--white);
    padding: 8px 24px 20px;
    box-shadow: 0 12px 22px rgba(10, 17, 114, 0.12);
  }
  .navbar__links.is-open { display: flex; }
  .navbar__links li { border-bottom: 1px solid var(--border); }
  .navbar__links a { display: block; padding: 14px 0; border-bottom: none; font-size: 17px; }
  /* Show the magenta CTA at the bottom of the open mobile menu */
  .navbar__links-cta { display: block; border-bottom: none !important; margin-top: 16px; }
  .navbar__links-cta a { color: var(--white); font-weight: 700; padding: 15px 30px; text-align: center; }
  .navbar__links-cta a:hover { color: var(--white); }
}

/* --- Mobile phones --- */
@media (max-width: 700px) {
  body { font-size: 16px; }
  .section { padding: 60px 0; }

  /* Everything stacks into a single column */
  .services__grid,
  .steps,
  .benefits,
