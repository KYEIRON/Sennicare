  font-size: 17px;
  line-height: 1.65;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

h1, h2, h3, h4 {
  margin: 0 0 var(--s-3);
  color: var(--navy);
  line-height: 1.1;
  letter-spacing: -0.02em;
  font-weight: 800;
  text-wrap: balance;
}
h1 { font-size: clamp(33px, 4.8vw, 52px); }
h2 { font-size: clamp(28px, 3.6vw, 42px); }
h3 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }

p { margin: 0 0 var(--s-4); }
p:last-child { margin-bottom: 0; }

a { color: var(--navy); text-decoration: none; }
a:hover { text-decoration: underline; }

img, svg { max-width: 100%; display: block; }

ul, ol { margin: 0; padding: 0; }

/* Accessibility: a visible focus ring for keyboard users, everywhere */
a:focus-visible, button:focus-visible, input:focus-visible,
textarea:focus-visible, select:focus-visible, summary:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid var(--cyan);
  outline-offset: 3px;
  border-radius: var(--r-sm);
}

/* Skip link — the first thing a keyboard or screen reader user meets */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 200;
  background: var(--navy);
  color: var(--white);
  padding: 14px 22px;
  border-radius: 0 0 var(--r-md) 0;
  font-weight: 600;
}
.skip-link:focus { left: 0; }

/* Screen-reader-only text */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}


/* ==========================================================================
   3. LAYOUT HELPERS
   ========================================================================== */
.container {
  width: 100%;
  max-width: var(--max);
  margin: 0 auto;
  padding: 0 var(--s-5);
}

/* 96px between sections — the single biggest contributor to a premium feel */
.section { padding: var(--s-9) 0; }
.section--tight { padding: var(--s-8) 0; }
.section--grey { background: var(--surface-2); }
.section--white { background: var(--white); }

/* The heading block that opens most sections */
.section-head {
  max-width: 720px;
  margin: 0 auto var(--s-8);
  text-align: center;
}
.section-head--left { margin-left: 0; text-align: left; }
.section-head p {
  font-size: 19px;
  color: var(--muted);
  margin: 0;
}

/* A small uppercase label above a heading */
.eyebrow {
  display: inline-block;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--cyan);
  margin-bottom: var(--s-3);
}
.eyebrow--magenta { color: var(--magenta); }
.eyebrow--on-navy { color: #7FE3FF; }

.grid { display: grid; gap: var(--s-5); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }


/* ==========================================================================
   4. REUSABLE PIECES
   ========================================================================== */

/* ---- Buttons ---------------------------------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-2);
  padding: 15px 28px;
  border: 1.5px solid transparent;
  border-radius: var(--r-md);
  font-family: var(--font);
  font-size: 16px;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  cursor: pointer;
  /* 44px is the smallest comfortable touch target on a phone. Set here once,
     so no button can end up too small to press reliably. */
  min-height: 44px;
  transition: background-color .18s ease, border-color .18s ease,
              transform .18s ease, box-shadow .18s ease, color .18s ease;
}
.btn:hover { text-decoration: none; }
.btn svg { width: 18px; height: 18px; flex-shrink: 0; }

/* THE magenta button. One per screen area. */
.btn--primary {
  background: var(--magenta);
  color: var(--white);
  box-shadow: 0 4px 14px rgba(227, 11, 92, 0.24);
}
.btn--primary:hover {
  background: var(--magenta-700);
  transform: translateY(-2px);
  box-shadow: var(--shadow-magenta);
}

/* Quiet navy button — used in the nav, so it never competes with the hero */
.btn--outline {
  background: var(--white);
  color: var(--navy);
  border-color: var(--line);
}
.btn--outline:hover {
  border-color: var(--cyan);
  transform: translateY(-1px);
  box-shadow: var(--shadow-2);
}

/* Ghost button for secondary actions beside a magenta one */
.btn--ghost {
  background: transparent;
  color: var(--navy);
  border-color: rgba(10, 17, 114, 0.18);
}
.btn--ghost:hover { border-color: var(--navy); background: var(--navy-050); }

/* On a navy background */
.btn--on-navy {
  background: rgba(255, 255, 255, 0.10);
  color: var(--white);
  border-color: rgba(255, 255, 255, 0.28);
}
.btn--on-navy:hover { background: rgba(255, 255, 255, 0.18); }

.btn--lg { padding: 18px 34px; font-size: 17.5px; }
.btn--sm { padding: 11px 18px; font-size: 15px; }
.btn--block { width: 100%; }

/* Reassurance line under a call to action */
.cta-note {
  font-size: 14.5px;
  color: var(--muted);
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-2) var(--s-4);
  align-items: center;
}
.cta-note span { display: inline-flex; align-items: center; gap: 6px; }
.cta-note svg { width: 15px; height: 15px; color: var(--success); }
.cta-note--on-navy { color: rgba(255, 255, 255, 0.82); }
.cta-note--on-navy svg { color: #4ADE80; }

/* ---- Cards ------------------------------------------------------------ */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: var(--s-5);
  box-shadow: var(--shadow-1);
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
@media (min-width: 700px) { .card { padding: 28px; } }
.card--lift:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-3);
  border-color: rgba(0, 178, 217, 0.35);
}
.card h3 { margin-bottom: var(--s-2); }
.card p { color: var(--muted); font-size: 15.5px; margin: 0; }

/* ---- Icon tiles ------------------------------------------------------- */
.icon-tile {
  width: 46px; height: 46px;
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: var(--s-4);
  background: var(--cyan-050);
  color: var(--cyan);
  flex-shrink: 0;
}
.icon-tile svg { width: 23px; height: 23px; }
.icon-tile--magenta { background: var(--magenta-050); color: var(--magenta); }
.icon-tile--navy    { background: var(--navy-050);    color: var(--navy); }
.icon-tile--danger  { background: rgba(220, 38, 38, 0.08);  color: var(--danger); }
.icon-tile--success { background: rgba(13, 150, 105, 0.10); color: var(--success); }
.icon-tile--sm { width: 34px; height: 34px; border-radius: var(--r-sm); margin-bottom: 0; }
.icon-tile--sm svg { width: 18px; height: 18px; }

/* Lucide-style icons inherit colour and are drawn, never filled */
.ico { width: 20px; height: 20px; stroke: currentColor; fill: none;
       stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---- Pills and badges ------------------------------------------------- */
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 14px;
  border-radius: var(--r-pill);
  font-size: 13.5px; font-weight: 600;
  background: var(--cyan-050); color: #04708A;
}
.pill--magenta { background: var(--magenta-050); color: var(--magenta-700); }
.pill--success { background: rgba(13, 150, 105, 0.10); color: var(--success); }
.pill--on-navy { background: rgba(255, 255, 255, 0.12); color: var(--white); }
.pill svg { width: 15px; height: 15px; }

.badge-popular {
  position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
  background: var(--magenta); color: var(--white);
  font-size: 12.5px; font-weight: 800;
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 6px 16px; border-radius: var(--r-pill);
  box-shadow: 0 4px 12px rgba(227, 11, 92, 0.3);
  white-space: nowrap;
}


/* ==========================================================================
   5a. ANNOUNCEMENT BAR
   ========================================================================== */
.announce {
  background: var(--navy);
  color: var(--white);
  font-size: 14.5px;
  position: relative;
  z-index: 60;
}
.announce__inner {
  max-width: var(--max); margin: 0 auto;
  padding: 10px var(--s-5);
  display: flex; align-items: center; justify-content: center;
  gap: var(--s-3); text-align: center;
}
.announce a { color: var(--white); text-decoration: underline; font-weight: 600; }
.announce svg { width: 16px; height: 16px; color: #7FE3FF; flex-shrink: 0; }
.announce__close {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: rgba(255,255,255,0.7);
  cursor: pointer; line-height: 0; border-radius: var(--r-sm);
  width: 44px; height: 44px;           /* comfortable to tap */
  display: flex; align-items: center; justify-content: center;
}
.announce__close:hover { color: var(--white); background: rgba(255,255,255,0.12); }
.announce[hidden] { display: none; }


/* ==========================================================================
   5b. NAVIGATION
   ========================================================================== */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: saturate(160%) blur(10px);
  -webkit-backdrop-filter: saturate(160%) blur(10px);
  border-bottom: 1px solid transparent;
  transition: border-color .2s ease, box-shadow .2s ease;
}
.nav.is-scrolled {
  border-bottom-color: var(--line);
  box-shadow: 0 2px 12px rgba(10, 17, 114, 0.06);
}
.nav__inner {
  max-width: var(--max); margin: 0 auto;
  padding: 0 var(--s-5);
  height: var(--nav-h);
  display: flex; align-items: center; justify-content: space-between; gap: var(--s-5);
}
.brand { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
.brand:hover { text-decoration: none; }
.brand__mark { width: 34px; height: 34px; }
.brand__name { font-size: 22px; font-weight: 800; color: var(--navy); letter-spacing: -0.03em; }

.nav__links {
  display: flex; align-items: center; gap: var(--s-6);
  list-style: none;
}
.nav__links a {
  font-size: 15.5px; font-weight: 500; color: var(--text);
  padding: 6px 0; border-bottom: 2px solid transparent;
  transition: color .15s ease, border-color .15s ease;
}
.nav__links a:hover {
  text-decoration: none; color: var(--navy); border-bottom-color: var(--cyan);
}
.nav__actions { display: flex; align-items: center; gap: var(--s-3); flex-shrink: 0; }
.nav__signin { font-size: 15.5px; font-weight: 600; color: var(--navy); }
/* This menu item only exists for the mobile drop-down, where the buttons on
   the right are hidden. On desktop it would be a third &quot;Start free&quot;. */
.nav__links .nav__mobile-signin { display: none; }

.nav__toggle {
  display: none; background: none; border: none; cursor: pointer;
  padding: 8px; color: var(--navy); line-height: 0; border-radius: var(--r-sm);
  min-width: 44px; min-height: 44px;   /* comfortable to tap */
  align-items: center; justify-content: center;
}
.nav__toggle svg { width: 26px; height: 26px; }


/* ==========================================================================
   5c. HERO
   ========================================================================== */
.hero {
  position: relative;
  padding: var(--s-9) 0 var(--s-8);
  overflow: hidden;
}
/* A very soft cyan wash behind the hero — no photograph, no stock imagery */
.hero::before {
  content: &quot;&quot;;
  position: absolute; inset: 0;
  background:
    radial-gradient(58% 62% at 88% 8%, rgba(0, 178, 217, 0.13), transparent 62%),
    radial-gradient(48% 52% at 2% 92%, rgba(227, 11, 92, 0.07), transparent 60%);
  pointer-events: none;
}
.hero__inner {
  position: relative;
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  gap: var(--s-8);
  align-items: center;
}
.hero h1 { margin-bottom: var(--s-4); }
.hero h1 .accent {
  background: linear-gradient(180deg, transparent 62%, rgba(0, 178, 217, 0.24) 62%);
}
.hero__sub {
  font-size: 20px; color: var(--muted);
  max-width: 33ch; margin-bottom: var(--s-6);
}
.hero__actions {
  display: flex; flex-wrap: wrap; gap: var(--s-3);
  margin-bottom: var(--s-5);
}
.hero__proof {
  display: flex; flex-wrap: wrap; gap: var(--s-3);
  margin-top: var(--s-6); padding-top: var(--s-5);
  border-top: 1px solid var(--line);
}

/* ---- The product illustration (a drawn card, not a screenshot) -------- */
.demo {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-3);
  padding: var(--s-5);
  position: relative;
}
.demo__bar {
  display: flex; align-items: center; gap: var(--s-2);
  padding-bottom: var(--s-4); margin-bottom: var(--s-4);
  border-bottom: 1px solid var(--line);
  font-size: 13.5px; color: var(--muted);
}
.demo__query {
  flex: 1; background: var(--surface-2); border-radius: var(--r-sm);
  padding: 9px 12px; font-size: 14px; color: var(--text); font-weight: 500;
}
.demo__row {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--s-3); padding: 13px 0;
  border-bottom: 1px solid var(--line);
}
.demo__row:last-of-type { border-bottom: none; }
.demo__name { font-size: 14.5px; font-weight: 600; color: var(--text); }
.demo__meta { font-size: 12.5px; color: var(--muted); }
.demo__price { font-size: 16px; font-weight: 800; color: var(--navy); white-space: nowrap; }

.demo__pick {
  background: var(--magenta-050);
  border: 1.5px solid rgba(227, 11, 92, 0.35);
  border-radius: var(--r-md);
  padding: var(--s-4);
  margin: var(--s-3) 0;
}
.demo__pick .demo__price { color: var(--magenta); font-size: 19px; }
.demo__flag {
  display: inline-block; background: var(--magenta); color: var(--white);
  font-size: 10.5px; font-weight: 800; letter-spacing: 0.09em;
  text-transform: uppercase; padding: 4px 10px;
  border-radius: var(--r-pill); margin-bottom: var(--s-3);
}
.demo__why {
  font-size: 13px; color: var(--navy); line-height: 1.55;
  margin-top: var(--s-3); padding-top: var(--s-3);
  border-top: 1px dashed rgba(227, 11, 92, 0.25);
}
.demo__rejected { opacity: 0.62; }
.demo__strike { text-decoration: line-through; color: var(--muted); }
.demo__warn {
  font-size: 12px; color: var(--danger); font-weight: 600;
  display: flex; align-items: center; gap: 5px; margin-top: 3px;
}
.demo__warn svg { width: 13px; height: 13px; }

/* The little floating &quot;saved&quot; tag on the illustration */
.demo__tag {
  position: absolute; right: 22px; bottom: -20px;
  background: var(--success); color: var(--white);
  border-radius: var(--r-md); padding: 10px 16px;
  font-size: 14px; font-weight: 700;
  box-shadow: 0 10px 24px rgba(13, 150, 105, 0.28);
  display: flex; align-items: center; gap: 7px;
}
.demo__tag svg { width: 16px; height: 16px; }


/* ==========================================================================
   5d. TRUST STRIP
   ========================================================================== */
.trust {
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--white);
  padding: var(--s-5) 0;
}
.trust__inner {
  display: flex; flex-wrap: wrap; align-items: center;
  justify-content: center; gap: var(--s-4) var(--s-7);
}
.trust__item {
  display: flex; align-items: center; gap: var(--s-3);
  font-size: 15px; font-weight: 600; color: var(--navy);
}
.trust__item svg { width: 20px; height: 20px; color: var(--cyan); flex-shrink: 0; }
.trust__item span { font-weight: 400; color: var(--muted); font-size: 14px; display: block; }


/* ==========================================================================
   5e. THE PROBLEM (loss aversion)
   ========================================================================== */
.problem-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--danger);
  border-radius: var(--r-md);
  padding: var(--s-5);
}
.problem-card h3 { font-size: 18px; }
.problem-card p { color: var(--muted); font-size: 15px; margin: 0; }
.problem-cost {
  display: inline-block; margin-top: var(--s-3);
  font-size: 13.5px; font-weight: 700; color: var(--danger);
}


/* ==========================================================================
   5f. HOW IT WORKS (a real sequence, so it is numbered)
   ========================================================================== */
.steps { counter-reset: step; }
.step { position: relative; padding-top: var(--s-6); }
.step::before {
  counter-increment: step;
  content: counter(step);
  position: absolute; top: 0; left: 0;
  width: 42px; height: 42px; border-radius: var(--r-md);
  background: var(--navy); color: var(--white);
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; font-weight: 800;
}
.step__body { padding-top: var(--s-4); }
.step h3 { margin-bottom: var(--s-2); }
.step p { color: var(--muted); font-size: 15.5px; }
/* The connecting line between steps on desktop */
.step::after {
  content: &quot;&quot;; position: absolute; top: 21px; left: 54px; right: -24px;
  height: 2px;
  background: linear-gradient(90deg, var(--line), rgba(227, 232, 242, 0.2));
}
.step:last-child::after { display: none; }


/* ==========================================================================
   5g. QUALITY PROMISE (the differentiator)
   ========================================================================== */
.promise {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-700) 100%);
  color: rgba(255, 255, 255, 0.88);
  border-radius: var(--r-xl);
  padding: var(--s-8) var(--s-7);
  position: relative; overflow: hidden;
}
.promise::after {
  content: &quot;&quot;; position: absolute; right: -70px; top: -70px;
  width: 260px; height: 260px; border-radius: 60px;
  background: rgba(255, 255, 255, 0.04); transform: rotate(20deg);
}
.promise__inner {
  position: relative; display: grid;
  grid-template-columns: 1.1fr 1fr; gap: var(--s-8); align-items: center;
}
.promise h2 { color: var(--white); }
.promise p { color: rgba(255, 255, 255, 0.85); font-size: 17.5px; }

.promise__example {
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: var(--r-lg);
  padding: var(--s-5);
}
.promise__line {
  display: flex; align-items: flex-start; gap: var(--s-3);
  padding: var(--s-3) 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.10);
  font-size: 15px;
}
.promise__line:last-child { border-bottom: none; }
.promise__line svg { width: 19px; height: 19px; flex-shrink: 0; margin-top: 3px; }
.promise__line--no svg { color: #FF8FA9; }
.promise__line--yes svg { color: #4ADE80; }
.promise__line strong { color: var(--white); display: block; font-weight: 700; }
.promise__line span { color: rgba(255, 255, 255, 0.7); font-size: 14px; }


/* ==========================================================================
   5h. FEATURES
   ========================================================================== */
.feature { display: flex; gap: var(--s-4); align-items: flex-start; }
.feature h3 { font-size: 18px; margin-bottom: 5px; }
.feature p { color: var(--muted); font-size: 15.5px; margin: 0; }


/* ==========================================================================
   5i. CALCULATOR TEASER
   ========================================================================== */
.calc-teaser {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  padding: var(--s-8) var(--s-7);
  box-shadow: var(--shadow-2);
  display: grid; grid-template-columns: 1.1fr 0.9fr;
  gap: var(--s-8); align-items: center;
}
.calc-teaser__figures {
  background: var(--surface-2);
  border-radius: var(--r-lg);
  padding: var(--s-5);
}
.calc-row {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: var(--s-4); padding: 11px 0;
  border-bottom: 1px solid var(--line);
  font-size: 15px;
}
.calc-row:last-child { border-bottom: none; }
.calc-row__label { color: var(--muted); }
.calc-row__value { font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
.calc-row--total { padding-top: var(--s-4); margin-top: var(--s-2); border-top: 2px solid var(--line); }
.calc-row--total .calc-row__label { color: var(--text); font-weight: 700; }
.calc-row--total .calc-row__value { color: var(--magenta); font-size: 25px; font-weight: 800; }


/* ==========================================================================
   5j. PRICING
   ========================================================================== */
.plans { align-items: stretch; }
.plan {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: var(--s-6) var(--s-5);
  display: flex; flex-direction: column; gap: var(--s-4);
  transition: transform .2s ease, box-shadow .2s ease;
}
.plan:hover { transform: translateY(-4px); box-shadow: var(--shadow-3); }
.plan--featured {
  border: 2px solid var(--magenta);
  box-shadow: var(--shadow-2);
}
.plan__name { font-size: 19px; font-weight: 800; color: var(--navy); }
.plan__price { font-size: 42px; font-weight: 800; color: var(--navy); line-height: 1; }
.plan__price span { font-size: 16px; font-weight: 500; color: var(--muted); }
.plan__blurb { font-size: 15px; color: var(--muted); min-height: 48px; }
.plan__features { list-style: none; display: flex; flex-direction: column; gap: 11px; flex: 1; }
.plan__features li {
  display: flex; align-items: flex-start; gap: var(--s-2);
  font-size: 15px; color: var(--text);
}
.plan__features svg {
  width: 18px; height: 18px; color: var(--success);
  flex-shrink: 0; margin-top: 3px;
}
/* Two plans instead of three: keep them from stretching across the full
   width, which would leave each card looking empty. */
.plans--two { max-width: 820px; margin: 0 auto; }

.pricing-note {
  text-align: center; margin-top: var(--s-6);
  font-size: 15px; color: var(--muted);
}


/* ==========================================================================
   5k. PROOF (honest placeholders until real quotes exist)
   ========================================================================== */
.quote {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: var(--s-5);
  display: flex; flex-direction: column; gap: var(--s-4);
}
.quote__mark { color: var(--cyan); }
.quote__mark svg { width: 26px; height: 26px; }
.quote p { font-size: 16px; color: var(--text); font-style: italic; margin: 0; }
.quote__who { display: flex; align-items: center; gap: var(--s-3); margin-top: auto; }
.quote__avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--navy-050); color: var(--navy);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 15px; flex-shrink: 0;
}
.quote__name { font-size: 14.5px; font-weight: 700; color: var(--navy); }
.quote__role { font-size: 13.5px; color: var(--muted); }

/* Placeholder styling — deliberately obvious, so it can never ship by accident */
.quote--placeholder {
  border-style: dashed;
  border-color: rgba(202, 138, 4, 0.45);
  background: rgba(202, 138, 4, 0.035);
}
.quote--placeholder p { color: var(--muted); font-style: normal; }
.placeholder-tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--warning);
}
.placeholder-tag svg { width: 14px; height: 14px; }


/* ==========================================================================
   5l. FAQ
   ========================================================================== */
.faq { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--s-3); }
.faq details {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  overflow: hidden;
  transition: border-color .18s ease;
}
.faq details[open] { border-color: rgba(0, 178, 217, 0.4); }
.faq summary {
  padding: var(--s-4) var(--s-5);
  font-size: 16.5px; font-weight: 600; color: var(--navy);
  cursor: pointer; list-style: none;
  display: flex; align-items: center; justify-content: space-between; gap: var(--s-4);
}
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after {
  content: &quot;&quot;; flex-shrink: 0;
  width: 11px; height: 11px;
  border-right: 2px solid var(--cyan); border-bottom: 2px solid var(--cyan);
  transform: rotate(45deg) translateY(-3px);
  transition: transform .2s ease;
}
.faq details[open] summary::after { transform: rotate(-135deg) translateY(-3px); }
.faq summary:hover { background: var(--surface-2); }
.faq__answer { padding: 0 var(--s-5) var(--s-5); color: var(--muted); font-size: 15.5px; }
.faq__answer p:last-child { margin-bottom: 0; }


/* ==========================================================================
   5m. FINAL CALL TO ACTION
   ========================================================================== */
.final-cta {
  background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy) 55%, #0E2A9B 100%);
  padding: var(--s-9) 0;
  text-align: center;
  position: relative; overflow: hidden;
}
.final-cta h2 { color: var(--white); max-width: 18ch; margin: 0 auto var(--s-4); }
.final-cta p {
  color: rgba(255, 255, 255, 0.85); font-size: 19px;
  max-width: 56ch; margin: 0 auto var(--s-6);
}
.final-cta .cta-note { justify-content: center; }


/* ==========================================================================
   5n. FOOTER
   ========================================================================== */
.footer {
  background: var(--navy-900);
  color: rgba(255, 255, 255, 0.72);
  padding: var(--s-8) 0 var(--s-5);
  font-size: 15px;
}
.footer__top {
  display: grid;
  grid-template-columns: 1.6fr 1fr 1fr 1fr;
  gap: var(--s-7);
  padding-bottom: var(--s-6);
  border-bottom: 1px solid rgba(255, 255, 255, 0.14);
}
.footer .brand__name { color: var(--white); }
.footer__tagline { margin: var(--s-4) 0 0; max-width: 34ch; font-size: 14.5px; }
.footer h4 {
  color: var(--white); font-size: 14px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: var(--s-4);
}
.footer ul { list-style: none; display: flex; flex-direction: column; gap: 11px; }
.footer a { color: rgba(255, 255, 255, 0.72); font-size: 15px; }
.footer a:hover { color: var(--white); }
.footer__bottom {
  display: flex; justify-content: space-between; flex-wrap: wrap;
  gap: var(--s-3); padding-top: var(--s-5); font-size: 14px;
}
.footer__disclaimer {
  font-size: 13px; color: rgba(255, 255, 255, 0.5);
  max-width: 70ch; margin-top: var(--s-4); line-height: 1.6;
}


/* ==========================================================================
   6. ANIMATION — subtle only
   ========================================================================== */
/* IMPORTANT: content is visible by default. The starting &quot;hidden&quot; state is
   only applied when the &lt;html&gt; tag carries .js-reveal, which JavaScript adds
   in the page head. So if JavaScript is blocked, broken or still loading, the
   page shows everything rather than a column of blank sections. */
.js-reveal .reveal {
  opacity: 0;
  transform: translateY(18px);
  transition: opacity .55s cubic-bezier(.22,.61,.36,1),
              transform .55s cubic-bezier(.22,.61,.36,1);
}
.js-reveal .reveal.is-visible { opacity: 1; transform: none; }
/* Stagger children slightly so a row of cards arrives in sequence */
.reveal-delay-1 { transition-delay: .07s; }
.reveal-delay-2 { transition-delay: .14s; }
.reveal-delay-3 { transition-delay: .21s; }


/* ==========================================================================
   7. RESPONSIVE — designed at 375px first, then widened
   ========================================================================== */

/* ---- Tablet ---- */
@media (max-width: 1000px) {
  .hero__inner { grid-template-columns: 1fr; gap: var(--s-7); }
  .hero__sub { max-width: 46ch; }
  .promise__inner { grid-template-columns: 1fr; gap: var(--s-6); }
  .calc-teaser { grid-template-columns: 1fr; gap: var(--s-6); padding: var(--s-7) var(--s-5); }
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .footer__top { grid-template-columns: 1fr 1fr; gap: var(--s-6); }
  .step::after { display: none; }
}

/* ---- Where the desktop menu no longer fits ---- */
@media (max-width: 900px) {
  .nav__toggle { display: block; }
  .nav__signin { display: none; }
  .nav__links {
    display: none;
    position: absolute; top: var(--nav-h); left: 0; right: 0;
    flex-direction: column; align-items: stretch; gap: 0;
    background: var(--white);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 14px 26px rgba(10, 17, 114, 0.10);
    padding: var(--s-2) var(--s-5) var(--s-5);
  }
  .nav__links.is-open { display: flex; }
  .nav__links li { border-bottom: 1px solid var(--line); }
  .nav__links li:last-child { border-bottom: none; }
  .nav__links a { display: block; padding: 15px 0; border-bottom: none; font-size: 16.5px; }
  .nav__links .nav__mobile-signin { display: block; color: var(--navy); font-weight: 700; }
}

/* ---- Phones ---- */
@media (max-width: 700px) {
  body { font-size: 16px; }

  /* Give plain text links a taller tap area. 17px of text is easy to miss
     with a thumb; padding takes each one over the 24px minimum. */
  .footer ul a, .announce a { display: inline-block; padding: 5px 0; }

  /* Keep the announcement text clear of the close button when it wraps */
  .announce__inner { padding-right: 48px; }

  /* Drop the arrow on the big buttons so their label stays on one line */
  .btn--lg svg { display: none; }
  .section { padding: var(--s-8) 0; }
  .section-head { margin-bottom: var(--s-6); text-align: left; }
  .section-head p { font-size: 17px; }

  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }

  .hero { padding: var(--s-7) 0 var(--s-6); }
  .hero__sub { font-size: 18px; }
  .hero__actions { flex-direction: column; align-items: stretch; }
  .hero__actions .btn { width: 100%; }

  .demo__tag { right: 8px; bottom: -16px; }

  .trust__inner { justify-content: flex-start; gap: var(--s-4); }
  .trust__item { width: 100%; }

  .promise { padding: var(--s-7) var(--s-5); }
  .final-cta { padding: var(--s-8) 0; }
  .final-cta p { font-size: 17px; }
  .final-cta .btn { width: 100%; }
  .cta-note { justify-content: flex-start; }

  .footer__top { grid-template-columns: 1fr; gap: var(--s-6); }
  .plan__blurb { min-height: 0; }
}

/* ---- Anyone who asks their device to reduce motion ---- */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    transition: none !important;
    animation: none !important;
  }
  .js-reveal .reveal { opacity: 1; transform: none; }
}

    &lt;!-- ====================================================================
         5. THE PROBLEM — loss aversion. Name the cost, don&#x27;t sell yet.
         ==================================================================== --&gt;
    &lt;section class=&quot;section&quot;&gt;
      &lt;div class=&quot;container&quot;&gt;
        &lt;div class=&quot;section-head reveal&quot;&gt;
          &lt;span class=&quot;eyebrow eyebrow--magenta&quot;&gt;The way it works today&lt;/span&gt;
          &lt;h2&gt;Four ways a care home quietly loses money every month&lt;/h2&gt;
          &lt;p&gt;None of them are anyone&amp;rsquo;s fault. They are what happens when ordering is
             spread across a dozen suppliers and nobody has time to check.&lt;/p&gt;
        &lt;/div&gt;

        &lt;div class=&quot;grid grid-4&quot;&gt;
          &lt;article class=&quot;problem-card reveal&quot;&gt;
            &lt;div class=&quot;icon-tile icon-tile--danger icon-tile--sm&quot; style=&quot;margin-bottom:14px&quot;&gt;
              &lt;svg class=&quot;ico&quot; viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z&quot;/&gt;&lt;path d=&quot;M3 7.5 12 12l9-4.5M12 12v9&quot;/&gt;&lt;/svg&gt;
            &lt;/div&gt;
            &lt;h3&gt;Twelve suppliers, twelve invoices&lt;/h3&gt;
            &lt;p&gt;A separate login, a separate delivery and a separate invoice to check for every
               category. Volume gets split, so no one gives you a volume price.&lt;/p&gt;
            &lt;span class=&quot;problem-cost&quot;&gt;Typically 15&amp;ndash;25% above a consolidated price&lt;/span&gt;
          &lt;/article&gt;

          &lt;article class=&quot;problem-card reveal reveal-delay-1&quot;&gt;
            &lt;div class=&quot;icon-tile icon-tile--danger icon-tile--sm&quot; style=&quot;margin-bottom:14px&quot;&gt;
              &lt;svg class=&quot;ico&quot; viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot;/&gt;&lt;path d=&quot;M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01&quot;/&gt;&lt;/svg&gt;
            &lt;/div&gt;
            &lt;h3&gt;Nobody knows if the price is fair&lt;/h3&gt;
            &lt;p&gt;Without a benchmark you are taking a rep&amp;rsquo;s word for it. Prices drift upward
               between contract reviews and nothing flags it.&lt;/p&gt;
            &lt;span class=&quot;problem-cost&quot;&gt;Invisible until someone checks&lt;/span&gt;
          &lt;/article&gt;

          &lt;article class=&quot;problem-card reveal reveal-delay-2&quot;&gt;
            &lt;div class=&quot;icon-tile icon-tile--danger icon-tile--sm&quot; style=&quot;margin-bottom:14px&quot;&gt;
              &lt;svg class=&quot;ico&quot; viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot;/&gt;&lt;path d=&quot;M12 7v5l3 2&quot;/&gt;&lt;/svg&gt;
            &lt;/div&gt;
            &lt;h3&gt;Two days a week on ordering&lt;/h3&gt;
            &lt;p&gt;Placing orders, chasing deliveries, checking invoices, counting stock. Senior
               time that should be on the floor with residents.&lt;/p&gt;
            &lt;span class=&quot;problem-cost&quot;&gt;About &amp;pound;7,800 a year at 10 hours a week&lt;/span&gt;
          &lt;/article&gt;

          &lt;article class=&quot;problem-card reveal reveal-delay-3&quot;&gt;
            &lt;div class=&quot;icon-tile icon-tile--danger icon-tile--sm&quot; style=&quot;margin-bottom:14px&quot;&gt;
              &lt;svg class=&quot;ico&quot; viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M12 9v4M12 17h.01&quot;/&gt;&lt;path d=&quot;M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z&quot;/&gt;&lt;/svg&gt;
            &lt;/div&gt;
            &lt;h3&gt;The cheapest option can be unsafe&lt;/h3&gt;
            &lt;p&gt;Powdered latex gloves. A pad with no wetness indicator. A perfumed wash on
               fragile skin. Buying on price alone reaches residents.&lt;/p&gt;
            &lt;span class=&quot;problem-cost&quot;&gt;A cost that never shows on the invoice&lt;/span&gt;
          &lt;/article&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- ====================================================================
         12. FAQ — the objections a manager raises before they trust you
         ==================================================================== --&gt;
    &lt;section class=&quot;section section--white&quot;&gt;
      &lt;div class=&quot;container&quot;&gt;
        &lt;div class=&quot;section-head reveal&quot;&gt;
          &lt;span class=&quot;eyebrow&quot;&gt;Questions&lt;/span&gt;
          &lt;h2&gt;The things managers ask us first&lt;/h2&gt;
        &lt;/div&gt;

        &lt;div class=&quot;faq reveal&quot;&gt;
          &lt;details&gt;
            &lt;summary&gt;Do suppliers pay you to be recommended?&lt;/summary&gt;
            &lt;div class=&quot;faq__answer&quot;&gt;
              &lt;p&gt;No. We take no commission, no listing fee and no referral payment from any
                 supplier, ever. You pay us, which is exactly why our ranking can be trusted.
                 If that ever changed, this page would say so.&lt;/p&gt;
            &lt;/div&gt;
          &lt;/details&gt;

          &lt;details&gt;
            &lt;summary&gt;What happens to our existing suppliers and contracts?&lt;/summary&gt;
            &lt;div class=&quot;faq__answer&quot;&gt;
              &lt;p&gt;Nothing, unless you decide otherwise. Sennicare shows you what else is
                 available at what price &amp;mdash; it does not cancel anything or contact anyone
                 on your behalf. Plenty of homes use it to check that their current supplier is
                 still competitive, and stay put.&lt;/p&gt;
            &lt;/div&gt;
          &lt;/details&gt;

          &lt;details&gt;
            &lt;summary&gt;We already use a buying group. Is this the same thing?&lt;/summary&gt;
            &lt;div class=&quot;faq__answer&quot;&gt;
              &lt;p&gt;No. A buying group negotiates on your behalf and usually earns a rebate from
                 the suppliers in it, so its list is the list you get. Sennicare has no
                 financial relationship with any supplier and shows you everything, including
                 options your buying group doesn&amp;rsquo;t carry.&lt;/p&gt;
            &lt;/div&gt;
          &lt;/details&gt;

          &lt;details&gt;
            &lt;summary&gt;Is our data safe?&lt;/summary&gt;
            &lt;div class=&quot;faq__answer&quot;&gt;
              &lt;p&gt;Your care home details, searches and orders sit in your own account and are
                 visible only to you. No other subscriber can see them. Nothing is shared with
                 a supplier until you choose to send a request &amp;mdash; and when you do, it goes
                 from your own email, so their reply comes straight back to you. You can
                 download or delete everything we hold at any time.&lt;/p&gt;
            &lt;/div&gt;
          &lt;/details&gt;

          &lt;details&gt;
            &lt;summary&gt;How do you decide what is &amp;ldquo;suitable for elderly care&amp;rdquo;?&lt;/summary&gt;
            &lt;div class=&quot;faq__answer&quot;&gt;
              &lt;p&gt;Every product carries a rating out of five and a plain yes or no on
                 suitability, based on the things that matter in a care setting: latex and
                 fragrance in skin-contact products, absorbency and wetness indicators in
                 continence products, dignity in dining products, and the relevant standards
                 such as EN 455 or ISO 13485. Anything rated below our floor is shown but never
                 recommended.&lt;/p&gt;
            &lt;/div&gt;
          &lt;/details&gt;

          &lt;details&gt;
            &lt;summary&gt;Will this help at our next CQC inspection?&lt;/summary&gt;
            &lt;div class=&quot;faq__answer&quot;&gt;
              &lt;p&gt;It gives you a written record of what you ordered, from whom, at what price
                 and against what standards &amp;mdash; which is the sort of evidence inspectors ask
                 for when they look at how a home is run. We are not affiliated with the CQC
                 and cannot speak for them.&lt;/p&gt;
            &lt;/div&gt;
          &lt;/details&gt;

          &lt;details&gt;
            &lt;summary&gt;What does &amp;ldquo;free&amp;rdquo; actually mean?&lt;/summary&gt;
            &lt;div class=&quot;faq__answer&quot;&gt;
              &lt;p&gt;Free Forever means exactly that: no card, no trial clock, no expiry. You get
                 up to two user accounts, the supplier directory and a monthly spend summary.
                 Professional, at &amp;pound;49 a month, adds unlimited users, the full market
                 intelligence dashboard, price discrepancy alerts, exports and priority
                 support. There is no contract and no notice period &amp;mdash; cancel from inside
                 your account.&lt;/p&gt;
            &lt;/div&gt;
          &lt;/details&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

   The only line you may want to edit is SENNICARE_EMAIL, just below.
   ========================================================================== */

/* Where sign-ups should arrive. */
var SENNICARE_EMAIL = &#x27;hello@sennicare.co.uk&#x27;;


document.addEventListener(&#x27;DOMContentLoaded&#x27;, function () {

  /* ======================================================================
     1. MOBILE MENU
     ====================================================================== */
  var navToggle = document.getElementById(&#x27;navToggle&#x27;);
  var navLinks = document.getElementById(&#x27;navLinks&#x27;);

  if (navToggle &amp;&amp; navLinks) {
    navToggle.addEventListener(&#x27;click&#x27;, function () {
      var isOpen = navLinks.classList.toggle(&#x27;is-open&#x27;);
      navToggle.setAttribute(&#x27;aria-expanded&#x27;, isOpen ? &#x27;true&#x27; : &#x27;false&#x27;);
      navToggle.setAttribute(&#x27;aria-label&#x27;, isOpen ? &#x27;Close menu&#x27; : &#x27;Open menu&#x27;);
    });

    /* Tapping a link closes the menu again. */
    navLinks.addEventListener(&#x27;click&#x27;, function (event) {
      if (event.target.tagName === &#x27;A&#x27;) {
        navLinks.classList.remove(&#x27;is-open&#x27;);
        navToggle.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
        navToggle.setAttribute(&#x27;aria-label&#x27;, &#x27;Open menu&#x27;);

    });

    /* Escape closes it too, and puts focus back on the button. */
    document.addEventListener(&#x27;keydown&#x27;, function (event) {
      if (event.key === &#x27;Escape&#x27; &amp;&amp; navLinks.classList.contains(&#x27;is-open&#x27;)) {

        navToggle.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
        navToggle.focus();
      }
    });
  }


  /* ======================================================================
     2. A LINE UNDER THE NAVIGATION BAR ONCE SCROLLED
     ====================================================================== */
  var nav = document.getElementById(&#x27;nav&#x27;);

  if (nav) {
    var updateNav = function () {
      nav.classList.toggle(&#x27;is-scrolled&#x27;, window.scrollY &gt; 8);
    };
    updateNav();
    window.addEventListener(&#x27;scroll&#x27;, updateNav, { passive: true });
  }


  /* ======================================================================
     3. THE ANNOUNCEMENT BAR
     Once closed, it stays closed on this device. localStorage is a small
     notepad the browser keeps for our site.
     ====================================================================== */
  var announce = document.getElementById(&#x27;announce&#x27;);
  var announceClose = document.getElementById(&#x27;announceClose&#x27;);
  var ANNOUNCE_KEY = &#x27;sennicare-announce-closed&#x27;;

  if (announce &amp;&amp; announceClose) {
    try {
      if (window.localStorage.getItem(ANNOUNCE_KEY) === &#x27;yes&#x27;) {
        announce.hidden = true;
      }
    } catch (error) {

         simply shows every visit. */
    }

    announceClose.addEventListener(&#x27;click&#x27;, function () {
      announce.hidden = true;
      try { window.localStorage.setItem(ANNOUNCE_KEY, &#x27;yes&#x27;); } catch (error) {}
    });

  /* ======================================================================
     4. FADE SECTIONS IN AS THEY ARRIVE
     IntersectionObserver tells us when something scrolls into view. Anything
     with class=&quot;reveal&quot; fades up once, then stays put.
     ====================================================================== */
  var revealItems = document.querySelectorAll(&#x27;.reveal&#x27;);
  var prefersReducedMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;

  var showEverything = function () {
    revealItems.forEach(function (item) { item.classList.add(&#x27;is-visible&#x27;); });
  };

  if (prefersReducedMotion || !(&#x27;IntersectionObserver&#x27; in window)) {
    /* Show everything immediately: either the visitor asked for less motion,
       or their browser is too old for the effect. */

    var watcher = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {

        }
      });
    }, {
      /* A tiny threshold, so a section counts as &quot;arrived&quot; as soon as any of
         it appears. Being fussy here is how sections end up stuck invisible. */
      threshold: 0.01,
      rootMargin: &#x27;0px 0px -8% 0px&#x27;
    });

       page - nothing stays invisible for more than a few seconds. Content

    window.setTimeout(showEverything, 2500);
    window.addEventListener(&#x27;beforeprint&#x27;, showEverything);

     5. THE SIGN-UP FORM
     A website made only of files cannot send email by itself, so we check
     the details and then open the visitor&#x27;s own email app with everything
     written out. See the note in index.html for the Formspree upgrade.
     ====================================================================== */
  var form = document.getElementById(&#x27;signupForm&#x27;);
  var formMessage = document.getElementById(&#x27;formMessage&#x27;);

  if (form &amp;&amp; formMessage) {

    var showMessage = function (text, kind) {
      formMessage.textContent = text;
      formMessage.style.display = &#x27;block&#x27;;

      if (kind === &#x27;error&#x27;) {
        formMessage.style.background = &#x27;rgba(220, 38, 38, 0.16)&#x27;;
        formMessage.style.border = &#x27;1px solid rgba(255, 143, 169, 0.7)&#x27;;
        formMessage.style.color = &#x27;#FFD7DF&#x27;;
      } else {

      event.preventDefault();

      var name = form.name.value.trim();
      var carehome = form.carehome.value.trim();
      var email = form.email.value.trim();

      if (!name || !carehome || !email) {
        showMessage(&#x27;Please fill in all three boxes so we can set your account up properly.&#x27;, &#x27;error&#x27;);
        return;

      if (!looksLikeEmail) {

        &#x27;Care home: &#x27; + carehome + &#x27;\n&#x27; +
        &#x27;Email: &#x27; + email + &#x27;\n\n&#x27; +
        &#x27;I would like a free Sennicare account.\n&#x27;;

        &#x27;?subject=&#x27; + encodeURIComponent(subject) +
        &#x27;&amp;body=&#x27; + encodeURIComponent(body);

      showMessage(
        &#x27;Thank you, &#x27; + name + &#x27;. Your email app should now open with your request ready &#x27; +
        &#x27;to send. If it does not, email us at &#x27; + SENNICARE_EMAIL + &#x27;.&#x27;,
        &#x27;success&#x27;
      );
    });
  }

});

/* ==========================================================================
   Sennicare website styles
   --------------------------------------------------------------------------
   HOW THIS FILE IS ORGANISED (top to bottom):
     1. Brand colours and other settings (CSS &quot;variables&quot;)
     2. Basic resets and page-wide defaults
     3. Reusable pieces (buttons, section headings, cards)
     4. Each section of the page, in the order it appears
     5. Mobile / tablet adjustments at the very bottom

   TIP: To change a brand colour everywhere on the site, you only need to edit
   the values in section 1 below. Nothing else needs touching.
   ========================================================================== */


/* ==========================================================================
   1. BRAND SETTINGS (CSS variables)
   A &quot;variable&quot; is just a saved value with a name. We write --navy: #0A1172
   once, then use var(--navy) everywhere we want that colour.
   ========================================================================== */
:root {
  /* Brand colours */
  --navy:        #0A1172;  /* Deep navy blue - main brand colour, headings, structure */
  --magenta:     #E30B5C;  /* Bright magenta pink - call-to-action buttons, accents */
  --cyan:        #00B2D9;  /* Vibrant cyan blue - secondary accents, highlights */
  --white:       #FFFFFF;  /* White - page backgrounds */
  --grey-light:  #F5F7FA;  /* Light grey - card and section backgrounds */

  /* Supporting colours, derived from the brand palette */
  --navy-dark:   #070C52;  /* Slightly darker navy, used for button hover states */
  --magenta-dark:#C10A4E;  /* Slightly darker magenta, used for button hover states */
  --text-body:   #454B66;  /* Soft navy-grey for body text (easier to read than pure black) */
  --border:      #E3E8F0;  /* Very light grey for borders and dividers */

  /* Typography: a clean modern sans-serif. We list several fonts so the
     browser uses the first one available on the visitor&#x27;s computer. */
  --font: &quot;Inter&quot;, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;

  /* Layout settings */
  --max-width: 1180px;  /* How wide the content can grow on large screens */
  --radius:    16px;    /* Standard rounded-corner size */
  --nav-height: 84px;   /* Height of the fixed navigation bar */

  /* Shadows, for a soft &quot;lifted card&quot; look */
  --shadow-soft:  0 4px 16px rgba(10, 17, 114, 0.07);
  --shadow-lift:  0 14px 32px rgba(10, 17, 114, 0.14);
}


/* ==========================================================================
   2. RESETS AND PAGE DEFAULTS
   ========================================================================== */

/* box-sizing: border-box makes width calculations behave predictably
   (padding and borders are counted inside an element&#x27;s width). */
*, *::before, *::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.65;
  color: var(--text-body);
  background: var(--white);
  -webkit-font-smoothing: antialiased;  /* Slightly crisper text on Macs */
}

/* Smooth scrolling when a visitor clicks a menu link.
   scroll-padding-top stops the fixed navbar covering the section heading. */
html {
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--nav-height) + 16px);
}

/* Headings use navy and a tighter line height than body text */
h1, h2, h3, h4 {
  color: var(--navy);
  line-height: 1.15;
  margin: 0 0 0.5em;
  font-weight: 800;
  letter-spacing: -0.02em;
}

p { margin: 0 0 1em; }

a { color: var(--navy); text-decoration: none; }
a:hover { text-decoration: underline; }

img, svg { max-width: 100%; display: block; }

/* A &quot;container&quot; centres content and stops it stretching too wide */
.container {
  width: 100%;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 24px;
}

/* Standard vertical spacing for a page section */
.section {
  padding: 88px 0;
}
.section--grey { background: var(--grey-light); }

/* Visible focus outline for keyboard users (accessibility) */
a:focus-visible,
button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 3px solid var(--cyan);
  outline-offset: 2px;
}


/* ==========================================================================
   3. REUSABLE PIECES

/* ---- Buttons ---- */
.btn {
  display: inline-block;
  padding: 15px 30px;
  border: none;
  border-radius: 8px;
  font-family: var(--font);
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  /* &quot;transition&quot; makes hover changes fade in smoothly instead of snapping */
  transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
}
.btn:hover { text-decoration: none; }

/* Main magenta call-to-action button */
.btn--primary {
  background: var(--magenta);
  color: var(--white);
}
.btn--primary:hover {
  background: var(--magenta-dark);
  transform: translateY(-2px);              /* lifts by 2 pixels on hover */
  box-shadow: 0 10px 22px rgba(227, 11, 92, 0.32);
}

/* Smaller version, used in the navigation bar */
.btn--nav { padding: 12px 24px; font-size: 16px; }

.section__head {

}

}

}

.eyebrow {

}

/* ---- Icon badge (the small rounded square behind each icon) ---- */
.icon-badge {
  width: 52px;
  height: 52px;
  border-radius: 12px;
  display: flex;

  justify-content: center;
  margin-bottom: 18px;

.icon-badge svg { width: 26px; height: 26px; stroke: currentColor; fill: none; }

   4a. NAVIGATION BAR (fixed to the top of the screen)
   ========================================================================== */
.navbar {

/* Menu links */
.navbar__links {
  display: flex;

  font-size: 17px;

.navbar__links-cta { display: none; }

.navbar__toggle {

}
.navbar__toggle svg { width: 28px; height: 28px; stroke: currentColor; fill: none; }


/* ==========================================================================
   4b. HERO SECTION
   ========================================================================== */
.hero {
  padding: calc(var(--nav-height) + 28px) 0 32px;
}
.hero__card {
  position: relative;              /* lets us layer text on top of the image */
  border-radius: 22px;

  min-height: 430px;
  display: flex;
  align-items: center;
  box-shadow: var(--shadow-soft);
  background: var(--navy);         /* shows while the photo loads */
}
.hero__image {
  position: absolute;
  inset: 0;                        /* fills the whole card */
  width: 100%;
  height: 100%;
  object-fit: cover;               /* crops rather than squashes the photo */
}
/* A dark gradient over the photo so white text stays readable */
.hero__overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(100deg,
              rgba(10, 17, 114, 0.78) 0%,
              rgba(10, 17, 114, 0.45) 45%,
              rgba(10, 17, 114, 0.05) 78%);

.hero__content {

  padding: 56px 48px;

}
.hero__title {

/* Three small trust statements underneath the hero */
.hero__stats {

  grid-template-columns: repeat(3, 1fr);

  font-size: 26px;

/* ==========================================================================
   4c. OUR INTEGRATED SERVICES
   ========================================================================== */
.services__grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);   /* three equal-width columns */
  gap: 26px;
}
.service-card {
  background: var(--grey-light);
  border-radius: var(--radius);
  padding: 30px 28px 34px;
  /* The thin coloured line along the bottom of each card */
  border-bottom: 4px solid var(--cyan);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
/* Card 3 uses magenta instead of cyan */
.service-card--magenta { border-bottom-color: var(--magenta); }

.service-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow-lift);
}
.service-card h3 { font-size: 22px; margin-bottom: 8px; }
.service-card p  { margin: 0; }


/* ==========================================================================
   4d. HOW SENNICARE WORKS (3 steps)
   ========================================================================== */
.steps {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
  counter-reset: step;      /* starts the automatic 1, 2, 3 numbering */
}
.step {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 34px 28px;
  position: relative;
}
/* The big numbered circle-free badge, generated automatically */
.step::before {
  counter-increment: step;
  content: counter(step);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 46px;
  border-radius: 12px;
  background: var(--navy);
  color: var(--white);
  font-size: 21px;
  font-weight: 800;
  margin-bottom: 18px;
}
.step h3 { font-size: 21px; margin-bottom: 8px; }
.step p  { margin: 0; }


/* ==========================================================================
   4e. WHY CARE HOMES CHOOSE SENNICARE (4 benefits)
   ========================================================================== */
.benefits {
  display: grid;
  grid-template-columns: repeat(2, 1fr);   /* two per row on desktop */
  gap: 30px 40px;
}
.benefit {
  display: flex;
  gap: 18px;
  align-items: flex-start;
}
.benefit h3 { font-size: 20px; margin-bottom: 6px; }
.benefit p  { margin: 0; }


/* ==========================================================================
   4f. SAVINGS CALCULATOR (Phase 2 - the section that holds the tool)
   ========================================================================== */
.calc-embed {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-soft);
  overflow: hidden;
}


/* ==========================================================================
   4g. BIG CALL-TO-ACTION BAND (full-width navy)
   ========================================================================== */
.cta-band {
  background: var(--navy);
  padding: 84px 0;
  text-align: center;
}
.cta-band h2 {
  color: var(--white);
  font-size: 40px;
  margin-bottom: 14px;
}
.cta-band p {
  color: rgba(255, 255, 255, 0.88);
  font-size: 20px;
  margin-bottom: 34px;
}


/* ==========================================================================
   4h. CONTACT FORM
   ========================================================================== */
.contact {
  display: grid;
  grid-template-columns: 1fr 1.15fr;   /* text on the left, form on the right */
  gap: 56px;
  align-items: start;
}
.contact__list {
  list-style: none;
  padding: 0;
  margin: 24px 0 0;
}
.contact__list li {
  display: flex;
  gap: 12px;
  margin-bottom: 14px;
}
.contact__list svg {
  width: 22px; height: 22px;
  stroke: var(--cyan); fill: none;
  flex-shrink: 0; margin-top: 4px;
}

.form {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 30px;
  box-shadow: var(--shadow-soft);
}
.form__row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}
.form__field { margin-bottom: 18px; }
.form__field label {
  display: block;
  font-size: 15px;
  font-weight: 600;
  color: var(--navy);
  margin-bottom: 6px;
}
.form__field input,
.form__field textarea {
  width: 100%;
  padding: 13px 14px;
  font-family: var(--font);
  font-size: 16px;
  color: var(--navy);
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  transition: border-color 0.2s ease;
}
.form__field input:focus,
.form__field textarea:focus {
  border-color: var(--cyan);
}
.form__field textarea { resize: vertical; min-height: 120px; }

.form__note { font-size: 14px; margin: 14px 0 0; }

/* The green/red message shown after someone submits the form */
.form__message {
  display: none;                 /* JavaScript reveals this when needed */
  margin-top: 16px;
  padding: 14px 16px;
  border-radius: 8px;
  font-size: 16px;
}
.form__message.is-visible { display: block; }
.form__message.is-success {
  background: rgba(0, 178, 217, 0.10);
  color: var(--navy);
  border: 1px solid var(--cyan);
}
.form__message.is-error {
  background: rgba(227, 11, 92, 0.08);
  color: var(--magenta-dark);
  border: 1px solid var(--magenta);
}


/* ==========================================================================
   4i. FOOTER
   ========================================================================== */
.footer {
  background: var(--navy);
  color: rgba(255, 255, 255, 0.78);
  padding: 60px 0 28px;
  font-size: 16px;
}
.footer__top {
  display: grid;
  grid-template-columns: 1.6fr 1fr 1fr;
  gap: 40px;
  padding-bottom: 36px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.16);
}
.footer .brand { color: var(--white); }
.footer__tagline { margin: 14px 0 0; max-width: 320px; }
.footer h4 {
  color: var(--white);
  font-size: 16px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 16px;
}
.footer ul { list-style: none; margin: 0; padding: 0; }
.footer li { margin-bottom: 10px; }
.footer a { color: rgba(255, 255, 255, 0.78); }
.footer a:hover { color: var(--white); }

.footer__bottom {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding-top: 22px;
  font-size: 15px;
}


/* ==========================================================================
   4j. SIMPLE LEGAL / TEXT PAGES (privacy.html, terms.html)
   ========================================================================== */
.page-header {
  background: var(--grey-light);
  padding: calc(var(--nav-height) + 56px) 0 56px;
}
.page-header h1 { font-size: 44px; margin-bottom: 8px; }
.prose { max-width: 760px; }
.prose h2 { font-size: 26px; margin-top: 40px; }
.prose ul { padding-left: 22px; }
.prose li { margin-bottom: 8px; }


/* ==========================================================================
   5. RESPONSIVE ADJUSTMENTS
   A &quot;media query&quot; applies styles only when the screen is a certain size.
   max-width: 900px means &quot;on screens 900 pixels wide or narrower&quot;.
   ========================================================================== */

/* --- Tablet --- */
@media (max-width: 980px) {
  .services__grid,
  .steps {
    grid-template-columns: 1fr 1fr;   /* three columns become two */
  }
  .contact { grid-template-columns: 1fr; gap: 34px; }
  .section__title, .cta-band h2 { font-size: 34px; }
  .footer__top { grid-template-columns: 1fr 1fr; }
}

/* --- Small laptops and tablets: slightly tighter menu spacing ---
   This keeps the five menu links on one line for as long as possible. */
@media (max-width: 1150px) {
  .navbar__links { gap: 24px; }
  .navbar__links a { font-size: 16px; }
}

/* --- Tablets and phones: swap the menu for the hamburger button ---
   Below 980 pixels there isn&#x27;t room for five links plus the button, so we
   collapse them into the drop-down menu. */
@media (max-width: 979px) {
  /* Show the hamburger button, hide the desktop menu and desktop button */
  .navbar__toggle { display: block; }
  .navbar__cta { display: none; }

  /* The mobile menu: a white panel that drops down below the navbar.
     It is hidden until JavaScript adds the &quot;is-open&quot; class. */
  .navbar__links {
    display: none;
    position: absolute;
    top: var(--nav-height);
    left: 0; right: 0;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    background: var(--white);
    padding: 8px 24px 20px;
    box-shadow: 0 12px 22px rgba(10, 17, 114, 0.12);
  }
  .navbar__links.is-open { display: flex; }
  .navbar__links li { border-bottom: 1px solid var(--border); }
  .navbar__links a { display: block; padding: 14px 0; border-bottom: none; font-size: 17px; }
  /* Show the magenta CTA at the bottom of the open mobile menu */
  .navbar__links-cta { display: block; border-bottom: none !important; margin-top: 16px; }
  .navbar__links-cta a { color: var(--white); font-weight: 700; padding: 15px 30px; text-align: center; }
  .navbar__links-cta a:hover { color: var(--white); }
}

/* --- Mobile phones --- */
@media (max-width: 700px) {
  body { font-size: 16px; }
  .section { padding: 60px 0; }

  /* Everything stacks into a single column */
  .services__grid,
  .steps,
  .benefits,
  .hero__stats,
  .form__row,
  .footer__top {
    grid-template-columns: 1fr;
  }

  .hero { padding-top: calc(var(--nav-height) + 16px); }
  .hero__card { min-height: 0; }
  .hero__content { padding: 40px 26px; }
  .hero__subtitle { font-size: 18px; }
  /* On small screens a side-to-side gradient looks odd, so fade top-to-bottom */
  .hero__overlay {
    background: linear-gradient(180deg,
                rgba(10, 17, 114, 0.55) 0%,
                rgba(10, 17, 114, 0.82) 100%);
  }

  .cta-band { padding: 60px 0; }
  .btn--large { padding: 17px 32px; font-size: 18px; }
  .page-header h1 { font-size: 34px; }
}

/* Respect visitors who ask their device to reduce animation (accessibility) */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; }
}


/* ==========================================================================
   6. SAVINGS CALCULATOR (used by savings-calculator.html)
   These styles are only used on the calculator page. They reuse the same
   brand colours and fonts defined at the top of this file.
   ========================================================================== */

/* The overall two-column layout: inputs on the left, results on the right.
   &quot;1fr 1fr&quot; means two equal columns. On mobile this becomes one column
   (see the media query at the bottom of this section). */
.calc {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 34px;
  align-items: start;
}

/* ---- Left column: the input panel ---- */
.calc__inputs {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 30px;
  box-shadow: var(--shadow-soft);
}
.calc__inputs h2 { font-size: 24px; margin-bottom: 6px; }
.calc__intro { font-size: 16px; margin-bottom: 26px; }

/* One question (label + input) */
.calc-field { margin-bottom: 26px; }
.calc-field:last-of-type { margin-bottom: 8px; }

/* The label sits on one line, with the current value shown on the right */
.calc-field__top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 10px;
}
.calc-field__label {
  font-size: 16px;
  font-weight: 600;
  color: var(--navy);
}
/* The live value shown beside a slider, e.g. &quot;14 suppliers&quot; or &quot;8%&quot; */
.calc-field__value {
  font-size: 17px;
  font-weight: 800;
  color: var(--cyan);
  white-space: nowrap;
}
.calc-field__hint {
  font-size: 14px;
  color: var(--text-body);
  margin: 8px 0 0;
}

/* A text box for typing a number, with a £ symbol tucked inside on the left */
.calc-money {
  position: relative;
}
.calc-money__symbol {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 17px;
  font-weight: 700;
  color: var(--navy);
  pointer-events: none;   /* clicks pass through to the input behind it */
}
.calc-field input[type=&quot;number&quot;] {
  width: 100%;
  padding: 13px 14px;
  font-family: var(--font);
  font-size: 17px;
  font-weight: 600;
  color: var(--navy);
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  transition: border-color 0.2s ease;
}
.calc-money input[type=&quot;number&quot;] { padding-left: 32px; }   /* room for the £ */
.calc-field input[type=&quot;number&quot;]:focus { border-color: var(--cyan); }

/* ---- Sliders ----
   Sliders need a few browser-specific lines to look the same everywhere.
   &quot;appearance: none&quot; removes the browser&#x27;s default look so ours shows. */
.calc-field input[type=&quot;range&quot;] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 8px;
  margin: 6px 0;
  border-radius: 999px;
  background: var(--border);   /* the track the handle slides along */
  cursor: pointer;
}
/* The round handle - Chrome, Edge and Safari */
.calc-field input[type=&quot;range&quot;]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--cyan);
  border: 4px solid var(--white);
  box-shadow: 0 2px 8px rgba(10, 17, 114, 0.28);
  cursor: pointer;
}
/* The round handle - Firefox */
.calc-field input[type=&quot;range&quot;]::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--cyan);
  border: 4px solid var(--white);
  box-shadow: 0 2px 8px rgba(10, 17, 114, 0.28);
  cursor: pointer;
}
/* Small &quot;1&quot; and &quot;30&quot; labels under a slider, showing its range */
.calc-field__scale {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--text-body);
  margin-top: 2px;
}

/* The little &quot;Reset&quot; link at the bottom of the inputs panel */
.calc__reset {
  background: none;
  border: none;
  padding: 0;
  margin-top: 6px;
  font-family: var(--font);
  font-size: 15px;
  font-weight: 600;
  color: var(--cyan);
  cursor: pointer;
  text-decoration: underline;
}

/* ---- Right column: the results panel ---- */
/* &quot;sticky&quot; keeps the results visible on screen while you scroll the inputs. */
.calc__results {
  position: sticky;
  top: calc(var(--nav-height) + 20px);
}

/* A single result: big number + label */
.result {
  background: var(--grey-light);
  border-radius: var(--radius);
  padding: 22px 24px;
  margin-bottom: 16px;
  border-left: 4px solid var(--cyan);
}
.result__label {
  display: block;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-body);
  margin-bottom: 4px;
}
.result__value {
  display: block;
  font-size: 38px;
  font-weight: 800;
  line-height: 1.1;
  color: var(--navy);
  letter-spacing: -0.02em;
}
.result__note {
  display: block;
  font-size: 14px;
  color: var(--text-body);
  margin-top: 6px;
}

/* The headline total, highlighted in magenta */
.result--total {
  background: rgba(227, 11, 92, 0.06);   /* very pale magenta tint */
  border: 2px solid var(--magenta);
  border-left-width: 6px;
  padding: 28px;
}
.result--total .result__label {
  color: var(--magenta-dark);
  font-size: 16px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.result--total .result__value {
  color: var(--magenta);
  font-size: 54px;
}
/* The &quot;plus X hours given back&quot; line under the total */
.result--total .result__note {
  font-size: 17px;
  font-weight: 600;
  color: var(--navy);
  margin-top: 10px;
}

/* The consolidation recommendation box */
.calc-recommend {
  background: var(--navy);
  color: rgba(255, 255, 255, 0.9);
  border-radius: var(--radius);
  padding: 22px 24px;
  margin-bottom: 16px;
  font-size: 16px;
}
.calc-recommend strong { color: var(--white); }

/* The call-to-action block underneath the results */
.calc-cta {
  margin-top: 22px;
  text-align: center;
}
.calc-cta .btn { width: 100%; }
.calc-cta__secondary {
  display: inline-block;
  margin-top: 14px;
  font-size: 15px;
  font-weight: 600;
  color: var(--cyan);
}

/* Small print explaining where the percentages come from */
.calc-assumptions {
  margin-top: 40px;
  padding: 26px 28px;
  background: var(--grey-light);
  border-radius: var(--radius);
  font-size: 15px;
}
.calc-assumptions h3 { font-size: 18px; margin-bottom: 12px; }
.calc-assumptions ul { margin: 0; padding-left: 20px; }
.calc-assumptions li { margin-bottom: 8px; }

/* ---- Calculator: mobile and tablet ---- */
@media (max-width: 980px) {
  .calc { grid-template-columns: 1fr; }   /* stack into one column */
  /* Sticky results make no sense once stacked, so switch it off */
  .calc__results { position: static; }
}
@media (max-width: 700px) {
  .calc__inputs { padding: 24px 20px; }
  .result__value { font-size: 32px; }
  .result--total { padding: 24px 20px; }
  .result--total .result__value { font-size: 42px; }
}
