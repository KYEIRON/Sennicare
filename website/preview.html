<style>
  :root {
    --navy: #0a1172;
    --raspberry: #e30b5c;
    --cyan: #00b2d9;
    --shell: #17142e;         /* dark shell so the pages themselves stand out */
    --shell-2: #221d40;
    --shell-line: #332c5c;
    --shell-ink: #f2effc;
    --shell-muted: #a49dc4;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--shell);
    color: var(--shell-ink);
    font-family: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* ---------- shell header ---------- */
  header {
    background: var(--shell);
    border-bottom: 1px solid var(--shell-line);
    padding: 12px 20px 0;
    flex: none;
  }
  .brandline {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; margin-bottom: 12px;
  }
  .brandline strong { font-size: 16px; font-weight: 800; letter-spacing: -.01em; }
  .brandline .hint { font-size: 13.5px; color: var(--shell-muted); margin-right: auto; }

  .sizes { display: flex; gap: 6px; }
  .size {
    font: 500 13px/1 "Hanken Grotesk", sans-serif;
    background: transparent; color: var(--shell-muted);
    border: 1px solid var(--shell-line); border-radius: 6px;
    padding: 9px 12px; min-height: 34px; cursor: pointer;
  }
  .size:hover { color: var(--shell-ink); border-color: var(--shell-muted); }
  .size.is-active { background: var(--shell-ink); color: var(--shell); border-color: var(--shell-ink); }

  .tabs { display: flex; gap: 2px; overflow-x: auto; }
  .tab {
    font: 600 14px/1 "Hanken Grotesk", sans-serif;
    background: transparent; color: var(--shell-muted);
    border: 0; border-bottom: 2px solid transparent;
    padding: 12px 14px 11px; cursor: pointer; white-space: nowrap;
    display: flex; align-items: center; gap: 7px;
  }
  .tab:hover { color: var(--shell-ink); }
  .tab.is-active { color: #fff; border-bottom-color: var(--raspberry); }
  .tab__set {
    font: 500 10px/1 "IBM Plex Mono", monospace;
    padding: 3px 5px; border-radius: 3px; color: #fff;
  }
  .tab__set--a { background: var(--raspberry); }
  .tab__set--b { background: #4a55ff; }
  .tab__set--c { background: #5c5680; }

  /* ---------- stage ---------- */
  main {
    flex: 1 1 auto; min-height: 0;
    padding: 18px; display: flex; justify-content: center;
    background:
      radial-gradient(1200px 400px at 50% 0%, rgba(227,11,92,.10), transparent 70%),
      var(--shell-2);
  }
  .stage { display: none; width: 100%; max-width: var(--stage-w, 100%); }
  .stage.is-active { display: block; }
  iframe {
    width: 100%; height: 100%; border: 0; border-radius: 8px;
    background: #fff; box-shadow: 0 24px 60px -20px rgba(0,0,0,.6);
    display: block;
  }

  /* ---------- footer strip ---------- */
  footer {
    flex: none; border-top: 1px solid var(--shell-line);
    padding: 10px 20px; font-size: 12.5px; color: var(--shell-muted);
    display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center;
  }
  footer code { font-family: "IBM Plex Mono", monospace; color: var(--shell-ink); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-left: auto; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot--a { background: var(--raspberry); }
  .dot--b { background: #4a55ff; }
  .dot--c { background: #5c5680; }

  button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
</style>
</head>

<main id="stages"><div class="stage is-active" data-slug="home" data-file="home.html" data-set="A"><iframe title="Home page" srcdoc="&lt;!DOCTYPE html&gt;
&lt;!--
  ============================================================================
  SENNICARE — HOMEPAGE (standalone)
  ============================================================================
  One file. Everything is in here: the HTML, the CSS, and the small amount of

  TO PUT IT ONLINE: upload this one file to any hosting, or drag it onto
                    app.netlify.com/drop
  TO MAKE IT THE MAIN PAGE: rename it to index.html

  ── HOW TO EDIT ──────────────────────────────────────────────────────────
  · WORDS      — everything between &gt; and &lt; is text. Change it freely.
  · COLOURS    — the &quot;BRAND COLOURS&quot; block near the top of the CSS.
                 Change a value there and it updates everywhere on the page.
  · PHOTOS     — search this file for &quot;PHOTO&quot; to find all five images. Each
                 one is a drawn placeholder saying what belongs there, and
                 carries a note telling you what to replace it with. They are
                 built into this file, so the page works with no internet.

  ── THE PAGE, IN ORDER ───────────────────────────────────────────────────
  1. Navigation bar          5. Intelligent Recommendations
  2. Hero                    6. Built for the People of Care
  3. Trust bar               7. Final call to action
  4. From Stressed to        8. Footer
     Empowered
  ============================================================================
--&gt;
&lt;html lang=&quot;en-GB&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;utf-8&quot; /&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot; /&gt;

&lt;title&gt;Sennicare — World Class Care Home Procurement&lt;/title&gt;
&lt;meta name=&quot;description&quot; content=&quot;Empower your care facility to reduce costs, ensure compliance, and streamline operations. Intelligent sourcing built exclusively for the UK care sector.&quot; /&gt;
&lt;meta name=&quot;theme-color&quot; content=&quot;#0a1172&quot; /&gt;

&lt;!-- Hanken Grotesk, the Sennicare typeface. The only thing this page loads
     from anywhere else. --&gt;
&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot; /&gt;
&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin /&gt;
&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap&quot; rel=&quot;stylesheet&quot; /&gt;

&lt;style&gt;
/* ==========================================================================
   BRAND COLOURS  —  change a value here and it updates the whole page
   ========================================================================== */
:root {
  --navy:            #0a1172;   /* Deep Navy — hero and footer, headings */
  --navy-grad-end:   #1a228f;   /* the lighter end of the navy gradient */
  --raspberry:       #e30b5c;   /* Primary Raspberry — buttons and badges */
  --raspberry-dark:  #b70048;   /* darker raspberry, for button hover */
  --cyan:            #00b2d9;   /* Cyber Cyan — secondary accents, data */
  --teal:            #00647b;   /* Success teal — ticks and positives */
  --coral:           #ba1a1a;   /* Warning coral — the &quot;old way&quot; crosses */
  --lavender:        #faf8ff;   /* Lavender-White — the page background */
  --white:           #ffffff;   /* card backgrounds */
  --text:            #131b2e;   /* Dark Text — body copy */
  --text-muted:      #5c3f43;   /* Muted Text — secondary copy */
  --surface-low:     #f2f3ff;   /* very soft panels */
  --surface-variant: #dae2fd;   /* borders and dividers */
  --tertiary-fixed:  #b6ebff;   /* pale cyan badge background */
  --tertiary-ink:    #001f28;   /* text on the pale cyan badge */

  /* ---- Spacing (an 8px base unit, as per the brand spec) ---- */
  --sp-xs: 4px;  --sp-sm: 12px;  --sp-md: 24px;  --sp-lg: 48px;  --sp-xl: 80px;
  --margin-desktop: 40px;
  --margin-mobile: 16px;
  --max-width: 1200px;

  /* ---- Shape ---- */
  --radius-button: 4px;    /* precise, tool-like */
  --radius-card: 8px;      /* softer for larger surfaces */
  --radius-pill: 9999px;

  /* ---- Shadows: soft, and tinted with navy rather than grey ---- */
  --shadow-card:  0 1px 4px rgba(10, 17, 114, 0.05);
  --shadow-lift:  0 6px 18px rgba(10, 17, 114, 0.10);
  --shadow-photo: 0 18px 40px rgba(10, 17, 114, 0.16);
  --shadow-nav:   0 1px 3px rgba(10, 17, 114, 0.06);
}


/* ==========================================================================
   PAGE BASICS
   ========================================================================== */
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--lavender);
  color: var(--text);
  font-family: &quot;Hanken Grotesk&quot;, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { margin: 0; color: var(--text); }

/* Type scale, straight from the brand spec */
h1 { font-size: 48px; font-weight: 800; line-height: 1.1;  letter-spacing: -0.02em; }
h2 { font-size: 32px; font-weight: 700; line-height: 1.2;  letter-spacing: -0.01em; }
h3 { font-size: 24px; font-weight: 700; line-height: 1.2; }

p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }

/* A visible outline for anyone navigating by keyboard */
a:focus-visible, button:focus-visible {
  outline: 3px solid var(--cyan);
  outline-offset: 3px;
  border-radius: var(--radius-button);
}

/* Centres the content and keeps the outer margins right */
.wrap {
  width: 100%;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 var(--margin-mobile);
}

/* 80px of air between sections */
.section { padding: var(--sp-xl) 0; }

/* Icons are drawn, so they take their colour from the text around them */
.ico {
  width: 20px; height: 20px; flex-shrink: 0;
  stroke: currentColor; fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.ico--sm { width: 16px; height: 16px; }
.ico--lg { width: 26px; height: 26px; }


/* ==========================================================================
   BUTTONS
   ========================================================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 22px;
  min-height: 44px;                       /* comfortable to tap on a phone */
  border: 1.5px solid transparent;
  border-radius: var(--radius-button);
  font-family: inherit;
  font-size: 15px; font-weight: 600; letter-spacing: 0.02em;
  cursor: pointer;
  transition: background-color .18s ease, box-shadow .18s ease,
              transform .18s ease, border-color .18s ease, color .18s ease;
}

/* Solid raspberry — the main action */
.btn--primary { background: var(--raspberry); color: var(--white); }
.btn--primary:hover {
  background: var(--raspberry-dark);
  transform: translateY(-2px);
  box-shadow: var(--shadow-lift);
}
.btn--primary:active { transform: scale(.97); }

/* Outline — the quieter action beside it */
.btn--outline {
  background: var(--white);
  color: var(--text);
  border-color: var(--surface-variant);
}
.btn--outline:hover {
  border-color: var(--navy);
  transform: translateY(-2px);
  box-shadow: var(--shadow-lift);
}

.btn--sm { padding: 10px 18px; font-size: 14px; }
.btn--lg { padding: 16px 32px; font-size: 16px; }


/* ==========================================================================
   1. NAVIGATION BAR — sticky, white
   ========================================================================== */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: var(--white);
  border-bottom: 1px solid var(--surface-variant);
  box-shadow: var(--shadow-nav);
}
.nav__inner {
  max-width: var(--max-width); margin: 0 auto;
  padding: 0 var(--margin-mobile);
  height: 68px;
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-md);
}
.logo {
  font-size: 21px; font-weight: 800; letter-spacing: -0.03em;
  color: var(--raspberry);
  display: flex; align-items: center; gap: 8px;
}
.nav__links { display: flex; align-items: center; gap: var(--sp-md); }
.nav__links a {
  font-size: 15px; font-weight: 500; color: var(--text);
  padding: 6px 0; border-bottom: 2px solid transparent;
  transition: color .15s ease, border-color .15s ease;
}
.nav__links a:hover { color: var(--raspberry); border-bottom-color: var(--raspberry); }

.nav__right { display: flex; align-items: center; gap: var(--sp-sm); }
.nav__login { font-size: 15px; font-weight: 600; color: var(--raspberry); }

/* The hamburger button, shown only on small screens */
.nav__burger {
  display: none;
  width: 44px; height: 44px;
  align-items: center; justify-content: center;
  background: none; border: none; cursor: pointer; color: var(--navy);
  border-radius: var(--radius-button);
}


/* ==========================================================================
   2. HERO
   ========================================================================== */
.hero { background: var(--lavender); padding: var(--sp-lg) 0 var(--sp-xl); }
.hero__grid {
  display: grid; grid-template-columns: 1fr; gap: var(--sp-lg);
  align-items: center;
}
.hero__copy { display: flex; flex-direction: column; gap: var(--sp-md); max-width: 620px; }

/* The small pale-cyan badge above the headline */
.badge {
  display: inline-flex; align-items: center; gap: 7px;
  width: max-content;
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  background: var(--tertiary-fixed);
  color: var(--tertiary-ink);
  font-size: 12px; font-weight: 600; letter-spacing: 0.05em;
}
.badge .ico { color: var(--teal); }

/* &quot;Financial Intelligence.&quot; in raspberry */
.hero h1 .highlight { color: var(--raspberry); }

.hero__sub { font-size: 18px; color: var(--text-muted); max-width: 34em; }
.hero__buttons { display: flex; flex-wrap: wrap; gap: var(--sp-sm); }

/* The hero photograph */
.hero__photo {
  position: relative;
  border-radius: 16px; overflow: hidden;
  box-shadow: var(--shadow-photo);
  aspect-ratio: 4 / 3;
}
.hero__photo img { width: 100%; height: 100%; object-fit: cover; }


/* ==========================================================================
   3. TRUST BAR
   ========================================================================== */
.trust {
  border-top: 1px solid var(--surface-variant);
  border-bottom: 1px solid var(--surface-variant);
  background: var(--lavender);
  padding: var(--sp-md) 0;
}
.trust__inner {
  display: flex; flex-wrap: wrap; align-items: center;
  justify-content: space-between; gap: var(--sp-md);
}
.trust__item {
  display: flex; align-items: center; gap: 10px;
  font-size: 14px; font-weight: 600; letter-spacing: 0.03em;
  color: var(--text-muted);
}
.trust__item .ico { color: var(--text-muted); }


/* ==========================================================================
   4. FROM STRESSED TO EMPOWERED
   ========================================================================== */
.section--white { background: var(--white); }

.section-head { text-align: center; max-width: 640px; margin: 0 auto var(--sp-lg); }
.section-head p { color: var(--text-muted); margin-top: var(--sp-sm); }

.two-col { display: grid; grid-template-columns: 1fr; gap: var(--sp-lg); }

.card {
  background: var(--white);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  padding: var(--sp-md);
  display: flex; flex-direction: column; gap: var(--sp-sm);
  transition: transform .2s ease, box-shadow .2s ease;
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }

/* The two story cards get a faint tint: warm for the old way, cool for ours */
.card--old { background: #fff7f7; }
.card--new { background: #f4f6ff; }

.card__head { display: flex; align-items: center; gap: 10px; }
.card__head .ico { width: 26px; height: 26px; }
.card--old .card__head .ico { color: var(--coral); }
.card--new .card__head .ico { color: var(--raspberry); }

.card__photo {
  border-radius: var(--radius-card); overflow: hidden;
  height: 220px; margin: var(--sp-xs) 0 var(--sp-sm);
}
.card__photo img { width: 100%; height: 100%; object-fit: cover; }

.point-list { display: flex; flex-direction: column; gap: 10px; }
.point {
  display: flex; align-items: flex-start; gap: 9px;
  font-size: 15px; color: var(--text-muted);
}
.point .ico { margin-top: 4px; width: 15px; height: 15px; }
.point--bad .ico  { color: var(--coral); }
.point--good .ico { color: var(--teal); }
.point strong { color: var(--text); font-weight: 700; }


/* ==========================================================================
   5. INTELLIGENT RECOMMENDATIONS
   ========================================================================== */
.engine__grid {
  display: grid; grid-template-columns: 1fr; gap: var(--sp-lg);
  align-items: center;
}
/* The device mock sits on a soft raspberry mat, as in the design */
.engine__mock {
  background: linear-gradient(140deg, rgba(227, 11, 92, .10), rgba(0, 178, 217, .10));
  border-radius: 16px;
  padding: var(--sp-md);
}
.engine__mock img {
  width: 100%; border-radius: var(--radius-card);
  box-shadow: var(--shadow-photo);
}
.engine__copy { display: flex; flex-direction: column; gap: var(--sp-md); }
.engine__copy p { color: var(--text-muted); }

/* The pale raspberry badge on this section */
.badge--engine { background: #ffe4ec; color: var(--raspberry-dark); }
.badge--engine .ico { color: var(--raspberry); }

/* The three little feature cards */
.trio { display: grid; grid-template-columns: 1fr; gap: var(--sp-sm); }
.trio-card {
  background: var(--white);
  border: 1px solid var(--surface-variant);
  border-radius: var(--radius-card);
  padding: 16px;
  display: flex; flex-direction: column; gap: 6px;
  transition: transform .2s ease, box-shadow .2s ease;
}
.trio-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.trio-card .ico { color: var(--cyan); }
.trio-card strong { font-size: 14px; font-weight: 700; letter-spacing: .02em; }
.trio-card span { font-size: 13px; color: var(--text-muted); line-height: 1.5; }


/* ==========================================================================
   6. BUILT FOR THE PEOPLE OF CARE
   ========================================================================== */
.people__grid {
  display: grid; grid-template-columns: 1fr; gap: var(--sp-lg);
  align-items: center;
}
.people__copy { display: flex; flex-direction: column; gap: var(--sp-md); }
.people__copy &gt; p { color: var(--text-muted); }

.role { display: flex; gap: var(--sp-sm); align-items: flex-start; }
.role__icon {
  width: 40px; height: 40px; border-radius: var(--radius-card);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.role__icon--manager { background: #ffe4ec; color: var(--raspberry); }
.role__icon--finance { background: #dff4fb; color: var(--teal); }
.role strong { display: block; font-size: 15px; font-weight: 700; margin-bottom: 3px; }
.role span { font-size: 14.5px; color: var(--text-muted); }

.people__photo {
  border-radius: 16px; overflow: hidden;
  box-shadow: var(--shadow-photo);
  aspect-ratio: 4 / 3;
}
.people__photo img { width: 100%; height: 100%; object-fit: cover; }


/* ==========================================================================
   7. FINAL CALL TO ACTION — deep navy
   ========================================================================== */
.final {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-grad-end) 100%);
  padding: var(--sp-xl) 0;
  text-align: center;
}
.final h2 { color: var(--white); font-size: 36px; }
.final p {
  color: rgba(255, 255, 255, .82);
  max-width: 30em; margin: var(--sp-sm) auto var(--sp-md);
}


/* ==========================================================================
   8. FOOTER
   ========================================================================== */
.footer {
  background: var(--navy);
  color: rgba(255, 255, 255, .74);
  padding: var(--sp-lg) 0 var(--sp-md);
  font-size: 14.5px;
}
.footer__grid {
  display: grid; grid-template-columns: 1fr; gap: var(--sp-md);
}
.footer .logo { color: var(--white); margin-bottom: 10px; }
.footer__tagline { max-width: 24em; }
.footer__copyright { margin-top: var(--sp-md); font-size: 13px; color: rgba(255,255,255,.55); }
.footer h4 {
  margin: 0 0 14px;
  font-size: 13px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase;
  color: var(--raspberry);
}
.footer ul { display: flex; flex-direction: column; gap: 10px; }
.footer a { color: rgba(255, 255, 255, .74); }
.footer a:hover { color: var(--white); text-decoration: underline; }


/* ==========================================================================
   WIDER SCREENS
   Everything above is written for a phone first. These rules add the
   side-by-side layouts once there is room for them.
   ========================================================================== */
@media (min-width: 700px) {
  .wrap, .nav__inner { padding: 0 var(--margin-desktop); }
  .two-col { grid-template-columns: 1fr 1fr; }
  .trio { grid-template-columns: repeat(3, 1fr); }
}

@media (min-width: 940px) {
  h1 { font-size: 48px; }
  .hero__grid   { grid-template-columns: 1fr 1fr; gap: var(--sp-lg); }
  .engine__grid { grid-template-columns: 1fr 1fr; }
  .people__grid { grid-template-columns: 1fr 1fr; }
  .footer__grid { grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: var(--sp-lg); }
  .nav__burger  { display: none; }
}

/* ---- Phones and small tablets: swap the menu for a drop-down ---- */
@media (max-width: 939px) {
  h1 { font-size: 28px; }
  h2 { font-size: 24px; }
  h3 { font-size: 20px; }
  .final h2 { font-size: 26px; }

  .nav__burger { display: flex; }
  .nav__login { display: none; }

  .nav__links {
    display: none;
    position: absolute; top: 68px; left: 0; right: 0;
    flex-direction: column; align-items: stretch; gap: 0;
    background: var(--white);
    border-bottom: 1px solid var(--surface-variant);
    box-shadow: var(--shadow-lift);
    padding: 8px var(--margin-mobile) 16px;
  }
  .nav__links.is-open { display: flex; }
  .nav__links a {
    padding: 14px 0; border-bottom: 1px solid var(--surface-low);
  }
  .nav__links a:last-child { border-bottom: none; }

  .trust__inner { gap: var(--sp-sm); }
  .trust__item { width: 100%; }
  .hero__buttons .btn { flex: 1 1 auto; }
}

/* ---- Anyone who prefers less movement ---- */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .btn:hover, .card:hover, .trio-card:hover { transform: none; }
}

* { box-sizing: border-box; }

  border-radius: var(--radius-button);
}


/* ==========================================================================
   2. HERO
   ========================================================================== */
.hero { background: var(--lavender); padding: var(--sp-lg) 0 var(--sp-xl); }
.hero__grid {
  display: grid; grid-template-columns: 1fr; gap: var(--sp-lg);
  align-items: center;
}
.hero__copy { display: flex; flex-direction: column; gap: var(--sp-md); max-width: 620px; }

/* The small pale-cyan badge above the headline */
.badge {
  display: inline-flex; align-items: center; gap: 7px;
  width: max-content;
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  background: var(--tertiary-fixed);
  color: var(--tertiary-ink);
  font-size: 12px; font-weight: 600; letter-spacing: 0.05em;
}
.badge .ico { color: var(--teal); }

/* &quot;Financial Intelligence.&quot; in raspberry */
.hero h1 .highlight { color: var(--raspberry); }

.hero__sub { font-size: 18px; color: var(--text-muted); max-width: 34em; }
.hero__buttons { display: flex; flex-wrap: wrap; gap: var(--sp-sm); }

/* The hero photograph */
.hero__photo {
  position: relative;
  border-radius: 16px; overflow: hidden;
  box-shadow: var(--shadow-photo);
  aspect-ratio: 4 / 3;
}
.hero__photo img { width: 100%; height: 100%; object-fit: cover; }


/* ==========================================================================
   3. TRUST BAR
   ========================================================================== */
.trust {
  border-top: 1px solid var(--surface-variant);
  border-bottom: 1px solid var(--surface-variant);
  background: var(--lavender);
  padding: var(--sp-md) 0;
}
.trust__inner {
  display: flex; flex-wrap: wrap; align-items: center;
  justify-content: space-between; gap: var(--sp-md);
}
.trust__item {
  display: flex; align-items: center; gap: 10px;
  font-size: 14px; font-weight: 600; letter-spacing: 0.03em;
  color: var(--text-muted);
}
.trust__item .ico { color: var(--text-muted); }


/* ==========================================================================
   4. FROM STRESSED TO EMPOWERED
   ========================================================================== */
.section--white { background: var(--white); }

.section-head { text-align: center; max-width: 640px; margin: 0 auto var(--sp-lg); }
.section-head p { color: var(--text-muted); margin-top: var(--sp-sm); }

.two-col { display: grid; grid-template-columns: 1fr; gap: var(--sp-lg); }

.card {
  background: var(--white);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  padding: var(--sp-md);
  display: flex; flex-direction: column; gap: var(--sp-sm);
  transition: transform .2s ease, box-shadow .2s ease;
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }

/* The two story cards get a faint tint: warm for the old way, cool for ours */
.card--old { background: #fff7f7; }
.card--new { background: #f4f6ff; }

.card__head { display: flex; align-items: center; gap: 10px; }
.card__head .ico { width: 26px; height: 26px; }
.card--old .card__head .ico { color: var(--coral); }
.card--new .card__head .ico { color: var(--raspberry); }

.card__photo {
  border-radius: var(--radius-card); overflow: hidden;
  height: 220px; margin: var(--sp-xs) 0 var(--sp-sm);
}
.card__photo img { width: 100%; height: 100%; object-fit: cover; }

.point-list { display: flex; flex-direction: column; gap: 10px; }
.point {
  display: flex; align-items: flex-start; gap: 9px;
  font-size: 15px; color: var(--text-muted);
}
.point .ico { margin-top: 4px; width: 15px; height: 15px; }
.point--bad .ico  { color: var(--coral); }
.point--good .ico { color: var(--teal); }
.point strong { color: var(--text); font-weight: 700; }


/* ==========================================================================
   5. INTELLIGENT RECOMMENDATIONS
   ========================================================================== */
.engine__grid {
  display: grid; grid-template-columns: 1fr; gap: var(--sp-lg);
  align-items: center;
}
/* The device mock sits on a soft raspberry mat, as in the design */
.engine__mock {
  background: linear-gradient(140deg, rgba(227, 11, 92, .10), rgba(0, 178, 217, .10));
  border-radius: 16px;
  padding: var(--sp-md);
}
.engine__mock img {
  width: 100%; border-radius: var(--radius-card);
  box-shadow: var(--shadow-photo);
}
.engine__copy { display: flex; flex-direction: column; gap: var(--sp-md); }
.engine__copy p { color: var(--text-muted); }

/* The pale raspberry badge on this section */
.badge--engine { background: #ffe4ec; color: var(--raspberry-dark); }
.badge--engine .ico { color: var(--raspberry); }

/* The three little feature cards */
.trio { display: grid; grid-template-columns: 1fr; gap: var(--sp-sm); }
.trio-card {
  background: var(--white);
  border: 1px solid var(--surface-variant);
  border-radius: var(--radius-card);
  padding: 16px;
  display: flex; flex-direction: column; gap: 6px;
  transition: transform .2s ease, box-shadow .2s ease;
}
.trio-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.trio-card .ico { color: var(--cyan); }
.trio-card strong { font-size: 14px; font-weight: 700; letter-spacing: .02em; }
.trio-card span { font-size: 13px; color: var(--text-muted); line-height: 1.5; }


/* ==========================================================================
   6. BUILT FOR THE PEOPLE OF CARE
   ========================================================================== */
.people__grid {
  display: grid; grid-template-columns: 1fr; gap: var(--sp-lg);
  align-items: center;
}
.people__copy { display: flex; flex-direction: column; gap: var(--sp-md); }
.people__copy &gt; p { color: var(--text-muted); }

.role { display: flex; gap: var(--sp-sm); align-items: flex-start; }
.role__icon {
  width: 40px; height: 40px; border-radius: var(--radius-card);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.role__icon--manager { background: #ffe4ec; color: var(--raspberry); }
.role__icon--finance { background: #dff4fb; color: var(--teal); }
.role strong { display: block; font-size: 15px; font-weight: 700; margin-bottom: 3px; }
.role span { font-size: 14.5px; color: var(--text-muted); }

.people__photo {
  border-radius: 16px; overflow: hidden;
  box-shadow: var(--shadow-photo);
  aspect-ratio: 4 / 3;
}
.people__photo img { width: 100%; height: 100%; object-fit: cover; }


/* ==========================================================================
   7. FINAL CALL TO ACTION — deep navy
   ========================================================================== */
.final {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-grad-end) 100%);
  padding: var(--sp-xl) 0;
  text-align: center;
}
.final h2 { color: var(--white); font-size: 36px; }
.final p {
  color: rgba(255, 255, 255, .82);
  max-width: 30em; margin: var(--sp-sm) auto var(--sp-md);
}


/* ==========================================================================
   8. FOOTER
   ========================================================================== */
.footer {
  background: var(--navy);
  color: rgba(255, 255, 255, .74);
  padding: var(--sp-lg) 0 var(--sp-md);
  font-size: 14.5px;
}
.footer__grid {
  display: grid; grid-template-columns: 1fr; gap: var(--sp-md);
}
.footer .logo { color: var(--white); margin-bottom: 10px; }
.footer__tagline { max-width: 24em; }
.footer__copyright { margin-top: var(--sp-md); font-size: 13px; color: rgba(255,255,255,.55); }
.footer h4 {
  margin: 0 0 14px;
  font-size: 13px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase;
  color: var(--raspberry);
}
.footer ul { display: flex; flex-direction: column; gap: 10px; }
.footer a { color: rgba(255, 255, 255, .74); }
.footer a:hover { color: var(--white); text-decoration: underline; }


/* ==========================================================================
   WIDER SCREENS
   Everything above is written for a phone first. These rules add the
   side-by-side layouts once there is room for them.
   ========================================================================== */
@media (min-width: 700px) {
  .wrap, .nav__inner { padding: 0 var(--margin-desktop); }
  .two-col { grid-template-columns: 1fr 1fr; }
  .trio { grid-template-columns: repeat(3, 1fr); }
}

@media (min-width: 940px) {
  h1 { font-size: 48px; }
  .hero__grid   { grid-template-columns: 1fr 1fr; gap: var(--sp-lg); }
  .engine__grid { grid-template-columns: 1fr 1fr; }
  .people__grid { grid-template-columns: 1fr 1fr; }
  .footer__grid { grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: var(--sp-lg); }
  .nav__burger  { display: none; }
}

/* ---- Phones and small tablets: swap the menu for a drop-down ---- */
@media (max-width: 939px) {
  h1 { font-size: 28px; }
  h2 { font-size: 24px; }
  h3 { font-size: 20px; }
  .final h2 { font-size: 26px; }

  .nav__burger { display: flex; }
  .nav__login { display: none; }

  .nav__links {
    display: none;
    position: absolute; top: 68px; left: 0; right: 0;
    flex-direction: column; align-items: stretch; gap: 0;
    background: var(--white);
    border-bottom: 1px solid var(--surface-variant);
    box-shadow: var(--shadow-lift);
    padding: 8px var(--margin-mobile) 16px;
  }
  .nav__links.is-open { display: flex; }
  .nav__links a {
    padding: 14px 0; border-bottom: 1px solid var(--surface-low);
  }
  .nav__links a:last-child { border-bottom: none; }

  .trust__inner { gap: var(--sp-sm); }
  .trust__item { width: 100%; }
  .hero__buttons .btn { flex: 1 1 auto; }
}

/* ---- Anyone who prefers less movement ---- */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .btn:hover, .card:hover, .trio-card:hover { transform: none; }
}
/* ==========================================================================
   PRODUCT PAGE ONLY — everything above this line is shared with the homepage
   ========================================================================== */

/* The current page is marked in the navigation */
.nav__links a.is-current { color: var(--raspberry); border-bottom-color: var(--raspberry); }

/* ---- Small uppercase label above a heading ---- */
.kicker {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--raspberry);
}
.kicker .ico { color: var(--raspberry); }
.kicker--cyan { color: var(--teal); }
.kicker--cyan .ico { color: var(--teal); }

/* ---- Hero: the CQC line sits beside the button ---- */
.hero__inline { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-md); }
.hero__note {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 14px; font-weight: 600; color: var(--text-muted);
}
.hero__note .ico { color: var(--teal); }

/* ---- Frequency rows (Daily / Weekly / Monthly / Capital) ---- */
.freq { display: flex; flex-direction: column; gap: 10px; margin-top: var(--sp-sm); }
.freq__row {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-sm);
  background: var(--white);
  border: 1px solid var(--surface-variant);
  border-radius: var(--radius-card);
  padding: 12px 16px;
  font-size: 14.5px;
}
.freq__row span:first-child { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.freq__dot { width: 9px; height: 9px; border-radius: var(--radius-pill); flex-shrink: 0; }
.freq__value { color: var(--text-muted); font-size: 13.5px; }

/* ---- The optimisation matrix panel ---- */
.matrix {
  background: var(--white);
  border: 1px solid var(--surface-variant);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  padding: var(--sp-md);
}
.matrix__bars {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: var(--sp-sm); align-items: end;
  height: 190px; margin: var(--sp-md) 0 var(--sp-sm);
}
.matrix__bar { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; gap: 6px; }
.matrix__fill { border-radius: 4px 4px 0 0; width: 100%; }
.matrix__labels {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-sm);
  font-size: 12.5px; color: var(--text-muted); text-align: center;
}

/* ---- The testimonial banner ---- */
.testimonial {
  position: relative; border-radius: var(--radius-card); overflow: hidden;
  box-shadow: var(--shadow-photo);
  min-height: 340px; display: flex; align-items: flex-end;
}
.testimonial img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.testimonial__veil {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(10,17,114,.15) 0%, rgba(10,17,114,.88) 100%);
}
.testimonial__quote {
  position: relative; padding: var(--sp-md);
  color: var(--white); font-size: 18px; font-weight: 600; line-height: 1.5;
  max-width: 46em;
}

/* ---- Consolidation: the savings figure panel ---- */
.savings {
  position: relative;
  background: var(--white);
  border: 1px solid var(--surface-variant);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  padding: var(--sp-md);
  min-height: 320px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.savings__plot { position: relative; flex: 1; min-height: 190px; }
.savings__node {
  position: absolute; border-radius: var(--radius-pill);
  transform: translate(-50%, -50%);
}
.savings__hub {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 74px; height: 74px; border-radius: 10px;
  background: var(--raspberry);
  display: flex; align-items: center; justify-content: center;
  color: var(--white);
  box-shadow: 0 10px 24px rgba(227, 11, 92, .35);
}
.savings__total {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-sm);
  border-top: 1px solid var(--surface-variant); padding-top: var(--sp-sm);
}
.savings__total span { font-size: 13.5px; color: var(--text-muted); }
.savings__total strong { font-size: 26px; font-weight: 800; color: var(--cyan); }

/* ---- Two bullet cards under the consolidation copy ---- */
.mini-card {
  display: flex; gap: var(--sp-sm); align-items: flex-start;
  background: var(--white);
  border: 1px solid var(--surface-variant);
  border-radius: var(--radius-card);
  padding: 14px 16px;
  transition: transform .2s ease, box-shadow .2s ease;
}
.mini-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.mini-card .ico { color: var(--cyan); margin-top: 2px; }
.mini-card strong { display: block; font-size: 14.5px; margin-bottom: 2px; }
.mini-card span { font-size: 13.5px; color: var(--text-muted); }

/* ---- The pull-quote in the &quot;impacts care&quot; section ---- */
.pullquote {
  border-left: 3px solid var(--raspberry);
  padding-left: var(--sp-sm);
  font-style: italic; color: var(--text-muted); font-size: 15px;
}

/* ---- Four vetting cards ---- */
.vetting { display: grid; grid-template-columns: 1fr; gap: var(--sp-md); }
.vetting-card {
  background: var(--white);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  border-top: 3px solid var(--raspberry);
  padding: var(--sp-md);
  text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  transition: transform .2s ease, box-shadow .2s ease;
}
.vetting-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.vetting-card__icon {
  width: 44px; height: 44px; border-radius: var(--radius-card);
  display: flex; align-items: center; justify-content: center;
  background: #f2f3ff; color: var(--navy);
}
.vetting-card strong { font-size: 16px; }
.vetting-card span { font-size: 13.5px; color: var(--text-muted); line-height: 1.55; }

/* ---- This page&#x27;s final call to action sits in a rounded navy panel ---- */
.final--panel {
  background: none; padding: var(--sp-xl) 0;
}
.final__panel {
  background: linear-gradient(135deg, var(--navy) 0%, #3a41c9 100%);
  border-radius: var(--radius-card);
  padding: var(--sp-lg) var(--sp-md);
  text-align: center;
}
.final__panel h2 { color: var(--white); font-size: 30px; }
.final__panel p { color: rgba(255,255,255,.85); max-width: 34em; margin: var(--sp-sm) auto var(--sp-md); }

@media (min-width: 700px) {
  .vetting { grid-template-columns: repeat(2, 1fr); }
  .testimonial__quote { padding: var(--sp-lg); font-size: 20px; }
  .final__panel { padding: var(--sp-xl) var(--sp-lg); }
}
@media (min-width: 940px) {
  .vetting { grid-template-columns: repeat(4, 1fr); }
}

  position: absolute; top: -2px; right: -2px;

.plan__name { font-size: 24px; font-weight: 700; }
.plan__sub { color: var(--text-muted); font-size: 15px; }
.plan__price {

.plan__amount { font-size: 48px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
.plan__period { font-size: 15px; color: var(--text-muted); }

@media (min-width: 820px) {

  .plan { padding: var(--sp-lg) var(--sp-md); }

      burger.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);

})();

  box-shadow: var(--shadow-nav);
}
.nav__inner {
  max-width: var(--max-width); margin: 0 auto;
  padding: 0 var(--margin-mobile);
  height: 68px;
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-md);
}
.logo {
  font-size: 21px; font-weight: 800; letter-spacing: -0.03em;
  color: var(--raspberry);
  display: flex; align-items: center; gap: 8px;
}
.nav__links { display: flex; align-items: center; gap: var(--sp-md); }
.nav__links a {
  font-size: 15px; font-weight: 500; color: var(--text);
  padding: 6px 0; border-bottom: 2px solid transparent;
  transition: color .15s ease, border-color .15s ease;
}
.nav__links a:hover { color: var(--raspberry); border-bottom-color: var(--raspberry); }

.nav__right { display: flex; align-items: center; gap: var(--sp-sm); }
.nav__login { font-size: 15px; font-weight: 600; color: var(--raspberry); }

/* The hamburger button, shown only on small screens */
.nav__burger {
  display: none;
  width: 44px; height: 44px;
  align-items: center; justify-content: center;
  background: none; border: none; cursor: pointer; color: var(--navy);
  border-radius: var(--radius-button);
}


/* ==========================================================================
   2. HERO
   ========================================================================== */
.hero { background: var(--lavender); padding: var(--sp-lg) 0 var(--sp-xl); }
.hero__grid {
  display: grid; grid-template-columns: 1fr; gap: var(--sp-lg);
  align-items: center;
}
.hero__copy { display: flex; flex-direction: column; gap: var(--sp-md); max-width: 620px; }

/* The small pale-cyan badge above the headline */
.badge {
  display: inline-flex; align-items: center; gap: 7px;
  width: max-content;
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  background: var(--tertiary-fixed);
  color: var(--tertiary-ink);
  font-size: 12px; font-weight: 600; letter-spacing: 0.05em;
}
.badge .ico { color: var(--teal); }

/* &quot;Financial Intelligence.&quot; in raspberry */
.hero h1 .highlight { color: var(--raspberry); }

.hero__sub { font-size: 18px; color: var(--text-muted); max-width: 34em; }
.hero__buttons { display: flex; flex-wrap: wrap; gap: var(--sp-sm); }

/* The hero photograph */
.hero__photo {
  position: relative;
  border-radius: 16px; overflow: hidden;
  box-shadow: var(--shadow-photo);
  aspect-ratio: 4 / 3;
}
.hero__photo img { width: 100%; height: 100%; object-fit: cover; }


/* ==========================================================================
   3. TRUST BAR
   ========================================================================== */
.trust {
  border-top: 1px solid var(--surface-variant);
  border-bottom: 1px solid var(--surface-variant);
  background: var(--lavender);
  padding: var(--sp-md) 0;
}
.trust__inner {
  display: flex; flex-wrap: wrap; align-items: center;
  justify-content: space-between; gap: var(--sp-md);
}
.trust__item {
  display: flex; align-items: center; gap: 10px;
  font-size: 14px; font-weight: 600; letter-spacing: 0.03em;
  color: var(--text-muted);
}
.trust__item .ico { color: var(--text-muted); }


/* ==========================================================================
   4. FROM STRESSED TO EMPOWERED
   ========================================================================== */
.section--white { background: var(--white); }

.section-head { text-align: center; max-width: 640px; margin: 0 auto var(--sp-lg); }
.section-head p { color: var(--text-muted); margin-top: var(--sp-sm); }

.two-col { display: grid; grid-template-columns: 1fr; gap: var(--sp-lg); }

.card {
  background: var(--white);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  padding: var(--sp-md);
  display: flex; flex-direction: column; gap: var(--sp-sm);
  transition: transform .2s ease, box-shadow .2s ease;
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }

/* The two story cards get a faint tint: warm for the old way, cool for ours */
.card--old { background: #fff7f7; }
.card--new { background: #f4f6ff; }

.card__head { display: flex; align-items: center; gap: 10px; }
.card__head .ico { width: 26px; height: 26px; }
.card--old .card__head .ico { color: var(--coral); }
.card--new .card__head .ico { color: var(--raspberry); }

.card__photo {
  border-radius: var(--radius-card); overflow: hidden;
  height: 220px; margin: var(--sp-xs) 0 var(--sp-sm);
}
.card__photo img { width: 100%; height: 100%; object-fit: cover; }

.point-list { display: flex; flex-direction: column; gap: 10px; }
.point {
  display: flex; align-items: flex-start; gap: 9px;
  font-size: 15px; color: var(--text-muted);
}
.point .ico { margin-top: 4px; width: 15px; height: 15px; }
.point--bad .ico  { color: var(--coral); }
.point--good .ico { color: var(--teal); }
.point strong { color: var(--text); font-weight: 700; }


/* ==========================================================================
   5. INTELLIGENT RECOMMENDATIONS
   ========================================================================== */
.engine__grid {
  display: grid; grid-template-columns: 1fr; gap: var(--sp-lg);
  align-items: center;
}
/* The device mock sits on a soft raspberry mat, as in the design */
.engine__mock {
  background: linear-gradient(140deg, rgba(227, 11, 92, .10), rgba(0, 178, 217, .10));
  border-radius: 16px;
  padding: var(--sp-md);
}
.engine__mock img {
  width: 100%; border-radius: var(--radius-card);
  box-shadow: var(--shadow-photo);
}
.engine__copy { display: flex; flex-direction: column; gap: var(--sp-md); }
.engine__copy p { color: var(--text-muted); }

/* The pale raspberry badge on this section */
.badge--engine { background: #ffe4ec; color: var(--raspberry-dark); }
.badge--engine .ico { color: var(--raspberry); }

/* The three little feature cards */
.trio { display: grid; grid-template-columns: 1fr; gap: var(--sp-sm); }
.trio-card {
  background: var(--white);
  border: 1px solid var(--surface-variant);
  border-radius: var(--radius-card);
  padding: 16px;
  display: flex; flex-direction: column; gap: 6px;
  transition: transform .2s ease, box-shadow .2s ease;
}
.trio-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.trio-card .ico { color: var(--cyan); }
.trio-card strong { font-size: 14px; font-weight: 700; letter-spacing: .02em; }
.trio-card span { font-size: 13px; color: var(--text-muted); line-height: 1.5; }


/* ==========================================================================
   6. BUILT FOR THE PEOPLE OF CARE
   ========================================================================== */
.people__grid {
  display: grid; grid-template-columns: 1fr; gap: var(--sp-lg);
  align-items: center;
}
.people__copy { display: flex; flex-direction: column; gap: var(--sp-md); }
.people__copy &gt; p { color: var(--text-muted); }

.role { display: flex; gap: var(--sp-sm); align-items: flex-start; }
.role__icon {
  width: 40px; height: 40px; border-radius: var(--radius-card);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.role__icon--manager { background: #ffe4ec; color: var(--raspberry); }
.role__icon--finance { background: #dff4fb; color: var(--teal); }
.role strong { display: block; font-size: 15px; font-weight: 700; margin-bottom: 3px; }
.role span { font-size: 14.5px; color: var(--text-muted); }

.people__photo {
  border-radius: 16px; overflow: hidden;
  box-shadow: var(--shadow-photo);
  aspect-ratio: 4 / 3;
}
.people__photo img { width: 100%; height: 100%; object-fit: cover; }


/* ==========================================================================
   7. FINAL CALL TO ACTION — deep navy
   ========================================================================== */
.final {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-grad-end) 100%);
  padding: var(--sp-xl) 0;
  text-align: center;
}
.final h2 { color: var(--white); font-size: 36px; }
.final p {
  color: rgba(255, 255, 255, .82);
  max-width: 30em; margin: var(--sp-sm) auto var(--sp-md);
}


/* ==========================================================================
   8. FOOTER
   ========================================================================== */
.footer {
  background: var(--navy);
  color: rgba(255, 255, 255, .74);
  padding: var(--sp-lg) 0 var(--sp-md);
  font-size: 14.5px;
}
.footer__grid {
  display: grid; grid-template-columns: 1fr; gap: var(--sp-md);
}
.footer .logo { color: var(--white); margin-bottom: 10px; }
.footer__tagline { max-width: 24em; }
.footer__copyright { margin-top: var(--sp-md); font-size: 13px; color: rgba(255,255,255,.55); }
.footer h4 {
  margin: 0 0 14px;
  font-size: 13px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase;
  color: var(--raspberry);
}
.footer ul { display: flex; flex-direction: column; gap: 10px; }
.footer a { color: rgba(255, 255, 255, .74); }
.footer a:hover { color: var(--white); text-decoration: underline; }


/* ==========================================================================
   WIDER SCREENS
   Everything above is written for a phone first. These rules add the
   side-by-side layouts once there is room for them.
   ========================================================================== */
@media (min-width: 700px) {
  .wrap, .nav__inner { padding: 0 var(--margin-desktop); }
  .two-col { grid-template-columns: 1fr 1fr; }
  .trio { grid-template-columns: repeat(3, 1fr); }
}

@media (min-width: 940px) {
  h1 { font-size: 48px; }
  .hero__grid   { grid-template-columns: 1fr 1fr; gap: var(--sp-lg); }
  .engine__grid { grid-template-columns: 1fr 1fr; }
  .people__grid { grid-template-columns: 1fr 1fr; }
  .footer__grid { grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: var(--sp-lg); }
  .nav__burger  { display: none; }
}

/* ---- Phones and small tablets: swap the menu for a drop-down ---- */
@media (max-width: 939px) {
  h1 { font-size: 28px; }
  h2 { font-size: 24px; }
  h3 { font-size: 20px; }
  .final h2 { font-size: 26px; }

  .nav__burger { display: flex; }
  .nav__login { display: none; }

  .nav__links {
    display: none;
    position: absolute; top: 68px; left: 0; right: 0;
    flex-direction: column; align-items: stretch; gap: 0;
    background: var(--white);
    border-bottom: 1px solid var(--surface-variant);
    box-shadow: var(--shadow-lift);
    padding: 8px var(--margin-mobile) 16px;
  }
  .nav__links.is-open { display: flex; }
  .nav__links a {
    padding: 14px 0; border-bottom: 1px solid var(--surface-low);
  }
  .nav__links a:last-child { border-bottom: none; }

  .trust__inner { gap: var(--sp-sm); }
  .trust__item { width: 100%; }
  .hero__buttons .btn { flex: 1 1 auto; }
}

/* ---- Anyone who prefers less movement ---- */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .btn:hover, .card:hover, .trio-card:hover { transform: none; }
}

/* ==========================================================================
   FOR SUPPLIERS PAGE ONLY — everything above is shared with the other pages
   ========================================================================== */

.nav__links a.is-current { color: var(--raspberry); border-bottom-color: var(--raspberry); }

/* ---- Hero: a faint graph-paper grid, as in the design ---- */
.sup-hero { position: relative; background: var(--lavender); padding: var(--sp-lg) 0 var(--sp-xl); overflow: hidden; }
.sup-hero::before {
  content: &quot;&quot;; position: absolute; inset: 0; pointer-events: none; opacity: .55;
  background-image:
    linear-gradient(to right, #e2e7ff 1px, transparent 1px),
    linear-gradient(to bottom, #e2e7ff 1px, transparent 1px);
  background-size: 80px 80px;
}
/* Two very soft colour washes for depth */
.sup-hero::after {
  content: &quot;&quot;; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(46% 52% at 88% 4%, rgba(150,158,253,.20), transparent 62%),
    radial-gradient(42% 48% at 2% 96%, rgba(255,217,221,.42), transparent 62%);
}
.sup-hero &gt; * { position: relative; z-index: 1; }
/* &quot;UK Care Sector&quot; in the raspberry gradient */
.grad-rasp {
  background: linear-gradient(135deg, #e30b5c, #900037);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: var(--raspberry);
}

/* ---- The three advantage cards ---- */
.adv { display: grid; grid-template-columns: 1fr; gap: var(--sp-md); }
.adv-card {
  background: var(--white);
  border: 1px solid var(--surface-variant);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  padding: var(--sp-md);
  display: flex; flex-direction: column; gap: 14px;
  transition: transform .2s ease, box-shadow .2s ease;
}
.adv-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.adv-card__icon {
  width: 52px; height: 52px; border-radius: var(--radius-card);
  display: flex; align-items: center; justify-content: center;
  transition: transform .2s ease;
}
.adv-card:hover .adv-card__icon { transform: scale(1.08); }
.adv-card__icon--teal { background: rgba(182,235,255,.5);  color: var(--teal); }
.adv-card__icon--rasp { background: rgba(255,217,221,.55); color: var(--raspberry); }
.adv-card__icon--blue { background: rgba(224,224,255,.7);  color: #4e55af; }
.adv-card h3 { font-size: 21px; }
.adv-card p { color: var(--text-muted); font-size: 15px; }

/* ---- Product categories, scrolled sideways by the arrows ---- */
.cats__head {
  display: flex; flex-direction: column; gap: var(--sp-md);
  justify-content: space-between; margin-bottom: var(--sp-lg);
}
.cats__arrows { display: none; gap: 10px; }
.cats__arrow {
  width: 46px; height: 46px; border-radius: var(--radius-pill);
  border: 1px solid var(--surface-variant); background: var(--white);
  display: flex; align-items: center; justify-content: center;
  color: var(--text); cursor: pointer; box-shadow: var(--shadow-card);
  transition: background .15s ease, border-color .15s ease;
}
.cats__arrow:hover { background: var(--surface-low); border-color: var(--raspberry); color: var(--raspberry); }
.cats__arrow:disabled { opacity: .4; cursor: default; }

.cats {
  display: grid; grid-auto-flow: column; grid-auto-columns: 86%;
  gap: var(--sp-md);
  overflow-x: auto; scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  padding-bottom: var(--sp-sm);
  scrollbar-width: none;
}
.cats::-webkit-scrollbar { display: none; }
.cat { scroll-snap-align: start; cursor: pointer; }
.cat__photo {
  height: 240px; border-radius: var(--radius-card); overflow: hidden;
  border: 1px solid var(--surface-variant); box-shadow: var(--shadow-card);
  margin-bottom: 14px; background: var(--white);
}
.cat__photo img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.cat:hover .cat__photo img { transform: scale(1.03); }
.cat h3 { font-size: 20px; margin-bottom: 4px; transition: color .15s ease; }
.cat:hover h3 { color: var(--raspberry); }
.cat p { color: var(--text-muted); font-size: 15px; }

/* Dots under the carousel, for phones */
.cats__dots { display: flex; justify-content: center; gap: 4px; margin-top: 4px; }
/* The button is 44px tall so it is easy to tap; the visible dot inside it
   stays small. Tapping anywhere in that invisible area works. */
.cats__dot {
  width: 32px; height: 44px;
  background: none; border: none; padding: 0; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.cats__dot::after {
  content: &quot;&quot;; display: block;
  width: 8px; height: 8px; border-radius: var(--radius-pill);
  background: var(--surface-variant);
  transition: width .2s ease, background .2s ease;
}
.cats__dot.is-active::after { background: var(--raspberry); width: 22px; }

/* ---- The supplier dashboard mock ---- */
.portal {
  background: var(--white);
  border: 1px solid var(--surface-variant);
  border-radius: 14px;
  box-shadow: var(--shadow-photo);
  padding: var(--sp-md);
  max-width: 500px;
}
.portal__bar {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 14px; margin-bottom: var(--sp-md);

}
.portal__brand { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
.portal__logo {
  width: 30px; height: 30px; border-radius: 6px; background: var(--raspberry);

.portal__figure {
  background: var(--surface-low); border: 1px solid var(--surface-variant);
  border-radius: 10px; padding: 16px;
}
.portal__label { font-size: 12.5px; color: var(--text-muted); margin-bottom: 6px; }
.portal__value { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; }
.portal__trend { font-size: 12.5px; color: var(--raspberry); font-weight: 600;
                 display: flex; align-items: center; gap: 5px; }

.portal__ship {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border: 1px solid var(--surface-variant); border-radius: 10px;
  padding: 12px 14px; margin-top: 10px;
}
.portal__ship-left { display: flex; align-items: center; gap: 12px; }
.portal__ship-icon {
  width: 36px; height: 36px; border-radius: 8px; background: #eaedff;
  color: var(--text-muted); display: flex; align-items: center; justify-content: center;
}
.portal__ship strong { display: block; font-size: 14px; font-weight: 600; }
.portal__ship span { font-size: 12.5px; color: var(--text-muted); }
.portal__chip {
  font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  padding: 4px 10px; border-radius: var(--radius-pill); white-space: nowrap;
}
.portal__chip--transit { background: rgba(182,235,255,.55); color: var(--teal); }
.portal__chip--done { background: #e2e7ff; color: var(--text-muted); }

/* The tick list beside the dashboard */
.ticks { display: flex; flex-direction: column; gap: 14px; margin-top: var(--sp-sm); }
.tick { display: flex; align-items: center; gap: 14px; font-size: 15.5px; }
.tick__ring {

  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}

/* ---- Uncompromising Standards, on dark navy ---- */
.standards { background: #283044; color: rgba(255,255,255,.72); padding: var(--sp-xl) 0; }
.standards h2 { color: var(--white); }
.standards &gt; .wrap &gt; .standards__grid &gt; div &gt; p { color: rgba(255,255,255,.7); }
.standards__grid { display: grid; grid-template-columns: 1fr; gap: var(--sp-lg); align-items: center; }
.standards__badges { display: grid; grid-template-columns: 1fr; gap: var(--sp-md); margin-top: var(--sp-sm); }
.std-badge { display: flex; align-items: center; gap: 14px; }
.std-badge__icon {
  width: 46px; height: 46px; border-radius: 10px;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.std-badge span { font-size: 16px; font-weight: 600; color: var(--white); }

.requirements {
  position: relative; overflow: hidden;
  background: var(--lavender); color: var(--text);
  border-radius: 14px; padding: var(--sp-lg) var(--sp-md);
  box-shadow: var(--shadow-photo);
}
.requirements::before {
  content: &quot;&quot;; position: absolute; top: 0; right: 0;
  width: 120px; height: 120px; background: var(--raspberry);
  opacity: .18; border-radius: 0 14px 0 100%;
}
.requirements h3 { font-size: 22px; margin-bottom: var(--sp-md); position: relative; }
.requirements ul { position: relative; display: flex; flex-direction: column; }
.requirements li {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;

}
.requirements li:last-child { border-bottom: none; }
.requirements li .ico { color: rgba(227,11,92,.45); width: 17px; height: 17px; }

/* ---- Final call to action ---- */
.sup-final { background: #eaedff; padding: var(--sp-xl) 0; text-align: center; }
.sup-final h2 { font-size: 34px; }
.sup-final p { color: var(--text-muted); font-size: 18px; max-width: 40em; margin: var(--sp-sm) auto var(--sp-md); }

/* ---- This page&#x27;s footer is one row, as in the design ---- */
.sup-footer { background: #283044; color: var(--white); padding: var(--sp-lg) 0; }
.sup-footer__inner {
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-md);
  text-align: center;

.sup-footer .logo { color: var(--white); }

.sup-footer__copy { font-size: 14px; color: rgba(255,255,255,.4); }

@media (min-width: 700px) {
  .adv { grid-template-columns: repeat(3, 1fr); }
  .cats { grid-auto-columns: calc((100% - 2 * var(--sp-md)) / 3); }

  .cats__head { flex-direction: row; align-items: flex-end; }
  .cats__arrows { display: flex; }
  .standards__grid { grid-template-columns: 1fr 1fr; }
  .sup-footer__inner { flex-direction: row; justify-content: space-between; text-align: left; }
}

      burger.setAttribute(&#x27;aria-label&#x27;, &#x27;Open menu&#x27;);

/* ------------------------------------------------------------------
   2. The product category carousel.
   The cards sit in a row that can scroll sideways. The arrows scroll it
   by one card, and the dots show which card you are on. Everything still
   works by swiping if this script never runs.
   ------------------------------------------------------------------ */
(function () {
  var track = document.getElementById(&#x27;cats&#x27;);
  var prev = document.getElementById(&#x27;catsPrev&#x27;);
  var next = document.getElementById(&#x27;catsNext&#x27;);
  var dots = document.getElementById(&#x27;catsDots&#x27;);
  if (!track) { return; }

  var cards = track.querySelectorAll(&#x27;.cat&#x27;);

  var step = function () {
    /* How far one card is from the next, including the gap. */
    if (cards.length &lt; 2) { return track.clientWidth; }
    return cards[1].offsetLeft - cards[0].offsetLeft;
  };

  if (prev) { prev.addEventListener(&#x27;click&#x27;, function () { track.scrollLeft -= step(); }); }
  if (next) { next.addEventListener(&#x27;click&#x27;, function () { track.scrollLeft += step(); }); }

  if (dots) {
    var buttons = dots.querySelectorAll(&#x27;.cats__dot&#x27;);

    /* Clicking a dot scrolls to that card. */
    buttons.forEach(function (button, index) {
      button.addEventListener(&#x27;click&#x27;, function () {
        track.scrollLeft = index * step();
      });
    });

    /* Scrolling updates which dot is filled in. */
    track.addEventListener(&#x27;scroll&#x27;, update);
  }

  /* Grey out an arrow when there is nothing further that way. On a wide screen
     all three cards fit at once, so both arrows are correctly disabled - which
     is why this has to run on load and on resize, not only when scrolling. */
  function update() {
    var atStart = track.scrollLeft &lt; 5;
    var atEnd = track.scrollLeft + track.clientWidth &gt;= track.scrollWidth - 5;
    if (prev) { prev.disabled = atStart; }
    if (next) { next.disabled = atEnd; }

    if (dots) {
      var current = Math.round(track.scrollLeft / step());
      dots.querySelectorAll(&#x27;.cats__dot&#x27;).forEach(function (button, index) {
        button.classList.toggle(&#x27;is-active&#x27;, index === current);
      });
    }
  }

  update();
  window.addEventListener(&#x27;resize&#x27;, update);
})();
&lt;/script&gt;

/* ==========================================================================

/* ==========================================================================

:root {
