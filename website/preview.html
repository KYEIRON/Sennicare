/* ==========================================================================
   6. SAVINGS CALCULATOR (used by savings-calculator.html)
   These styles are only used on the calculator page. They reuse the same
   brand colours and fonts defined at the top of this file.
   ========================================================================== */

/* The overall two-column layout: inputs on the left, results on the right.
   &quot;1fr 1fr&quot; means two equal columns. On mobile this becomes one column
   (see the media query at the bottom of this section). */
.calc {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 34px;
  align-items: start;
}

/* ---- Left column: the input panel ---- */
.calc__inputs {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 30px;
  box-shadow: var(--shadow-soft);
}
.calc__inputs h2 { font-size: 24px; margin-bottom: 6px; }
.calc__intro { font-size: 16px; margin-bottom: 26px; }

/* One question (label + input) */
.calc-field { margin-bottom: 26px; }
.calc-field:last-of-type { margin-bottom: 8px; }

/* The label sits on one line, with the current value shown on the right */
.calc-field__top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 10px;
}
.calc-field__label {
  font-size: 16px;
  font-weight: 600;
  color: var(--navy);
}
/* The live value shown beside a slider, e.g. &quot;14 suppliers&quot; or &quot;8%&quot; */
.calc-field__value {
  font-size: 17px;
  font-weight: 800;
  color: var(--cyan);
  white-space: nowrap;
}
.calc-field__hint {
  font-size: 14px;
  color: var(--text-body);
  margin: 8px 0 0;
}

/* A text box for typing a number, with a £ symbol tucked inside on the left */
.calc-money {
  position: relative;
}
.calc-money__symbol {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 17px;
  font-weight: 700;
  color: var(--navy);
  pointer-events: none;   /* clicks pass through to the input behind it */
}
.calc-field input[type=&quot;number&quot;] {
  width: 100%;
  padding: 13px 14px;
  font-family: var(--font);
  font-size: 17px;
  font-weight: 600;
  color: var(--navy);
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  transition: border-color 0.2s ease;
}
.calc-money input[type=&quot;number&quot;] { padding-left: 32px; }   /* room for the £ */
.calc-field input[type=&quot;number&quot;]:focus { border-color: var(--cyan); }

/* ---- Sliders ----
   Sliders need a few browser-specific lines to look the same everywhere.
   &quot;appearance: none&quot; removes the browser&#x27;s default look so ours shows. */
.calc-field input[type=&quot;range&quot;] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 8px;
  margin: 6px 0;
  border-radius: 999px;
  background: var(--border);   /* the track the handle slides along */
  cursor: pointer;
}
/* The round handle - Chrome, Edge and Safari */
.calc-field input[type=&quot;range&quot;]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--cyan);
  border: 4px solid var(--white);
  box-shadow: 0 2px 8px rgba(10, 17, 114, 0.28);
  cursor: pointer;
}
/* The round handle - Firefox */
.calc-field input[type=&quot;range&quot;]::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--cyan);
  border: 4px solid var(--white);
  box-shadow: 0 2px 8px rgba(10, 17, 114, 0.28);
  cursor: pointer;
}
/* Small &quot;1&quot; and &quot;30&quot; labels under a slider, showing its range */
.calc-field__scale {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--text-body);
  margin-top: 2px;
}

/* The little &quot;Reset&quot; link at the bottom of the inputs panel */
.calc__reset {
  background: none;
  border: none;
  padding: 0;
  margin-top: 6px;
  font-family: var(--font);
  font-size: 15px;
  font-weight: 600;
  color: var(--cyan);
  cursor: pointer;
  text-decoration: underline;
}

/* ---- Right column: the results panel ---- */
/* &quot;sticky&quot; keeps the results visible on screen while you scroll the inputs. */
.calc__results {
  position: sticky;
  top: calc(var(--nav-height) + 20px);
}

/* A single result: big number + label */
.result {
  background: var(--grey-light);
  border-radius: var(--radius);
  padding: 22px 24px;
  margin-bottom: 16px;
  border-left: 4px solid var(--cyan);
}
.result__label {
  display: block;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-body);
  margin-bottom: 4px;
}
.result__value {
  display: block;
  font-size: 38px;
  font-weight: 800;
  line-height: 1.1;
  color: var(--navy);
  letter-spacing: -0.02em;
}
.result__note {
  display: block;
  font-size: 14px;
  color: var(--text-body);
  margin-top: 6px;
}

/* The headline total, highlighted in magenta */
.result--total {
  background: rgba(227, 11, 92, 0.06);   /* very pale magenta tint */
  border: 2px solid var(--magenta);
  border-left-width: 6px;
  padding: 28px;
}
.result--total .result__label {
  color: var(--magenta-dark);
  font-size: 16px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.result--total .result__value {
  color: var(--magenta);
  font-size: 54px;
}
/* The &quot;plus X hours given back&quot; line under the total */
.result--total .result__note {
  font-size: 17px;
  font-weight: 600;
  color: var(--navy);
  margin-top: 10px;
}

/* The consolidation recommendation box */
.calc-recommend {
  background: var(--navy);
  color: rgba(255, 255, 255, 0.9);
  border-radius: var(--radius);
  padding: 22px 24px;
  margin-bottom: 16px;
  font-size: 16px;
}
.calc-recommend strong { color: var(--white); }

/* The call-to-action block underneath the results */
.calc-cta {
  margin-top: 22px;
  text-align: center;
}
.calc-cta .btn { width: 100%; }
.calc-cta__secondary {
  display: inline-block;
  margin-top: 14px;
  font-size: 15px;
  font-weight: 600;
  color: var(--cyan);
}

/* Small print explaining where the percentages come from */
.calc-assumptions {
  margin-top: 40px;
  padding: 26px 28px;
  background: var(--grey-light);
  border-radius: var(--radius);
  font-size: 15px;
}
.calc-assumptions h3 { font-size: 18px; margin-bottom: 12px; }
.calc-assumptions ul { margin: 0; padding-left: 20px; }
.calc-assumptions li { margin-bottom: 8px; }

/* ---- Calculator: mobile and tablet ---- */
@media (max-width: 980px) {
  .calc { grid-template-columns: 1fr; }   /* stack into one column */
  /* Sticky results make no sense once stacked, so switch it off */
  .calc__results { position: static; }
}
@media (max-width: 700px) {
  .calc__inputs { padding: 24px 20px; }
  .result__value { font-size: 32px; }
  .result--total { padding: 24px 20px; }
  .result--total .result__value { font-size: 42px; }
}

        navToggle.setAttribute(&#x27;aria-label&#x27;, &#x27;Open menu&#x27;);
      }
    });
  }


  /* ======================================================================
     2. SHADOW UNDER THE NAVIGATION BAR WHEN SCROLLED
     ====================================================================== */
  var navbar = document.getElementById(&#x27;navbar&#x27;);

  if (navbar) {
    // This function decides whether the shadow should be on or off.
    var updateNavbar = function () {
      if (window.scrollY &gt; 10) {
        navbar.classList.add(&#x27;is-scrolled&#x27;);
      } else {
        navbar.classList.remove(&#x27;is-scrolled&#x27;);
      }
    };

    updateNavbar();                                   // check once on load
    window.addEventListener(&#x27;scroll&#x27;, updateNavbar);  // then on every scroll
  }


  /* ======================================================================
     3. CONTACT FORM
     A plain website (with no server behind it) cannot send an email on its
     own. So we do the next simplest thing: check the fields are filled in,
     then open the visitor&#x27;s own email app with everything pre-written.

     If you would rather the form emailed you directly without opening the
     visitor&#x27;s email app, see README.md - it is a free, one-line change.
     ====================================================================== */
  var form        = document.getElementById(&#x27;contactForm&#x27;);
  var formMessage = document.getElementById(&#x27;formMessage&#x27;);

  if (form &amp;&amp; formMessage) {

    // Small helper so we can show a message in one line of code.
    var showMessage = function (text, type) {
      formMessage.textContent = text;
      formMessage.className = &#x27;form__message is-visible is-&#x27; + type; // type = &#x27;success&#x27; or &#x27;error&#x27;
    };

    form.addEventListener(&#x27;submit&#x27;, function (event) {
      event.preventDefault();   // stop the browser reloading the page

      // Read what the visitor typed, trimming off any stray spaces.
      var name     = form.name.value.trim();
      var email    = form.email.value.trim();
      var carehome = form.carehome.value.trim();
      var message  = form.message.value.trim();

      // --- Check nothing important is missing ---
      if (!name || !email || !carehome || !message) {
        showMessage(&#x27;Please fill in all four fields so we can help you properly.&#x27;, &#x27;error&#x27;);
        return;   // stop here
      }

      // --- Check the email address looks like an email address ---
      // This pattern means: some characters, an @, some characters, a dot, some characters.
      var looksLikeEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      if (!looksLikeEmail) {
        showMessage(&#x27;That email address does not look quite right. Please check it.&#x27;, &#x27;error&#x27;);
        return;
      }

      // --- Build the email ---
      var subject = &#x27;Free operational review request - &#x27; + carehome;

      // &quot;\n&quot; means &quot;start a new line&quot;. encodeURIComponent makes the text safe
      // to put inside a web link (spaces, ampersands and so on).
      var body =
        &#x27;Name: &#x27; + name + &#x27;\n&#x27; +
        &#x27;Email: &#x27; + email + &#x27;\n&#x27; +
        &#x27;Care home: &#x27; + carehome + &#x27;\n\n&#x27; +
        &#x27;Message:\n&#x27; + message + &#x27;\n&#x27;;

      var mailtoLink = &#x27;mailto:&#x27; + SENNICARE_EMAIL +
                       &#x27;?subject=&#x27; + encodeURIComponent(subject) +
                       &#x27;&amp;body=&#x27;    + encodeURIComponent(body);

      // Open the visitor&#x27;s email program with the message ready to send.
      window.location.href = mailtoLink;

      showMessage(&#x27;Thank you, &#x27; + name + &#x27;. Your email program should now open with &#x27; +
                  &#x27;your enquiry ready to send. If it does not, please email us at &#x27; +
                  SENNICARE_EMAIL + &#x27;.&#x27;, &#x27;success&#x27;);
    });
  }

});

&lt;/script&gt;

&lt;script&gt;
document.addEventListener(&#x27;click&#x27;, function (e) {
  var a = e.target.closest &amp;&amp; e.target.closest(&#x27;a[href]&#x27;);
  if (!a) return;
  var href = a.getAttribute(&#x27;href&#x27;) || &#x27;&#x27;;
  if (href.charAt(0) === &#x27;#&#x27; || /^(mailto:|tel:|https?:)/.test(href)) return;
  var m = href.match(/([A-Za-z0-9._-]+\.html)(#.*)?$/);
  if (!m) return;
  e.preventDefault();
  parent.postMessage({ sennicareGoTo: m[1] }, &#x27;*&#x27;);
});
&lt;/script&gt;
&lt;/body&gt;

<script>
  var stages = document.getElementById('stages');
  var nowfile = document.getElementById('nowfile');

  // Switch which page is on the stage.
  function show(slug) {
    document.querySelectorAll('.tab').forEach(function (t) {
      var on = t.dataset.slug === slug;
      t.classList.toggle('is-active', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    document.querySelectorAll('.stage').forEach(function (s) {
      var on = s.dataset.slug === slug;
      s.classList.toggle('is-active', on);
      if (on) nowfile.textContent = s.dataset.file;
    });
  }

  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () { show(t.dataset.slug); });
  });

  // Screen-width buttons resize the stage so you can feel the mobile layout.
  document.querySelectorAll('.size').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.size').forEach(function (o) { o.classList.remove('is-active'); });
      b.classList.add('is-active');
      stages.style.setProperty('--stage-w', b.dataset.w);
    });
  });

  // Links between pages inside an iframe switch the tab instead.
  var fileToSlug = {"home.html": "home", "product.html": "product", "pricing.html": "pricing", "suppliers.html": "suppliers", "index.html": "index", "savings-calculator.html": "calculator", "privacy.html": "privacy", "terms.html": "terms"};
  window.addEventListener('message', function (e) {
    var f = e.data && e.data.sennicareGoTo;
    if (f && fileToSlug[f]) show(fileToSlug[f]);
  });
</script>
